<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supply Checkout</title>
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" id="home" href="./" aria-label="Supply Checkout home">
      <div class="bars" aria-hidden="true"><i style="width:3px"></i><i style="width:1px"></i><i style="width:2px"></i><i style="width:1px"></i><i style="width:4px"></i><i style="width:1px"></i><i style="width:2px"></i></div>
      <h1>Supply Checkout</h1>
    </a>
    <nav class="tabs" aria-label="Sections">
      <button type="button" id="tab-projects" aria-pressed="true">Projects</button>
      <button type="button" id="tab-prices" aria-pressed="false">Inventory</button>
    </nav>
    <div class="theme" id="theme" role="group" aria-label="Theme">
      <button type="button" data-theme="system" aria-pressed="true" aria-label="System theme" title="System theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button type="button" data-theme="light" aria-pressed="false" aria-label="Light theme" title="Light theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-theme="dark" aria-pressed="false" aria-label="Dark theme" title="Dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <main id="main"></main>

  <section id="projectView" hidden>
    <button type="button" class="btn ghost back" id="backBtn">← All projects</button>
    <div id="projectHead"></div>
    <div class="scanbar" id="scanbar">
      <div class="mode" role="group" aria-label="What are you doing?">
        <button type="button" data-mode="out" aria-pressed="true">Check out</button>
        <button type="button" data-mode="return" aria-pressed="false">Return</button>
      </div>
      <div class="scan-row">
        <label class="btn primary big" for="scanFile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
          <span id="scanLabel">Scan barcode</span>
        </label>
        <input class="vh" type="file" id="scanFile" accept="image/*" capture="environment" aria-label="Barcode photo" data-barcode>
        <form class="manual" id="manualForm">
          <label class="vh" for="manualCode">Barcode number</label>
          <input type="text" id="manualCode" inputmode="numeric" autocomplete="off" placeholder="Or type the barcode">
          <button type="submit" class="btn">Enter</button>
        </form>
      </div>
      <button type="button" class="btn" id="noCodeBtn">Add item without a barcode</button>
      <p class="hint" id="modeHint">Take a photo of the barcode, then choose how many you're taking.</p>
    </div>
    <div id="projectBody"></div>
  </section>

  <section id="receiptView" hidden>
    <button type="button" class="btn ghost back" id="rBack">← All projects</button>
    <div id="rBody"></div>
  </section>
  <input class="vh" type="file" id="receiptFile" accept="image/*" aria-label="Receipt photo">
</div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="./main.js"></script>
</body>
</html>
