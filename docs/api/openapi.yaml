openapi: 3.1.0
info:
  title: Supply Checkout API
  version: 1.0.0
  summary: Team data (products and sheets), the signed-in user's teams and invites, and sign-in sessions for the web app.
  description: |
    The HTTP API in front of the data Lambdas (ADR 0006). The browser adapter
    (supply-checkout-a2b) implements the app's `window.claude.use("db")` on
    these routes; the handlers are in `backend/src/api/` and the route table
    they share with the CDK app is `backend/src/api/routes.ts`. A test
    (`backend/test/openapi.test.ts`) keeps this file and that table in step.

    ## Mapping the app's db calls

    | App call (src/main.js) | Request |
    | --- | --- |
    | `db.collection("products").onSnapshot(cb)` | `GET /teams/{teamId}/products`, following `cursor` until absent; `snap.docs[i].id` = `id`, `.data()` = `data` |
    | `db.collection("sheets").orderBy("date", "desc").onSnapshot(cb)` | `GET /teams/{teamId}/sheets?orderBy=date&direction=desc`, following `cursor` |
    | `db.doc("<coll>/<id>").get()` | `GET /teams/{teamId}/<coll>/<id>`; 404 `not_found` means `exists: false` |
    | `db.doc("<coll>/<id>").set(data)` | `PUT /teams/{teamId}/<coll>/<id>` with `{"data": data}` |
    | `db.doc("<coll>/<id>").update(patch)` | `PATCH /teams/{teamId}/<coll>/<id>` with `{"data": patch}` (deep merge) |
    | `db.doc("<coll>/<id>").delete()` | `DELETE /teams/{teamId}/<coll>/<id>` |
    | `db.collection("sheets").doc()` | no request: the adapter makes the ID (e.g. `crypto.randomUUID()`), then `set` PUTs it |

    - **Checkout and return** don't use `PATCH` plus a stock update: they're
      the commands under the `commands` tag, each one transaction that's
      idempotent by operation ID. [commands.md](commands.md) is the client
      contract. The edit screens keep using the document routes.
    - Percent-encode the document ID as one path segment
      (`encodeURIComponent`). Product keys are what the app's `keyOf` or
      `newKey` makes; any key without `/` or control characters works.
    - Reject a call with the error body's `code` as the error's `code`, so the
      app's existing handling applies unchanged: `invalid_argument` (403)
      makes it switch to view-only, `quota_exceeded` (413) shows "storage is
      full", and anything else shows the generic "didn't save" message.
    - `teamId` is the team the user picked (`GET /me` lists them; see
      [onboarding.md](onboarding.md) for first sign-in and the team switcher).
      The server checks membership on every request; the body never names a
      team.
    - Live updates (`onSnapshot` after the first load) come from AppSync Events
      (supply-checkout-dpc), not from polling these routes. Every write here is
      a single PutItem or DeleteItem on the document's item, so each produces
      exactly one DynamoDB stream record (NEW_AND_OLD_IMAGES) with the new
      `version`.

    ## Document semantics

    - A document is any JSON object up to 350,000 bytes (UTF-8 JSON), nested
      at most 16 levels, with numbers DynamoDB can store. These top-level
      fields are the server's and are refused in a body: `PK`, `SK`, `GSI1PK`,
      `GSI1SK`, `GSI2PK`, `GSI2SK`, `type`, `id`, `key`, `version`, `teamId`. For products,
      `stock` must be a number if present; for sheets, `date` must be a string
      and `items` an object. A barcode (`code`, on a product and on each line
      in a sheet's `items`) must be a string of at most 256 characters, the
      product key limit; it's empty for an item without a barcode.
    - Every other field is kept exactly as written. The `Product`, `Sheet` and
      `SheetLine` schemas list the fields the app writes; all of them,
      including each line's `code`, read back unchanged.
    - `update` merges like the artifact runtime: where the patch and the
      document both have an object at the same key, they merge key by key;
      any other value (including `null` and arrays) replaces.
    - Every write increments `version`. Send `expectedVersion` to make a write
      conditional (409 `aborted` if the document changed; `0` means "only if
      it doesn't exist"). Without it, a write that races another is retried on
      the fresh document, so the last writer wins, as in the artifact runtime.
    - Sheets ordered by date come from an index, which can lag a write by a
      moment. Unordered lists and single reads are strongly consistent. A
      sheet without a valid `YYYY-MM-DD` date sorts after every dated sheet
      when newest-first.

    ## Isolation

    Every data route needs a Cognito access token. The Lambda checks the
    caller's membership of the path's team on every request (roles:
    viewer reads; contributor and owner also write), and makes every DynamoDB
    call through a role session tagged with that team, whose IAM policy allows
    only that team's partition (`dynamodb:LeadingKeys`).

    The account routes (`/me`, `POST /teams`, `POST /invites/{inviteId}/accept`)
    need the same token. They name no team the caller is already in, so they
    run on a separate role session tagged with the caller's `sub` and at most
    one team and one invitee the request is entitled to (the new team, or the
    team whose invite matched the caller's verified email).
servers:
  - url: https://api.{envDomain}
    variables:
      envDomain:
        default: supplycheckout.com
        description: The environment's domain; staging and dev use `<env>.supplycheckout.com`.
security:
  - cognito: []
tags:
  - name: products
    description: The team's inventory, the app's `products` collection.
  - name: sheets
    description: Checkout sheets per client job, the app's `sheets` collection.
  - name: commands
    description: |
      Checkout, return and stock adjustments as single transactions, each
      idempotent by a client-generated operation ID, and an item's stock
      history. The client contract is in [commands.md](commands.md).
  - name: account
    description: The signed-in user's teams and pending invites, creating a team, and accepting an invite (first sign-in).
  - name: auth
    description: Sign-in sessions for the web app, with the refresh token in an HttpOnly cookie.
paths:
  /teams/{teamId}/products:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [products]
      operationId: listProducts
      summary: List the team's products (inventory), in key order.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/products/{key}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: key
        in: path
        required: true
        description: The product key, percent-encoded. Up to 256 characters, no `/` or control characters.
        schema: { type: string, minLength: 1, maxLength: 256 }
    get:
      tags: [products]
      operationId: getProduct
      summary: Read one product.
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [products]
      operationId: setProduct
      summary: Create or replace a product (the app's `set`).
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Deep-merge into an existing product (the app's `update`).
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Delete a product. Deleting one that doesn't exist succeeds.
      parameters: [{ $ref: "#/components/parameters/expectedVersion" }]
      responses:
        "204": { description: "Deleted, or already gone." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /teams/{teamId}/products/{key}/stock:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/productKey"
    post:
      tags: [commands]
      operationId: adjustStock
      summary: Change an item's stock outside a sheet, in one transaction, with a movement in its history.
      description: |
        - `reason: "receipt"`: `quantity` eaches bought at `unitCost` each
          (after any pack conversion, ADR 0014) are added to stock. An item
          that didn't track stock starts at `quantity`. The item's `price`
          and `cost` don't change; update the document for that.
        - `reason: "count"`: someone counted `count` in storage. Stock is set
          to it, and the movement records the difference.

        Contributors and owners only. Idempotent by `operationId`.
      requestBody: { $ref: "#/components/requestBodies/StockAdjust" }
      responses:
        "200": { $ref: "#/components/responses/CommandDone" }
        "400": { $ref: "#/components/responses/CommandRefused" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
  /teams/{teamId}/products/{key}/movements:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/productKey"
    get:
      tags: [commands]
      operationId: listMovements
      summary: An item's stock history, newest first. Any member can read it.
      parameters:
        - name: limit
          in: query
          description: At most this many movements. Default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of movements.
          content:
            application/json:
              schema:
                type: object
                required: [movements]
                properties:
                  movements:
                    type: array
                    items: { $ref: "#/components/schemas/Movement" }
                  cursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/sheets:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [sheets]
      operationId: listSheets
      summary: List the team's sheets, by ID (consistent) or by date (from an index).
      parameters:
        - name: orderBy
          in: query
          description: "`date` for date order, which the app's sheet list uses."
          schema: { type: string, enum: [date] }
        - name: direction
          in: query
          description: With `orderBy`. Default `asc`.
          schema: { type: string, enum: [asc, desc] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/sheets/{sheetId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: sheetId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    get:
      tags: [sheets]
      operationId: getSheet
      summary: Read one sheet.
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [sheets]
      operationId: setSheet
      summary: Create or replace a sheet (the app's `set`).
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    patch:
      tags: [sheets]
      operationId: updateSheet
      summary: Deep-merge into an existing sheet (the app's `update`), e.g. `{"data":{"items":{"<key>":{"returned":3}}}}`.
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      tags: [sheets]
      operationId: deleteSheet
      summary: Delete a sheet. Deleting one that doesn't exist succeeds.
      parameters: [{ $ref: "#/components/parameters/expectedVersion" }]
      responses:
        "204": { description: "Deleted, or already gone." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /teams/{teamId}/sheets/{sheetId}/checkout:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/sheetId"
    post:
      tags: [commands]
      operationId: checkoutItems
      summary: Check out whole eaches of an item onto a sheet, and take them off stock, in one transaction.
      description: |
        Adds `quantity` to the line's `out`, creating the line if it isn't on
        the sheet yet, and takes `quantity` off the product's `stock` if the
        product tracks stock. A new line copies `code`, `name`, `price` and
        `cost` from the product as the transaction finds it (ADR 0014); the
        request's `name`, `price`, `code` and `cost` are used only for an item
        that isn't in inventory, and then `name` and `price` are required. An
        existing line's copy never changes. The sheet must be open (any
        `status` but `closed`). Contributors and owners only. Idempotent by
        `operationId`: see [commands.md](commands.md).
      requestBody: { $ref: "#/components/requestBodies/Checkout" }
      responses:
        "200": { $ref: "#/components/responses/CommandDone" }
        "400": { $ref: "#/components/responses/CommandRefused" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
  /teams/{teamId}/sheets/{sheetId}/return:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/sheetId"
    post:
      tags: [commands]
      operationId: returnItems
      summary: Record whole eaches of a line coming back, and put them back in stock, in one transaction.
      description: |
        Adds `quantity` to the line's `returned`, which can never go above
        `out`, and adds `quantity` to the product's `stock` if the product
        tracks stock. Prices aren't touched. The sheet must be open: a closed
        sheet takes no returns (reopen it first, or correct the line's counts
        with a `PATCH`, which doesn't move stock). Contributors and owners
        only. Idempotent by `operationId`.
      requestBody: { $ref: "#/components/requestBodies/Return" }
      responses:
        "200": { $ref: "#/components/responses/CommandDone" }
        "400": { $ref: "#/components/responses/CommandRefused" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: The caller's teams (for the switcher) and pending invites.
      description: |
        Call after sign-in, before loading any team. `teams` lists every team
        the caller is a member of, sorted by name. `invites` lists live
        invites addressed to the caller's email, only if Cognito has verified
        it, leaving out teams the caller is already in. The user is always the
        token's `sub`: there is no way to ask about anyone else. Needs the
        `aws.cognito.signin.user.admin` scope in the access token (the server
        reads the email with Cognito's GetUser).
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                type: object
                required: [user, teams, invites]
                properties:
                  user:
                    type: object
                    required: [id, email, emailVerified]
                    properties:
                      id: { type: string, description: "The user's `sub`." }
                      email: { type: [string, "null"] }
                      emailVerified: { type: boolean, description: Invites are listed and accepted only when this is true. }
                  teams:
                    type: array
                    items: { $ref: "#/components/schemas/Team" }
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /teams:
    post:
      tags: [account]
      operationId: createTeam
      summary: Create a team, with the caller as its owner, on a 14-day trial.
      description: |
        The team's home region is the region that served the request (ADR
        0010), and its free trial starts now (ADR 0009: 14 days, no card).
        Idempotent: send a new `Idempotency-Key` for each "create team"
        attempt, and the same one on retries. A repeat with the same key
        returns the team the first request made (200) instead of making
        another; the same key with a different name is 409 `aborted`. A user
        can create 5 teams a day, and be in at most 20 teams (429
        `quota_exceeded` for either).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A new random value per attempt, e.g. `crypto.randomUUID()`, reused on retries and double-clicks.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200, description: Trimmed. }
      responses:
        "201": { $ref: "#/components/responses/TeamCreated" }
        "200": { $ref: "#/components/responses/TeamCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted`: this `Idempotency-Key` already made a team with another name."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyTeams" }
  /invites/{inviteId}/accept:
    parameters:
      - name: inviteId
        in: path
        required: true
        description: "The invite's ID, from the emailed link (it's also `id` in `GET /me`)."
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    post:
      tags: [account]
      operationId: acceptInvite
      summary: Join the team that invited the caller's verified email address.
      description: |
        Needs both the `token` from the emailed invite link (proof the caller
        read that mailbox) and a caller whose Cognito-verified email is the
        invite's address. The invite must not have expired, and it works once.
        The caller joins with the invite's role. A missing or wrong token is
        the same 404 as an unknown invite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, description: The `token` parameter of the emailed invite link, as is. }
      responses:
        "200":
          description: The team the caller joined.
          content:
            application/json:
              schema:
                type: object
                required: [team]
                properties:
                  team: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`permission_denied`: the caller's email isn't verified yet."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found`: no such invite for the caller's email, a missing or wrong token, or it expired or was already used."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`aborted`: the caller is already a member of the team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyTeams" }
  /auth/session:
    post:
      tags: [auth]
      operationId: createSession
      summary: Exchange the Managed Login authorization code for tokens.
      description: |
        Call after Managed Login redirects back with `?code=`, with
        `credentials: "include"`. Redeems the code and PKCE verifier at
        Cognito's `/oauth2/token`, returns the access and ID tokens (keep them
        in memory only), and sets the refresh token as an HttpOnly cookie.
      security: []
      parameters: [{ $ref: "#/components/parameters/origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, codeVerifier, redirectUri]
              properties:
                code: { type: string, pattern: "^[A-Za-z0-9_-]{1,2048}$" }
                codeVerifier: { type: string, pattern: "^[A-Za-z0-9._~-]{43,128}$" }
                redirectUri: { type: string, description: The redirect URI used to sign in; must be on the calling origin. }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignInAgain" }
        "403": { $ref: "#/components/responses/OriginRefused" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: New access and ID tokens from the refresh-token cookie.
      description: |
        Call with `credentials: "include"` before the access token expires
        (60 minutes) or after a 401. Refresh-token rotation is on: the cookie
        is replaced with the new refresh token on every call. A 401 clears the
        cookie; show sign-in.
      security: [{ refreshCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/origin" }]
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/SignInAgain" }
        "403": { $ref: "#/components/responses/OriginRefused" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      summary: Revoke the refresh token and clear the cookie.
      description: Always clears the cookie, even if revoking fails. Then send the user to Managed Login's `/logout`.
      security: [{ refreshCookie: [] }, {}]
      parameters: [{ $ref: "#/components/parameters/origin" }]
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearCookie" }
        "403": { $ref: "#/components/responses/OriginRefused" }
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Cognito **access token** from the environment's user pool and the web
        app client (`Authorization: Bearer <token>`). API Gateway checks the
        signature, expiry, issuer and client; the Lambda also requires
        `token_use: access` and an unexpired `exp`. ID tokens are refused.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-sc_refresh
      description: |
        The refresh token, set by `/auth/session` and `/auth/refresh`:
        `HttpOnly; Secure; SameSite=Strict; Path=/auth; Max-Age=2592000`.
        Requests must also carry an allowed `Origin` (CSRF protection).
  parameters:
    teamId:
      name: teamId
      in: path
      required: true
      description: The team. The caller must be a member; the body can't name a team.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    productKey:
      name: key
      in: path
      required: true
      description: The product key, percent-encoded. Up to 256 characters, no `/` or control characters, and not `__proto__`.
      schema: { type: string, minLength: 1, maxLength: 256 }
    sheetId:
      name: sheetId
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    limit:
      name: limit
      in: query
      description: At most this many documents. A page also stops at about 1 MB.
      schema: { type: integer, minimum: 1, maximum: 1000 }
    cursor:
      name: cursor
      in: query
      description: The `cursor` from the previous page, as is. Only valid for the same listing.
      schema: { type: string }
    expectedVersion:
      name: expectedVersion
      in: query
      description: Delete only if the document is at this version.
      schema: { type: integer, minimum: 0 }
    origin:
      name: Origin
      in: header
      required: true
      description: Must be one of the environment's app origins (`https://app.<env domain>`, and `http://localhost:5173` outside prod).
      schema: { type: string }
  headers:
    SetCookie:
      description: The rotated refresh token.
      schema: { type: string, example: "__Secure-sc_refresh=<token>; Path=/auth; Max-Age=2592000; HttpOnly; Secure; SameSite=Strict" }
    ClearCookie:
      description: Clears the refresh-token cookie.
      schema: { type: string, example: "__Secure-sc_refresh=; Path=/auth; Max-Age=0; HttpOnly; Secure; SameSite=Strict" }
  requestBodies:
    Write:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data:
                type: object
                description: The document (PUT) or the patch to merge (PATCH).
              expectedVersion:
                type: integer
                minimum: 0
                description: Write only if the document is at this version (0 = doesn't exist).
          examples:
            checkout:
              summary: Check out 3 of an item (PATCH a sheet)
              value: { data: { items: { "0123": { code: "0123", name: "Nitrile gloves", price: 12.5, out: 3, returned: 0 } } } }
    Checkout:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, productKey, quantity]
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              productKey: { type: string, minLength: 1, maxLength: 256, description: "The line's key: the product key (or a new key for a one-off item)." }
              quantity: { $ref: "#/components/schemas/Quantity" }
              name: { type: string, minLength: 1, maxLength: 200, description: Only for an item that isn't in inventory. Trimmed. }
              price: { allOf: [{ $ref: "#/components/schemas/Money" }], description: Only for an item that isn't in inventory. The client price per each. }
              code: { type: string, maxLength: 256, description: Only for an item that isn't in inventory. Its barcode, or empty. }
              cost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: Only for an item that isn't in inventory. What the business paid per each. }
          examples:
            inventoryItem:
              summary: Check out 3 of an item in inventory
              value: { operationId: "3b241101-e2bb-4255-8caf-4136c566a962", productKey: "0123", quantity: 3 }
            oneOff:
              summary: Check out an item that isn't in inventory
              value: { operationId: "a8098c1a-f86e-41b1-8e42-6b87b5ab13a6", productKey: "k-7f3a", quantity: 1, name: "Leftover storage bins", price: 4 }
    Return:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, productKey, quantity]
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              productKey: { type: string, minLength: 1, maxLength: 256, description: The line's key. }
              quantity: { $ref: "#/components/schemas/Quantity" }
    StockAdjust:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [operationId, reason, quantity, unitCost]
                properties:
                  operationId: { $ref: "#/components/schemas/OperationId" }
                  reason: { const: receipt }
                  quantity: { $ref: "#/components/schemas/Quantity" }
                  unitCost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: What was paid per each, before tax. }
              - type: object
                additionalProperties: false
                required: [operationId, reason, count]
                properties:
                  operationId: { $ref: "#/components/schemas/OperationId" }
                  reason: { const: count }
                  count: { type: integer, minimum: 0, maximum: 1000000, description: The number counted in storage. }
  schemas:
    OperationId:
      type: string
      format: uuid
      description: |
        A UUID the client makes for one intended action (`crypto.randomUUID()`)
        and sends again, unchanged, on every retry of it. The same ID returns
        the first result for 7 days; the same ID with a different request is
        `bad_request`.
    Quantity:
      type: integer
      minimum: 1
      maximum: 1000000
      description: Whole eaches (ADR 0014).
    Money:
      type: number
      minimum: 0
      maximum: 1000000
      multipleOf: 0.01
      description: US dollars before tax, at most two decimals (ADR 0014). More decimals are refused, not rounded.
    LineSnapshot:
      type: object
      required: [code, name, price]
      properties:
        code: { type: string }
        name: { type: string }
        price: { type: number }
        cost: { type: number, description: Absent when unknown. }
    CommandResult:
      type: object
      description: What the command did. Kept with the operation ID, and returned unchanged on a retry.
      required: [operationId, command, reason, productKey, stockDelta, userId, at]
      properties:
        operationId: { type: string, format: uuid }
        command: { type: string, enum: [checkout, return, stockAdjust] }
        reason: { type: string, enum: [checkout, return, receipt, count] }
        productKey: { type: string }
        sheetId: { type: string, description: Checkout and return. }
        quantity: { type: integer, description: Eaches checked out, returned or received. Absent for a count. }
        count: { type: integer, description: The level counted (count only). }
        stockDelta: { type: integer, description: "The change to the product's `stock`: 0 when it doesn't track stock or isn't in inventory." }
        lineCreated: { type: boolean, description: Checkout only. }
        snapshot: { $ref: "#/components/schemas/LineSnapshot" }
        unitCost: { type: number, description: Receipt only. }
        userId: { type: string }
        at: { type: string, format: date-time }
    Movement:
      type: object
      description: One change to an item's stock. The sum of an item's `delta`s is its change in stock.
      required: [type, productKey, reason, delta, tracked, operationId, userId, at]
      properties:
        type: { const: movement }
        productKey: { type: string }
        reason: { type: string, enum: [checkout, return, receipt, count] }
        delta: { type: integer, description: The change to `stock`. 0 when the item didn't track stock. }
        tracked: { type: boolean, description: Whether the item tracked stock. }
        quantity: { type: integer }
        count: { type: integer }
        sheetId: { type: string }
        unitCost: { type: number }
        operationId: { type: string, format: uuid }
        userId: { type: string }
        at: { type: string, format: date-time }
    Document:
      type: object
      required: [id, version, data]
      properties:
        id: { type: string, description: The product key or sheet ID. }
        version: { type: integer, minimum: 1 }
        data:
          type: object
          description: The document's fields as the app wrote them. `Product` and `Sheet` list the fields the app writes.
    Product:
      type: object
      description: "`data` of a document in `products` (src/main.js). Other fields are kept as written."
      properties:
        code: { type: string, maxLength: 256, description: The barcode; empty for an item without one. }
        name: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: number, description: The count in storage; absent if not counted. }
        updatedAt: { type: string, format: date-time }
    Sheet:
      type: object
      description: "`data` of a document in `sheets` (src/main.js). Other fields are kept as written."
      properties:
        client: { type: string }
        date: { type: string, description: "`YYYY-MM-DD`; sheets without a valid date sort last when newest-first." }
        createdBy: { type: [string, "null"], description: "The creator's user ID, or `null` without a signed-in user." }
        createdByName: { type: string, description: "Who prepared the sheet, when `createdBy` is `null`." }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [open, closed] }
        closedAt: { type: string, format: date-time }
        items:
          type: object
          description: The sheet's lines, keyed by product key.
          additionalProperties: { $ref: "#/components/schemas/SheetLine" }
        source:
          type: object
          description: The receipt the sheet was made from, when receipt scanning named a store.
          properties:
            store: { type: string }
            receiptDate: { type: string }
    SheetLine:
      type: object
      description: One line of a sheet. A PATCH may send only some fields (a return sends `returned`); the rest, including `code`, are kept.
      properties:
        code: { type: string, maxLength: 256, description: 'The barcode, exported as "Barcode" in the sheet CSV; empty for an item without one.' }
        name: { type: string }
        price: { type: number, minimum: 0 }
        cost: { type: number, minimum: 0, description: "What the business paid per each, copied from the product at the line's first checkout (ADR 0014). Absent when unknown." }
        out: { type: integer, minimum: 0, description: How many were taken. }
        returned: { type: integer, minimum: 0, description: How many came back. }
    Team:
      type: object
      required: [id, name, role, plan, status, trialEndsAt, homeRegion]
      properties:
        id: { type: string, description: "The `teamId` for the data routes." }
        name: { type: string }
        role: { type: string, enum: [owner, contributor, viewer], description: The caller's role in this team. }
        plan: { type: string, description: "`trial` until the team subscribes." }
        status: { type: string, description: "Subscription status (ADR 0009): `trialing`, `active`, `past_due`, `canceled`." }
        trialEndsAt: { type: [string, "null"], format: date-time, description: When the free trial ends. }
        homeRegion: { type: string, description: The region the team was created in (ADR 0010). }
    Invite:
      type: object
      description: A pending invite, to show. Accepting it needs the token from the invite email.
      required: [id, teamName, role, expiresAt]
      properties:
        id: { type: string, description: "The invite's ID, as in the emailed link." }
        teamName: { type: string }
        role: { type: string, enum: [owner, contributor, viewer], description: The role the caller joins with. }
        expiresAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthenticated, permission_denied, invalid_argument, not_found, aborted, quota_exceeded, internal]
            message: { type: string }
  responses:
    Document:
      description: The document after the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Document" }
    DocumentList:
      description: A page of documents.
      content:
        application/json:
          schema:
            type: object
            required: [documents]
            properties:
              documents:
                type: array
                items: { $ref: "#/components/schemas/Document" }
              cursor: { type: string, description: Absent on the last page. }
    CommandDone:
      description: |
        Done, now or by an earlier request with the same `operationId`
        (`replayed: true`, and nothing changed this time). `result` is what
        the first run did; `sheet` and `product` are the documents as they
        are now, read after the command.
      content:
        application/json:
          schema:
            type: object
            required: [operationId, replayed, result, product]
            properties:
              operationId: { type: string, format: uuid }
              replayed: { type: boolean }
              result: { $ref: "#/components/schemas/CommandResult" }
              sheet:
                description: Checkout and return only. `null` if the sheet has since been deleted.
                oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }]
              product:
                description: "`null` for an item that isn't in inventory."
                oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }]
    CommandRefused:
      description: |
        `bad_request`, nothing changed: a malformed body, a quantity that isn't
        a whole number from 1, money with more than two decimals, a return of
        more than is left out, an item that isn't on the sheet, an item not in
        inventory checked out without `name` and `price`, or an `operationId`
        already used for a different request. Don't retry it unchanged.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CommandConflict:
      description: |
        `aborted`, nothing changed: the sheet is closed, or the line or item
        kept changing under every retry. The message says which. A retry with
        the same `operationId` is safe.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Tokens:
      description: Tokens for the app to keep in memory. The refresh token is only in the cookie.
      headers:
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, idToken, expiresIn]
            properties:
              accessToken: { type: string }
              idToken: { type: string }
              expiresIn: { type: integer, description: Seconds. }
    TeamCreated:
      description: The team. 201 when this request made it, 200 when an earlier request with the same `Idempotency-Key` did.
      content:
        application/json:
          schema:
            type: object
            required: [team]
            properties:
              team: { $ref: "#/components/schemas/Team" }
    TooManyTeams:
      description: "`quota_exceeded`: the caller has created 5 teams today (UTC), or is already in 20 teams (the message says which)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: "`bad_request`: malformed JSON, ID, field, query or cursor."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: "`unauthenticated`: no token, an expired or ID token. (API Gateway's own 401 has the body `{\"message\":\"Unauthorized\"}`.)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: |
        `permission_denied`: not a member of this team (the same answer if the
        team doesn't exist). `invalid_argument`: a viewer tried to write; the
        app reads this as view-only access.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: "`not_found`: no such document (for a command: no such sheet, or for a stock adjustment no such item)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: "`aborted`: the document isn't at `expectedVersion`, or changed during every retry."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooLarge:
      description: "`quota_exceeded`: the document would be over 350,000 bytes (or the body over 1 MB)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SignInAgain:
      description: "`unauthenticated`: no cookie, or Cognito refused the code or refresh token. Clears the cookie."
      headers:
        Set-Cookie: { $ref: "#/components/headers/ClearCookie" }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    OriginRefused:
      description: "`permission_denied`: missing or unknown `Origin`."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: "`internal`: Cognito didn't answer, or answered without tokens. Try again."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
