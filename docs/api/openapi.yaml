openapi: 3.1.0
info:
  title: Supply Checkout API
  version: 1.0.0
  summary: Team data (products and sheets), the signed-in user's teams and invites, and sign-in sessions for the web app.
  description: |
    The HTTP API in front of the data Lambdas (ADR 0006). The browser adapter
    (supply-checkout-a2b) implements the app's `window.claude.use("db")` on
    these routes; the handlers are in `backend/src/api/` and the route table
    they share with the CDK app is `backend/src/api/routes.ts`. A test
    (`backend/test/openapi.test.ts`) keeps this file and that table in step.

    ## Mapping the app's db calls

    | App call (src/main.js) | Request |
    | --- | --- |
    | `db.collection("products").onSnapshot(cb)` | `GET /teams/{teamId}/products`, following `cursor` until absent; `snap.docs[i].id` = `id`, `.data()` = `data` |
    | `db.collection("sheets").orderBy("date", "desc").onSnapshot(cb)` | `GET /teams/{teamId}/sheets?orderBy=date&direction=desc`, following `cursor` |
    | `db.doc("<coll>/<id>").get()` | `GET /teams/{teamId}/<coll>/<id>`; 404 `not_found` means `exists: false` |
    | `db.doc("<coll>/<id>").set(data)` | `PUT /teams/{teamId}/<coll>/<id>` with `{"data": data}` |
    | `db.doc("<coll>/<id>").update(patch)` | `PATCH /teams/{teamId}/<coll>/<id>` with `{"data": patch}` (deep merge) |
    | `db.doc("<coll>/<id>").delete()` | `DELETE /teams/{teamId}/<coll>/<id>` |
    | `db.collection("sheets").doc()` | no request: the adapter makes the ID (e.g. `crypto.randomUUID()`), then `set` PUTs it |

    - **Checkout and return** don't use `PATCH` plus a stock update: they're
      the commands under the `commands` tag, each one transaction that's
      idempotent by operation ID. [commands.md](commands.md) is the client
      contract. The edit screens keep using the document routes.
    - Percent-encode the document ID as one path segment
      (`encodeURIComponent`). Product keys are what the app's `keyOf` or
      `newKey` makes; any key without `/` or control characters works.
    - Reject a call with the error body's `code` as the error's `code`, so the
      app's existing handling applies unchanged, except that a 403
      `permission_denied` with `reason: "view_only"` is rejected as
      `invalid_argument`, the artifact runtime's code that makes the app
      switch to view-only. `quota_exceeded` (413) shows "storage is
      full", `aborted` (409) says someone else changed it first (the adapter
      fetches the latest document before rejecting, so it shows), and anything
      else shows the generic "didn't save" message.
    - Send `expectedVersion` on every `set`, `update` and `delete`: the
      version of the copy held from the last list, fetch or write, or `0` for
      a document not held.
    - `teamId` is the team the user picked (`GET /me` lists them; see
      [onboarding.md](onboarding.md) for first sign-in and the team switcher).
      The server checks membership on every request; the body never names a
      team.
    - Live updates (`onSnapshot` after the first load) come from AppSync Events
      (supply-checkout-dpc), not from polling these routes. Every write here is
      a single PutItem or DeleteItem on the document's item, so each produces
      exactly one DynamoDB stream record (NEW_AND_OLD_IMAGES) with the new
      `version`.

    ## Document semantics

    - A document is any JSON object up to 350,000 bytes (UTF-8 JSON), nested
      at most 16 levels, with numbers DynamoDB can store. These top-level
      fields are the server's and are refused in a body: `PK`, `SK`, `GSI1PK`,
      `GSI1SK`, `GSI2PK`, `GSI2SK`, `GSI3PK`, `GSI3SK` (and any `GSI<n>PK` or `GSI<n>SK`), `type`, `id`, `key`, `version`, `teamId`. For sheets, `date` must be a string
      and `items` an object. A barcode (`code`, on a product and on each line
      in a sheet's `items`) must be a string of at most 256 characters, the
      product key limit; it's empty for an item without a barcode. A line's
      `cost`, if present, must be a `Money` amount (0 to 1,000,000, at most
      two decimals; ADR 0014).
    - A product's `stock` changes only through the stock commands (the
      `commands` tag) and the CSV import, which record a movement for every
      change. A product `set` or `update` keeps the stored `stock`: leave it
      out of the body (the stored value is kept, or stays absent), or repeat
      the stored value exactly. Any other `stock`, including one on a product
      that doesn't track stock or doesn't exist yet, is 400 `bad_request` and
      changes nothing. A new item starts counting with a `count` adjustment
      after it's created. See [commands.md](commands.md).
    - Every other field is kept exactly as written. The `Product`, `Sheet` and
      `SheetLine` schemas list the fields the app writes; all of them,
      including each line's `code`, read back unchanged.
    - `update` merges like the artifact runtime: where the patch and the
      document both have an object at the same key, they merge key by key;
      any other value (including `null` and arrays) replaces.
    - Every write increments `version`, and every write must send
      `expectedVersion` (ADR 0006): the version it was made against, or `0`
      for a document that shouldn't exist yet. If the document is at another
      version, or changes between the server's read and its write, the write
      fails with 409 `aborted` and changes nothing; fetch the document and
      make the change again on the latest values. A write without it is 400
      `bad_request`.
    - Sheets ordered by date come from an index, which can lag a write by a
      moment. Unordered lists and single reads are strongly consistent. A
      sheet without a valid `YYYY-MM-DD` date sorts after every dated sheet
      when newest-first.

    ## Isolation

    Every data route needs a Cognito access token. The Lambda checks the
    caller's membership of the path's team on every request, and their role
    against the route's (ADR 0007: viewers read; contributors also scan and
    edit sheets and inventory; owners also import and manage members), and
    makes every DynamoDB call through a role session tagged with that team,
    whose IAM policy allows only that team's partition
    (`dynamodb:LeadingKeys`). A role below the route's is 403
    `permission_denied` with `reason` `view_only` or `owners_only`.

    The account routes (`/me`, `/me/email/*`, `POST /teams`, `POST /invites/{inviteId}/accept`)
    need the same token. They name no team the caller is already in, so they
    run on a separate role session tagged with the caller's `sub` and at most
    one team and one invitee the request is entitled to (the new team, or the
    team whose invite matched the caller's verified email). The members
    routes run there too, on the path's team after the same membership and
    role checks: changing or removing another member also updates or deletes
    that member's own team-switcher row, so only those sessions carry a tag
    for that member's partition, and only for updates and deletes. The
    invites routes run there too: creating or re-sending an invite also
    counts it against the invited address's daily limit, so only those
    sessions carry a tag for that address's counter, and only for updates.
servers:
  - url: https://api.{envDomain}
    variables:
      envDomain:
        default: supplycheckout.com
        description: The environment's domain; staging and dev use `<env>.supplycheckout.com`.
security:
  - cognito: []
tags:
  - name: products
    description: The team's inventory, the app's `products` collection.
  - name: sheets
    description: Checkout sheets per client job, the app's `sheets` collection.
  - name: commands
    description: |
      Checkout, return and stock adjustments as single transactions, each
      idempotent by a client-generated operation ID, and an item's stock
      history. The client contract is in [commands.md](commands.md).
  - name: account
    description: The signed-in user's teams and pending invites, creating a team, and accepting an invite (first sign-in).
  - name: members
    description: A team's members and roles (ADR 0007). Owners list members, change roles and remove members; anyone can leave; a team always keeps an owner.
  - name: invites
    description: |
      A team's invites (ADR 0007). Owners invite an address with a role, and
      the server emails it a link with a single-use token (only its hash is
      stored) that expires in 7 days. Owners see each invite as pending,
      failed (its email bounced, drew a complaint or couldn't be sent) or
      expired, and can revoke or re-send it. Joining is
      `POST /invites/{inviteId}/accept` ([onboarding.md](onboarding.md)).
  - name: auth
    description: Sign-in sessions for the web app, with the refresh token in an HttpOnly cookie.
  - name: ops
    description: |
      Platform operators (ADR 0015), primary region only: list and search
      teams, read one team's account record, comp a team, and read the
      operator audit. Every route needs an access token from the **operator**
      user pool (`opsCognito`), whose user must be in the `operators` group;
      a customer's token is refused. Removing, disabling or signing out an
      operator takes effect on their next request. Operators never read a
      team's sheets, inventory, invites or receipts. Every change, and every
      read of one team's record, is audited, and the team's owners see it
      (`GET /teams/{teamId}/support-actions`). `npm run ops` is the client.
paths:
  /teams/{teamId}/products:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [products]
      operationId: listProducts
      summary: List the team's products (inventory), in key order.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/products/{key}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: key
        in: path
        required: true
        description: The product key, percent-encoded. Up to 256 characters, no `/` or control characters.
        schema: { type: string, minLength: 1, maxLength: 256 }
    get:
      tags: [products]
      operationId: getProduct
      summary: Read one product.
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [products]
      operationId: setProduct
      summary: Create or replace a product (the app's `set`), keeping its stored `stock`.
      description: |
        Replaces every field but `stock`, which only the stock commands change:
        the stored `stock` is kept when the body leaves it out, and a body
        `stock` that differs from it (any `stock` for a new product, or one
        that doesn't track stock) is 400 `bad_request`.
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Deep-merge into an existing product (the app's `update`), keeping its stored `stock`.
      description: A patch `stock` that differs from the stored one (or any, if the product doesn't track stock) is 400 `bad_request`; only the stock commands change it.
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Delete a product. Deleting one that doesn't exist succeeds with `expectedVersion=0`.
      parameters: [{ $ref: "#/components/parameters/expectedVersion" }]
      responses:
        "204": { description: "Deleted, or already gone." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /teams/{teamId}/products/{key}/stock:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/productKey"
    post:
      tags: [commands]
      operationId: adjustStock
      summary: Change an item's stock outside a sheet, in one transaction, with a movement in its history.
      description: |
        - `reason: "receipt"`: `quantity` eaches bought at `unitCost` each
          (after any pack conversion, ADR 0014) are added to stock. An item
          that didn't track stock starts at `quantity`. The item's `price`
          and `cost` don't change; update the document for that.
        - `reason: "count"`: someone counted `count` in storage. Stock is set
          to it, and the movement records the difference.

        Contributors and owners only. Idempotent by `operationId`.
      requestBody: { $ref: "#/components/requestBodies/StockAdjust" }
      responses:
        "200": { $ref: "#/components/responses/CommandDone" }
        "400": { $ref: "#/components/responses/CommandRefused" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
  /teams/{teamId}/products/{key}/movements:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/productKey"
    get:
      tags: [commands]
      operationId: listMovements
      summary: An item's stock history, newest first. Any member can read it.
      parameters:
        - name: limit
          in: query
          description: At most this many movements. Default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of movements.
          content:
            application/json:
              schema:
                type: object
                required: [movements]
                properties:
                  movements:
                    type: array
                    items: { $ref: "#/components/schemas/Movement" }
                  cursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/imports:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    post:
      tags: [products]
      operationId: importProducts
      summary: Import items from a CSV file, all or nothing, with a dry-run preview. Owners only.
      description: |
        The server reads the file (columns `name`, `barcode`, `price`, `cost`,
        `stock`, `pack_size`, matched without regard to case or spacing; other
        columns are left out) and validates every row against the whole
        inventory before it writes anything. A row matches an existing item by
        barcode, or by name when the row or the item has no barcode, and
        updates it; a re-import **sets** price, cost, pack size and stock to
        the file's values and never duplicates an item. Blank optional cells
        keep what's there. Money may have `$` and thousands separators and is
        rounded to cents; stock and pack size are whole numbers (ADR 0014).

        - `dryRun: true`: writes nothing. 200 with `status: "preview"` (or
          `"invalid"` with every problem) and what each row will do.
        - Otherwise: 200 `imported` when every row is in. A file with any bad
          row is 400 `bad_request` with every problem in `errors`, and nothing
          is written. The import is staged, then committed in transactions of
          up to 49 rows and 2.5 MB; if it stops part-way (a timeout, or 409 when
          items kept changing), send the same request again (same `importId`
          and file, from any owner) to finish it. The same `importId` with a
          finished import returns its summary with `replayed: true`; with a
          different file it is 400. A 409 whose message says to choose the
          file again (the import expired, or a key it planned was taken by an
          item with another barcode) needs a new `importId`.

        At most 1,000 rows and 300 KB. Owners only: a contributor or viewer
        gets 403 `permission_denied` with `reason: "owners_only"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csv]
              properties:
                importId: { allOf: [{ $ref: "#/components/schemas/OperationId" }], description: "One UUID per import, sent again unchanged on every retry. Required unless `dryRun`." }
                csv: { type: string, maxLength: 300000, description: The file's text (UTF-8). The first non-blank row names the columns. }
                dryRun: { type: boolean, description: "True: validate and preview, and write nothing." }
            examples:
              preview:
                summary: Preview a file
                value: { dryRun: true, csv: "name,barcode,price,cost,stock,pack_size\nNitrile gloves,0123,12.50,9.99,40,100\n" }
      responses:
        "200":
          description: The preview (dry run), or the finished import.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, rows, errors, errorCount, ignoredColumns, summary]
                    properties:
                      status: { type: string, enum: [preview, invalid] }
                      rows: { type: array, items: { $ref: "#/components/schemas/ImportRow" }, description: The valid rows and what each will do. }
                      errors: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ImportRowError" } }
                      errorCount: { type: integer }
                      ignoredColumns: { type: array, items: { type: string } }
                      summary: { $ref: "#/components/schemas/ImportSummary" }
                  - type: object
                    required: [status, importId, replayed, summary]
                    properties:
                      status: { const: imported }
                      importId: { type: string, format: uuid }
                      replayed: { type: boolean }
                      summary: { $ref: "#/components/schemas/ImportSummary" }
        "400":
          description: "`bad_request`, nothing written: a malformed body or file, or rows with problems (listed in `errors`, at most 200, and counted in `errorCount`)."
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    properties:
                      errors: { type: array, items: { $ref: "#/components/schemas/ImportRowError" } }
                      errorCount: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`aborted`: items kept changing under the import (send the same request again to finish it), or it can't go on as staged: its plan expired, or a key it planned to create was taken by an item with another barcode (import the file again with a new `importId`). The message says which."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413": { $ref: "#/components/responses/TooLarge" }
  /teams/{teamId}/sheets:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [sheets]
      operationId: listSheets
      summary: List the team's sheets, by ID (consistent) or by date (from an index).
      parameters:
        - name: orderBy
          in: query
          description: "`date` for date order, which the app's sheet list uses."
          schema: { type: string, enum: [date] }
        - name: direction
          in: query
          description: With `orderBy`. Default `asc`.
          schema: { type: string, enum: [asc, desc] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/sheets/{sheetId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: sheetId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    get:
      tags: [sheets]
      operationId: getSheet
      summary: Read one sheet.
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [sheets]
      operationId: setSheet
      summary: Create or replace a sheet (the app's `set`).
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    patch:
      tags: [sheets]
      operationId: updateSheet
      summary: Deep-merge into an existing sheet (the app's `update`), e.g. `{"data":{"items":{"<key>":{"returned":3}}}}`.
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      tags: [sheets]
      operationId: deleteSheet
      summary: Delete a sheet. Deleting one that doesn't exist succeeds with `expectedVersion=0`.
      parameters: [{ $ref: "#/components/parameters/expectedVersion" }]
      responses:
        "204": { description: "Deleted, or already gone." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /teams/{teamId}/sheets/{sheetId}/checkout:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/sheetId"
    post:
      tags: [commands]
      operationId: checkoutItems
      summary: Check out whole eaches of an item onto a sheet, and take them off stock, in one transaction.
      description: |
        Adds `quantity` to the line's `out`, creating the line if it isn't on
        the sheet yet, and takes `quantity` off the product's `stock` if the
        product tracks stock. A new line copies `code`, `name`, `price` and
        `cost` from the product as the transaction finds it (ADR 0014); the
        request's `name`, `price`, `code` and `cost` are used only for an item
        that isn't in inventory, and then `name` and `price` are required. An
        existing line's copy never changes. The sheet must be open (any
        `status` but `closed`). Contributors and owners only. Idempotent by
        `operationId`: see [commands.md](commands.md).
      requestBody: { $ref: "#/components/requestBodies/Checkout" }
      responses:
        "200": { $ref: "#/components/responses/CommandDone" }
        "400": { $ref: "#/components/responses/CommandRefused" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
  /teams/{teamId}/sheets/{sheetId}/lines:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/sheetId"
    post:
      tags: [commands]
      operationId: addLines
      summary: Add a receipt's lines for a client to a sheet, in one transaction, without moving stock.
      description: |
        Adds each line's `quantity` to the sheet's `out` for its product,
        creating the line, with the request's `code`, `name`, `price` and
        `cost`, if the sheet doesn't have it. An existing line keeps its copy.
        Every line changes or none does. Stock doesn't move: the items were
        bought for the client and never were in storage. 1 to 40 lines, each
        product at most once. The sheet must be open. Contributors and owners
        only. Idempotent by `operationId`: see [commands.md](commands.md).
      requestBody: { $ref: "#/components/requestBodies/AddLines" }
      responses:
        "200": { $ref: "#/components/responses/LinesAdded" }
        "400": { $ref: "#/components/responses/CommandRefused" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
  /teams/{teamId}/sheets/{sheetId}/return:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/sheetId"
    post:
      tags: [commands]
      operationId: returnItems
      summary: Record whole eaches of a line coming back, and put them back in stock, in one transaction.
      description: |
        Adds `quantity` to the line's `returned`, which can never go above
        `out`, and adds `quantity` to the product's `stock` if the product
        tracks stock. Prices aren't touched. The sheet must be open: a closed
        sheet takes no returns (reopen it first, or correct the line's counts
        with a `PATCH`, which doesn't move stock). Contributors and owners
        only. Idempotent by `operationId`.
      requestBody: { $ref: "#/components/requestBodies/Return" }
      responses:
        "200": { $ref: "#/components/responses/CommandDone" }
        "400": { $ref: "#/components/responses/CommandRefused" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: The caller's teams (for the switcher) and pending invites.
      description: |
        Call after sign-in, before loading any team. `teams` lists every team
        the caller is a member of, sorted by name. `invites` lists live
        invites addressed to the caller's email, only if Cognito has verified
        it, leaving out teams the caller is already in. The user is always the
        token's `sub`: there is no way to ask about anyone else. Needs the
        `aws.cognito.signin.user.admin` scope in the access token (the server
        reads the email with Cognito's GetUser).
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                type: object
                required: [user, teams, invites]
                properties:
                  user:
                    type: object
                    required: [id, email, emailVerified]
                    properties:
                      id: { type: string, description: "The user's `sub`." }
                      email: { type: [string, "null"] }
                      emailVerified: { type: boolean, description: Invites are listed and accepted only when this is true. }
                  teams:
                    type: array
                    items: { $ref: "#/components/schemas/Team" }
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /teams:
    post:
      tags: [account]
      operationId: createTeam
      summary: Create a team, with the caller as its owner, on a 14-day trial.
      description: |
        The team's home region is the region that served the request (ADR
        0010), and its free trial starts now (ADR 0009: 14 days, no card).
        Idempotent: send a new `Idempotency-Key` for each "create team"
        attempt, and the same one on retries. A repeat with the same key
        returns the team the first request made (200) instead of making
        another; the same key with a different name is 409 `aborted`. A user
        can create 5 teams a day, and be in at most 20 teams (429
        `quota_exceeded` for either).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A new random value per attempt, e.g. `crypto.randomUUID()`, reused on retries and double-clicks.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200, description: Trimmed. }
      responses:
        "201": { $ref: "#/components/responses/TeamCreated" }
        "200": { $ref: "#/components/responses/TeamCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted`: this `Idempotency-Key` already made a team with another name."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyTeams" }
  /invites/{inviteId}/accept:
    parameters:
      - name: inviteId
        in: path
        required: true
        description: "The invite's ID, from the emailed link (it's also `id` in `GET /me`)."
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    post:
      tags: [account]
      operationId: acceptInvite
      summary: Join the team that invited the caller's verified email address.
      description: |
        Needs both the `token` from the emailed invite link (proof the caller
        read that mailbox) and a caller whose Cognito-verified email is the
        invite's address. The invite must not have expired, and it works once.
        The caller joins with the invite's role. A missing or wrong token is
        the same 404 as an unknown invite.

        A team has a member cap: 10 members while it's on a trial (or not
        paying), 100 once its subscription is `active` or `past_due`. Joining
        a full team is 429 `quota_exceeded` with `reason: "team_full"`, and
        the invite stays usable for when an owner makes room. Two people
        accepting for the last place at once can't both join.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, description: The `token` parameter of the emailed invite link, as is. }
      responses:
        "200":
          description: The team the caller joined.
          content:
            application/json:
              schema:
                type: object
                required: [team]
                properties:
                  team: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`permission_denied`: the caller's email isn't verified yet."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found`: no such invite for the caller's email, a missing or wrong token, or it expired or was already used."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`aborted`: the caller is already a member of the team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`quota_exceeded`: the caller is already in 20 teams, or (with `reason: \"team_full\"`) the team is at its member cap."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /me/email/code:
    post:
      tags: [account]
      operationId: sendEmailCode
      summary: Email the caller a code to verify their email address.
      description: |
        Cognito emails a 6-digit code to the caller's address
        (GetUserAttributeVerificationCode with the caller's own access token,
        so it needs the `aws.cognito.signin.user.admin` scope). Only for an
        address that isn't verified yet: `emailVerified` is false in
        `GET /me`. A new code replaces the last one. A user can ask for 10
        codes a UTC day, and Cognito limits them too (429 for either). No
        request body, or an empty object.
      responses:
        "204": { description: The code is on its way. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted` with `reason: \"already_verified\"`: the address is already verified."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`quota_exceeded`: too many codes asked for. Try again later."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`internal`: Cognito couldn't send the email. Try again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /me/email/verify:
    post:
      tags: [account]
      operationId: verifyEmail
      summary: Verify the caller's email address with the code from the email.
      description: |
        Checks the code with Cognito (VerifyUserAttribute), which marks the
        address verified. Then refresh the tokens (`POST /auth/refresh`): for
        a user with Google or Apple linked, the refresh is when the address
        is recorded and starts to count (docs/infrastructure.md, Sign-in).
        After that, `GET /me` shows `emailVerified: true` and the invites
        sent to the address. Cognito limits wrong tries (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "204": { description: The address is verified. }
        "400":
          description: "`bad_request`: with `reason: \"code_mismatch\"`, the code isn't right (or isn't 6 digits); with `reason: \"code_expired\"`, ask for a new one."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted`: with `reason: \"already_verified\"`, the address is already verified; with `reason: \"email_in_use\"`, another account has this address."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`quota_exceeded`: too many tries. Try again later."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /teams/{teamId}/members:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [members]
      operationId: listMembers
      summary: The team's members and their roles. Owners only.
      description: |
        Owners first, then contributors, then viewers, each by email. `email`
        is the address the member joined with, or `null` if there wasn't one.
      responses:
        "200":
          description: The team's members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/teamId" }
      - name: userId
        in: path
        required: true
        description: "The member's user ID (`userId` in the member list; the caller's own is `user.id` in `GET /me`)."
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    patch:
      tags: [members]
      operationId: setMemberRole
      summary: Change a member's role. Owners only.
      description: |
        Takes effect on the member's next request. An owner can change their
        own role too, but a team always keeps at least one owner: demoting
        the last one is 409 with `reason: "last_owner"`. That is enforced in
        the same transaction as the change, so two owners demoting each other
        at once can't both succeed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [owner, contributor, viewer] }
      responses:
        "200":
          description: The member with their new role.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NoSuchMember" }
        "409": { $ref: "#/components/responses/MemberConflict" }
    delete:
      tags: [members]
      operationId: removeMember
      summary: Remove a member (owners), or leave the team (anyone, with their own user ID).
      description: |
        The member loses access on their next request, and their live updates
        stop. The team's last owner can't be removed or leave (409 with
        `reason: "last_owner"`), enforced in the same transaction.
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NoSuchMember" }
        "409": { $ref: "#/components/responses/MemberConflict" }
  /teams/{teamId}/invites:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [invites]
      operationId: listInvites
      summary: The team's invites that haven't been accepted or revoked. Owners only.
      description: |
        Newest first. An expired invite stays listed (as `expired`) until
        DynamoDB's TTL removes it, so the owner can re-send it.
      responses:
        "200":
          description: The team's invites.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/TeamInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [invites]
      operationId: createInvite
      summary: Invite an email address to the team with a role, and email it the link. Owners only.
      description: |
        Creates the invite, then emails the link
        (`https://app.<env domain>/?invite=<id>&token=<token>`) from
        `noreply@<env domain>`. The token is in the email only; the response
        never has it. If SES won't send the email, the invite is still made,
        and comes back with `inviteStatus: "failed"` and
        `failureReason: "not_sent"`: re-send or revoke it. A bounce or
        complaint reported later marks it failed too (`bounced`,
        `complained`).

        Each team can send 50 invites a day (UTC), 3 of them to any one
        address, and each address can be sent 15 from all teams together;
        re-sends count. An address counts without a `+tag`, and a Gmail
        address without its dots. Past any of these, 429 `quota_exceeded`.

        Members and live invites together can't exceed the team's member cap
        (10 on a trial, 100 when paying; see acceptInvite): past it, 429
        `quota_exceeded` with `reason: "team_full"`. Revoke an invite or
        remove a member to make room.

        `email` must be a bare address (`name@example.com`): no display name,
        angle brackets, quotes, commas or spaces, and an ASCII domain
        (international ones in their `xn--` form). Anything else is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, maxLength: 254, description: "The address to invite. Matched without regard to case (and after Unicode NFKC)." }
                role: { type: string, enum: [owner, contributor, viewer] }
      responses:
        "201":
          description: The invite, pending (the email was sent) or failed (`not_sent`).
          content:
            application/json:
              schema:
                type: object
                required: [invite]
                properties:
                  invite: { $ref: "#/components/schemas/TeamInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`aborted`: the address is already a member's, or already has a live invite to this team (re-send that one)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyInvites" }
  /teams/{teamId}/invites/{inviteId}:
    parameters:
      - { $ref: "#/components/parameters/teamId" }
      - { $ref: "#/components/parameters/inviteId" }
    delete:
      tags: [invites]
      operationId: revokeInvite
      summary: Revoke an invite, so its link stops working. Owners only.
      description: Revoking an invite that's already gone (accepted, revoked or expired and removed) is also 204.
      responses:
        "204": { description: Revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/invites/{inviteId}/resend:
    parameters:
      - { $ref: "#/components/parameters/teamId" }
      - { $ref: "#/components/parameters/inviteId" }
    post:
      tags: [invites]
      operationId: resendInvite
      summary: Send an invite again, with a new link. Owners only.
      description: |
        Replaces the invite with a new one: a new `id` and token (the old
        link stops working), the same address and role, a new 7-day expiry,
        and no failure. Works for a pending, failed or expired invite, and
        counts against the same daily limits. No request body. To correct the
        address, revoke the invite and make a new one.
      responses:
        "201":
          description: The new invite, pending or failed (`not_sent`), as for `createInvite`.
          content:
            application/json:
              schema:
                type: object
                required: [invite]
                properties:
                  invite: { $ref: "#/components/schemas/TeamInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`not_found`: the invite was accepted or revoked."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyInvites" }
  /teams/{teamId}/support-actions:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [members]
      operationId: listSupportActions
      summary: What Supply Checkout support did to this team (ADR 0015). Owners only.
      description: |
        Newest first: comps (`ops.comp.set`, `ops.comp.end`, with the comp
        before and after) and each time support read the team's account
        record (`ops.team.read`). The actor is always "Supply Checkout
        support"; which operator it was is never shown.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: A page of support actions.
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      required: [eventId, ts, actor, action]
                      properties:
                        eventId: { type: string }
                        ts: { type: string, format: date-time }
                        actor: { type: string, const: Supply Checkout support }
                        action: { type: string, enum: [ops.team.read, ops.comp.set, ops.comp.end] }
                        reason: { type: string }
                        before: { oneOf: [{ $ref: "#/components/schemas/CompRecord" }, { type: "null" }] }
                        after: { oneOf: [{ $ref: "#/components/schemas/CompRecord" }, { type: "null" }] }
                  cursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /ops/teams:
    get:
      tags: [ops]
      operationId: opsListTeams
      summary: Teams, newest first, 50 a page, with their owners. Audited as `ops.teams.list` (with `q` and the teams returned).
      security: [{ opsCognito: [] }]
      parameters:
        - { name: q, in: query, description: "A team ID, or part of a team's name (any case).", schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, description: The previous page's `cursor`, with the same `q`., schema: { type: string } }
      responses:
        "200":
          description: A page of teams.
          content:
            application/json:
              schema:
                type: object
                required: [teams]
                properties:
                  teams: { type: array, items: { $ref: "#/components/schemas/OpsTeam" } }
                  cursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
  /ops/teams/{teamId}:
    parameters: [{ $ref: "#/components/parameters/opsTeamId" }]
    get:
      tags: [ops]
      operationId: opsGetTeam
      summary: One team's account record and owners. Audited as `ops.team.read`.
      description: The record comes from the operators' index, which lags writes by up to a second or so.
      security: [{ opsCognito: [] }]
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema:
                type: object
                required: [team]
                properties:
                  team: { $ref: "#/components/schemas/OpsTeam" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
        "404":
          description: "`not_found`: no such team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /ops/teams/{teamId}/comp:
    parameters: [{ $ref: "#/components/parameters/opsTeamId" }]
    put:
      tags: [ops]
      operationId: opsSetComp
      summary: Comp the team, or change or extend its comp.
      description: |
        While a comp is live (`until` in the future) the team is active on
        `plan` whatever Stripe says; after it, the Stripe status applies
        again. It never changes the team's own `plan` or `status`. `until` is
        at most 12 months ahead; extend by sending a later one. Send the
        team's `version` from `GET /ops/teams/{teamId}` as `expectedVersion`.
        Audited as `ops.comp.set` in the same transaction.
      security: [{ opsCognito: [] }]
      parameters: [{ $ref: "#/components/parameters/opsIdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan, until, reason, expectedVersion]
              properties:
                plan: { type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$", examples: [free] }
                seats: { type: integer, minimum: 1, maximum: 100 }
                until: { type: string, description: "A date (YYYY-MM-DD, midnight UTC) or an ISO 8601 time with a zone, in the future and at most 12 months ahead." }
                reason: { type: string, minLength: 3, maxLength: 500, description: Why, on one line. The team's owners see it. }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/CompDone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
        "404":
          description: "`not_found`: no such team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/CompConflict" }
    delete:
      tags: [ops]
      operationId: opsEndComp
      summary: End the team's comp now. Audited as `ops.comp.end`.
      security: [{ opsCognito: [] }]
      parameters: [{ $ref: "#/components/parameters/opsIdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expectedVersion]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/CompDone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
        "404":
          description: "`not_found`: no such team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/CompConflict" }
  /ops/audit:
    get:
      tags: [ops]
      operationId: opsListAudit
      summary: The operator audit, newest first, for one team (`teamId`; `PLATFORM` for team lists and searches) or one month (default this month, UTC).
      security: [{ opsCognito: [] }]
      parameters:
        - { name: teamId, in: query, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" } }
        - { name: month, in: query, description: YYYY-MM. Not with teamId., schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [eventId, ts, teamId, operatorSub, action, target]
                      properties:
                        eventId: { type: string }
                        ts: { type: string, format: date-time }
                        teamId: { type: string }
                        operatorSub: { type: string, description: The operator's `sub` in the operator pool. }
                        action: { type: string, enum: [ops.teams.list, ops.team.read, ops.comp.set, ops.comp.end] }
                        target: { type: string }
                        reason: { type: string }
                        before: { oneOf: [{ $ref: "#/components/schemas/CompRecord" }, { type: "null" }] }
                        after: { oneOf: [{ $ref: "#/components/schemas/CompRecord" }, { type: "null" }] }
                        idempotencyKey: { type: string }
                  cursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
  /auth/session:
    post:
      tags: [auth]
      operationId: createSession
      summary: Exchange the Managed Login authorization code for tokens.
      description: |
        Call after Managed Login redirects back with `?code=`, with
        `credentials: "include"`. Redeems the code and PKCE verifier at
        Cognito's `/oauth2/token`, returns the access and ID tokens (keep them
        in memory only), and sets the refresh token as an HttpOnly cookie.
      security: []
      parameters: [{ $ref: "#/components/parameters/origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, codeVerifier, redirectUri]
              properties:
                code: { type: string, pattern: "^[A-Za-z0-9_-]{1,2048}$" }
                codeVerifier: { type: string, pattern: "^[A-Za-z0-9._~-]{43,128}$" }
                redirectUri: { type: string, description: The redirect URI used to sign in; must be on the calling origin. }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignInAgain" }
        "403": { $ref: "#/components/responses/OriginRefused" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: New access and ID tokens from the refresh-token cookie.
      description: |
        Call with `credentials: "include"` before the access token expires
        (60 minutes) or after a 401. Refresh-token rotation is on: the cookie
        is replaced with the new refresh token on every call. A 401 clears the
        cookie; show sign-in.
      security: [{ refreshCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/origin" }]
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/SignInAgain" }
        "403": { $ref: "#/components/responses/OriginRefused" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      summary: Revoke the refresh token and clear the cookie.
      description: Always clears the cookie, even if revoking fails. Then send the user to Managed Login's `/logout`.
      security: [{ refreshCookie: [] }, {}]
      parameters: [{ $ref: "#/components/parameters/origin" }]
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearCookie" }
        "403": { $ref: "#/components/responses/OriginRefused" }
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Cognito **access token** from the environment's user pool and the web
        app client (`Authorization: Bearer <token>`). API Gateway checks the
        signature, expiry, issuer and client; the Lambda also requires
        `token_use: access` and an unexpired `exp`. ID tokens are refused.
    opsCognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Cognito **access token** from the operator user pool
        (`supply-checkout-<env>-ops`, password plus TOTP required) and its
        `ops` client, for a user in the `operators` group. 15 minutes. The
        ops function also calls Cognito on every request, so a revoked token
        or a removed or disabled operator is refused at once.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-sc_refresh
      description: |
        The refresh token, set by `/auth/session` and `/auth/refresh`:
        `HttpOnly; Secure; SameSite=Strict; Path=/auth; Max-Age=2592000`.
        Requests must also carry an allowed `Origin` (CSRF protection).
  parameters:
    opsTeamId:
      name: teamId
      in: path
      required: true
      description: Any team's ID.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    opsIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: New for each change. A retry with the same key and body replays the first result for 24 hours; the same key with another body is 409.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
    teamId:
      name: teamId
      in: path
      required: true
      description: The team. The caller must be a member; the body can't name a team.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    inviteId:
      name: inviteId
      in: path
      required: true
      description: "The invite's `id` in the team's invite list."
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    productKey:
      name: key
      in: path
      required: true
      description: The product key, percent-encoded. Up to 256 characters, no `/` or control characters, and not `__proto__`.
      schema: { type: string, minLength: 1, maxLength: 256 }
    sheetId:
      name: sheetId
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    limit:
      name: limit
      in: query
      description: At most this many documents. A page also stops at about 1 MB.
      schema: { type: integer, minimum: 1, maximum: 1000 }
    cursor:
      name: cursor
      in: query
      description: The `cursor` from the previous page, as is. Only valid for the same listing.
      schema: { type: string }
    expectedVersion:
      name: expectedVersion
      in: query
      required: true
      description: Delete only if the document is at this version (0 = only if it doesn't exist, so deleting a missing document succeeds).
      schema: { type: integer, minimum: 0 }
    origin:
      name: Origin
      in: header
      required: true
      description: Must be one of the environment's app origins (`https://app.<env domain>`, and `http://localhost:5173` outside prod).
      schema: { type: string }
  headers:
    SetCookie:
      description: The rotated refresh token.
      schema: { type: string, example: "__Secure-sc_refresh=<token>; Path=/auth; Max-Age=2592000; HttpOnly; Secure; SameSite=Strict" }
    ClearCookie:
      description: Clears the refresh-token cookie.
      schema: { type: string, example: "__Secure-sc_refresh=; Path=/auth; Max-Age=0; HttpOnly; Secure; SameSite=Strict" }
  requestBodies:
    Write:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, expectedVersion]
            properties:
              data:
                type: object
                description: The document (PUT) or the patch to merge (PATCH).
              expectedVersion:
                type: integer
                minimum: 0
                description: Write only if the document is at this version (0 = doesn't exist).
          examples:
            checkout:
              summary: Check out 3 of an item (PATCH a sheet)
              value: { data: { items: { "0123": { code: "0123", name: "Nitrile gloves", price: 12.5, out: 3, returned: 0 } } }, expectedVersion: 7 }
    Checkout:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, productKey, quantity]
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              productKey: { type: string, minLength: 1, maxLength: 256, description: "The line's key: the product key (or a new key for a one-off item)." }
              quantity: { $ref: "#/components/schemas/Quantity" }
              name: { type: string, minLength: 1, maxLength: 200, description: Only for an item that isn't in inventory. Trimmed. }
              price: { allOf: [{ $ref: "#/components/schemas/Money" }], description: Only for an item that isn't in inventory. The client price per each. }
              code: { type: string, maxLength: 256, description: Only for an item that isn't in inventory. Its barcode, or empty. }
              cost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: Only for an item that isn't in inventory. What the business paid per each. }
          examples:
            inventoryItem:
              summary: Check out 3 of an item in inventory
              value: { operationId: "3b241101-e2bb-4255-8caf-4136c566a962", productKey: "0123", quantity: 3 }
            oneOff:
              summary: Check out an item that isn't in inventory
              value: { operationId: "a8098c1a-f86e-41b1-8e42-6b87b5ab13a6", productKey: "k-7f3a", quantity: 1, name: "Leftover storage bins", price: 4 }
    AddLines:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, lines]
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              lines:
                type: array
                minItems: 1
                maxItems: 40
                items:
                  type: object
                  additionalProperties: false
                  required: [productKey, quantity, name, price]
                  properties:
                    productKey: { type: string, minLength: 1, maxLength: 256, description: "The line's key. Each product at most once." }
                    quantity: { $ref: "#/components/schemas/Quantity" }
                    name: { type: string, minLength: 1, maxLength: 200, description: For a new line. Trimmed. }
                    price: { allOf: [{ $ref: "#/components/schemas/Money" }], description: For a new line. The client price per each. }
                    code: { type: string, maxLength: 256, description: For a new line. Its barcode, or empty. }
                    cost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: For a new line. What the business paid per each. }
          examples:
            receipt:
              summary: Two receipt lines for a client
              value: { operationId: "6ec0bd7f-11c0-43da-975e-2a8ad9ebae0b", lines: [{ productKey: "0123", quantity: 4, name: "Nitrile gloves", price: 12.5, code: "0123", cost: 9.99 }, { productKey: "k-7f3a", quantity: 2, name: "Painter's tape", price: 6.25, cost: 6.25 }] }
    Return:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, productKey, quantity]
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              productKey: { type: string, minLength: 1, maxLength: 256, description: The line's key. }
              quantity: { $ref: "#/components/schemas/Quantity" }
    StockAdjust:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [operationId, reason, quantity, unitCost]
                properties:
                  operationId: { $ref: "#/components/schemas/OperationId" }
                  reason: { const: receipt }
                  quantity: { $ref: "#/components/schemas/Quantity" }
                  unitCost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: What was paid per each, before tax. }
              - type: object
                additionalProperties: false
                required: [operationId, reason, count]
                properties:
                  operationId: { $ref: "#/components/schemas/OperationId" }
                  reason: { const: count }
                  count: { type: integer, minimum: 0, maximum: 1000000, description: The number counted in storage. }
  schemas:
    CompRecord:
      type: object
      description: A comp as the audit records it.
      properties:
        plan: { type: string }
        seats: { type: [integer, "null"] }
        until: { type: [string, "null"], format: date-time }
        reason: { type: [string, "null"] }
    OpsTeam:
      type: object
      required: [id, name, plan, seats, status, ownerCount, createdAt, version, comp, owners]
      properties:
        id: { type: string }
        name: { type: string }
        plan: { type: string, description: From billing (ADR 0009). }
        seats: { type: integer }
        status: { type: string, description: The Stripe subscription status. }
        trialEndsAt: { type: [string, "null"], format: date-time }
        ownerCount: { type: integer }
        closedAt: { type: [string, "null"], format: date-time, description: "Set once an owner closed the team: it's read-only until it's deleted, and comps are refused (409). A deleted team drops out of the list." }
        createdAt: { type: string, format: date-time }
        stripeCustomerId: { type: [string, "null"] }
        version: { type: integer, description: Send as `expectedVersion` to change the comp. }
        comp:
          oneOf:
            - type: object
              properties:
                plan: { type: string }
                seats: { type: [integer, "null"] }
                until: { type: string, format: date-time }
                reason: { type: string }
                by: { type: string, description: The operator's `sub`. }
                at: { type: string, format: date-time }
                live: { type: boolean, description: "`until` is still ahead." }
            - type: "null"
        owners:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              email: { type: [string, "null"] }
              joinedAt: { type: [string, "null"], format: date-time }
    OperationId:
      type: string
      format: uuid
      description: |
        A UUID the client makes for one intended action (`crypto.randomUUID()`)
        and sends again, unchanged, on every retry of it. The same ID returns
        the first result for 7 days; the same ID with a different request is
        `bad_request`.
    Quantity:
      type: integer
      minimum: 1
      maximum: 1000000
      description: Whole eaches (ADR 0014).
    Money:
      type: number
      minimum: 0
      maximum: 1000000
      multipleOf: 0.01
      description: US dollars before tax, at most two decimals (ADR 0014). More decimals are refused, not rounded.
    LineSnapshot:
      type: object
      required: [code, name, price]
      properties:
        code: { type: string }
        name: { type: string }
        price: { type: number }
        cost: { type: number, description: Absent when unknown. }
    CommandResult:
      type: object
      description: What the command did. Kept with the operation ID, and returned unchanged on a retry.
      required: [operationId, command, reason, productKey, stockDelta, userId, at]
      properties:
        operationId: { type: string, format: uuid }
        command: { type: string, enum: [checkout, return, stockAdjust] }
        reason: { type: string, enum: [checkout, return, receipt, count] }
        productKey: { type: string }
        sheetId: { type: string, description: Checkout and return. }
        quantity: { type: integer, description: Eaches checked out, returned or received. Absent for a count. }
        count: { type: integer, description: The level counted (count only). }
        stockDelta: { type: integer, description: "The change to the product's `stock`: 0 when it doesn't track stock or isn't in inventory." }
        lineCreated: { type: boolean, description: Checkout only. }
        snapshot: { $ref: "#/components/schemas/LineSnapshot" }
        unitCost: { type: number, description: Receipt only. }
        userId: { type: string }
        at: { type: string, format: date-time }
    Movement:
      type: object
      description: One change to an item's stock. The sum of an item's `delta`s is its change in stock.
      required: [type, productKey, reason, delta, tracked, operationId, userId, at]
      properties:
        type: { const: movement }
        productKey: { type: string }
        reason: { type: string, enum: [checkout, return, receipt, count, import], description: "`import`: a CSV import set the stock (`count`)." }
        delta: { type: integer, description: The change to `stock`. 0 when the item didn't track stock. }
        tracked: { type: boolean, description: Whether the item tracked stock. }
        quantity: { type: integer }
        count: { type: integer }
        sheetId: { type: string }
        unitCost: { type: number }
        operationId: { type: string, format: uuid }
        userId: { type: string }
        at: { type: string, format: date-time }
    ImportRow:
      type: object
      required: [line, name, barcode, price, key, action, changes]
      properties:
        line: { type: integer, description: The row's line in the file. }
        name: { type: string, maxLength: 200 }
        barcode: { type: string, maxLength: 256 }
        price: { $ref: "#/components/schemas/Money" }
        cost: { $ref: "#/components/schemas/Money" }
        stock: { type: integer, minimum: 0, maximum: 1000000 }
        packSize: { type: integer, minimum: 1, maximum: 10000 }
        key: { type: string, description: The product key the row writes. }
        action: { type: string, enum: [create, update, unchanged] }
        changes: { type: array, items: { type: string, enum: [code, name, price, cost, packSize, stock] } }
    ImportRowError:
      type: object
      required: [line, message]
      properties:
        line: { type: integer }
        column: { type: string, description: The column as the file names it, when the problem is in one cell. }
        message: { type: string }
    ImportSummary:
      type: object
      required: [rows, created, updated, unchanged]
      properties:
        rows: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
    Document:
      type: object
      required: [id, version, data]
      properties:
        id: { type: string, description: The product key or sheet ID. }
        version: { type: integer, minimum: 1 }
        data:
          type: object
          description: The document's fields as the app wrote them. `Product` and `Sheet` list the fields the app writes.
    Product:
      type: object
      description: "`data` of a document in `products` (src/main.js). Other fields are kept as written."
      properties:
        code: { type: string, maxLength: 256, description: The barcode; empty for an item without one. }
        name: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: number, description: "The count in storage; absent if not counted. Read-only here: only the stock commands and the CSV import change it, and a write may only repeat the stored value." }
        updatedAt: { type: string, format: date-time }
    Sheet:
      type: object
      description: "`data` of a document in `sheets` (src/main.js). Other fields are kept as written."
      properties:
        client: { type: string }
        date: { type: string, description: "`YYYY-MM-DD`; sheets without a valid date sort last when newest-first." }
        createdBy: { type: [string, "null"], description: "The creator's user ID, or `null` without a signed-in user." }
        createdByName: { type: string, description: "Who prepared the sheet, when `createdBy` is `null`." }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [open, closed] }
        closedAt: { type: string, format: date-time }
        items:
          type: object
          description: The sheet's lines, keyed by product key.
          additionalProperties: { $ref: "#/components/schemas/SheetLine" }
        source:
          type: object
          description: The receipt the sheet was made from, when receipt scanning named a store.
          properties:
            store: { type: string }
            receiptDate: { type: string }
    SheetLine:
      type: object
      description: One line of a sheet. A PATCH may send only some fields (a return sends `returned`); the rest, including `code`, are kept.
      properties:
        code: { type: string, maxLength: 256, description: 'The barcode, exported as "Barcode" in the sheet CSV; empty for an item without one.' }
        name: { type: string }
        price: { type: number, minimum: 0 }
        cost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "What the business paid per each (ADR 0014): copied from the product at the line's first checkout, or the receipt's cost each for a line a receipt adds. Absent when unknown; any other value is refused with 400 `bad_request`." }
        out: { type: integer, minimum: 0, description: How many were taken. }
        returned: { type: integer, minimum: 0, description: How many came back. }
    Team:
      type: object
      required: [id, name, role, plan, status, trialEndsAt, homeRegion]
      properties:
        id: { type: string, description: "The `teamId` for the data routes." }
        name: { type: string }
        role: { type: string, enum: [owner, contributor, viewer], description: The caller's role in this team. }
        plan: { type: string, description: "`trial` until the team subscribes." }
        status: { type: string, description: "Subscription status (ADR 0009): `trialing`, `active`, `past_due`, `canceled`." }
        trialEndsAt: { type: [string, "null"], format: date-time, description: When the free trial ends. }
        homeRegion: { type: string, description: The region the team was created in (ADR 0010). }
        comp:
          description: A live comp from Supply Checkout support (ADR 0015). While it's set, the team is active on `plan` until `until`, whatever `status` says.
          oneOf:
            - type: object
              required: [plan, until]
              properties:
                plan: { type: string }
                until: { type: string, format: date-time }
            - type: "null"
    Invite:
      type: object
      description: A pending invite, to show. Accepting it needs the token from the invite email.
      required: [id, teamName, role, expiresAt]
      properties:
        id: { type: string, description: "The invite's ID, as in the emailed link." }
        teamName: { type: string }
        role: { type: string, enum: [owner, contributor, viewer], description: The role the caller joins with. }
        expiresAt: { type: string, format: date-time }
    TeamInvite:
      type: object
      description: An invite as the team's owners see it. Never the token.
      required: [id, email, role, createdAt, expiresAt, inviteStatus, failureReason, failedAt]
      properties:
        id: { type: string }
        email: { type: string, description: The invited address, normalized (lowercase). }
        role: { type: string, enum: [owner, contributor, viewer] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        inviteStatus:
          type: string
          enum: [pending, failed, expired]
          description: "`failed`: its email couldn't be delivered (`failureReason`). `expired`: past `expiresAt`. Otherwise `pending`."
        failureReason:
          type: [string, "null"]
          enum: [bounced, complained, not_sent, null]
          description: "`bounced` (the address doesn't take mail), `complained` (the recipient marked it as spam) or `not_sent` (SES wouldn't send it). SES suppresses a bounced or complaining address, so a re-send to it fails too."
        failedAt: { type: [string, "null"], format: date-time }
    Member:
      type: object
      required: [userId, email, role, joinedAt]
      properties:
        userId: { type: string }
        email: { type: [string, "null"], description: The address they joined with. }
        role: { type: string, enum: [owner, contributor, viewer] }
        joinedAt: { type: [string, "null"], format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthenticated, permission_denied, invalid_argument, not_found, aborted, quota_exceeded, internal]
            message: { type: string }
            reason:
              type: string
              enum: [view_only, owners_only, not_member, last_owner, team_full, code_mismatch, code_expired, already_verified, email_in_use]
              description: |
                Why, where the code alone doesn't say. `view_only`: a viewer
                tried to write. `owners_only`: the route is for owners.
                `not_member`: the caller isn't in the path's team (or it
                doesn't exist). `last_owner`: the change would leave the team
                without an owner. `team_full`: the team is at its member cap.
                Verifying an email address: `code_mismatch` (the code isn't
                right), `code_expired`, `already_verified`, and `email_in_use`
                (another account has the address).
  responses:
    OperatorsOnly:
      description: "`permission_denied`: the token's user isn't in the `operators` group (now, according to Cognito)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CompDone:
      description: Done, now or by an earlier request with the same Idempotency-Key (`replayed`).
      content:
        application/json:
          schema:
            type: object
            required: [eventId, replayed, comp, version]
            properties:
              eventId: { type: string, description: The audit event. }
              replayed: { type: boolean }
              comp:
                oneOf:
                  - type: object
                    required: [plan, until]
                    properties:
                      plan: { type: string }
                      seats: { type: integer }
                      until: { type: string, format: date-time }
                  - type: "null"
              version: { type: integer, description: The team's version after the change. }
    CompConflict:
      description: "`aborted`, nothing changed: the team isn't at `expectedVersion` (read it again), it's closed, it has no comp to end, or the Idempotency-Key was used for a different request."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Document:
      description: The document after the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Document" }
    DocumentList:
      description: A page of documents.
      content:
        application/json:
          schema:
            type: object
            required: [documents]
            properties:
              documents:
                type: array
                items: { $ref: "#/components/schemas/Document" }
              cursor: { type: string, description: Absent on the last page. }
    CommandDone:
      description: |
        Done, now or by an earlier request with the same `operationId`
        (`replayed: true`, and nothing changed this time). `result` is what
        the first run did; `sheet` and `product` are the documents as they
        are now, read after the command.
      content:
        application/json:
          schema:
            type: object
            required: [operationId, replayed, result, product]
            properties:
              operationId: { type: string, format: uuid }
              replayed: { type: boolean }
              result: { $ref: "#/components/schemas/CommandResult" }
              sheet:
                description: Checkout and return only. `null` if the sheet has since been deleted.
                oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }]
              product:
                description: "`null` for an item that isn't in inventory."
                oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }]
    LinesAdded:
      description: |
        Done, now or by an earlier request with the same `operationId`
        (`replayed: true`, and nothing changed this time). `result` is what
        the first run did; `sheet` is as it is now, read after the command.
      content:
        application/json:
          schema:
            type: object
            required: [operationId, replayed, result, sheet]
            properties:
              operationId: { type: string, format: uuid }
              replayed: { type: boolean }
              result:
                type: object
                required: [operationId, command, sheetId, lines, userId, at]
                properties:
                  operationId: { type: string, format: uuid }
                  command: { const: addLines }
                  sheetId: { type: string }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [productKey, quantity, lineCreated]
                      properties:
                        productKey: { type: string }
                        quantity: { type: integer }
                        lineCreated: { type: boolean, description: "False: it added to a line already on the sheet." }
                  userId: { type: string }
                  at: { type: string, format: date-time }
              sheet:
                description: "`null` if the sheet has since been deleted."
                oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }]
    CommandRefused:
      description: |
        `bad_request`, nothing changed: a malformed body, a quantity that isn't
        a whole number from 1, money with more than two decimals, a return of
        more than is left out, an item that isn't on the sheet, an item not in
        inventory checked out without `name` and `price`, or an `operationId`
        already used for a different request. Don't retry it unchanged.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CommandConflict:
      description: |
        `aborted`, nothing changed: the sheet is closed, or the line or item
        kept changing under every retry. The message says which. A retry with
        the same `operationId` is safe.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Tokens:
      description: Tokens for the app to keep in memory. The refresh token is only in the cookie.
      headers:
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, idToken, expiresIn]
            properties:
              accessToken: { type: string }
              idToken: { type: string }
              expiresIn: { type: integer, description: Seconds. }
    TeamCreated:
      description: The team. 201 when this request made it, 200 when an earlier request with the same `Idempotency-Key` did.
      content:
        application/json:
          schema:
            type: object
            required: [team]
            properties:
              team: { $ref: "#/components/schemas/Team" }
    TooManyInvites:
      description: "`quota_exceeded`: the team has sent 50 invites today (UTC) or 3 to this address, or the address has been sent 15 from all teams. Try again tomorrow. With `reason: \"team_full\"` (new invites only): the team's members and live invites fill its member cap."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyTeams:
      description: "`quota_exceeded`: the caller has created 5 teams today (UTC), or is already in 20 teams (the message says which)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: "`bad_request`: malformed JSON, ID, field, query or cursor."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: "`unauthenticated`: no token, an expired or ID token. (API Gateway's own 401 has the body `{\"message\":\"Unauthorized\"}`.)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: |
        `permission_denied`, with a `reason`: `not_member` (not a member of
        this team, the same answer if the team doesn't exist), `view_only` (a
        viewer tried to write; the web runtime hands this to the app as
        `invalid_argument`, view-only access) or `owners_only` (a contributor
        or viewer on an owners-only route). Nothing was read or written.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NoSuchMember:
      description: "`not_found`: the user isn't a member of this team."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    MemberConflict:
      description: |
        `aborted`. With `reason: "last_owner"`: the team would be left without
        an owner, and nothing changed. Without a reason: the member, or the
        caller's own role, changed meanwhile; reload and try again.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: "`not_found`: no such document (for a command: no such sheet, or for a stock adjustment no such item)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: "`aborted`: the document isn't at `expectedVersion` (for a command: it changed during every retry)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooLarge:
      description: "`quota_exceeded`: the document would be over 350,000 bytes (or the body over 1 MB)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SignInAgain:
      description: "`unauthenticated`: no cookie, or Cognito refused the code or refresh token. Clears the cookie."
      headers:
        Set-Cookie: { $ref: "#/components/headers/ClearCookie" }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    OriginRefused:
      description: "`permission_denied`: missing or unknown `Origin`."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: "`internal`: Cognito didn't answer, or answered without tokens. Try again."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
