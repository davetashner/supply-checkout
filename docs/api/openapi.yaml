openapi: 3.1.0
info:
  title: Supply Checkout API
  version: 1.0.0
  summary: Team data (products and projects), the signed-in user's teams and invites, and sign-in sessions for the web app.
  description: |
    The HTTP API in front of the data Lambdas (ADR 0006). The browser adapter
    (supply-checkout-a2b) implements the app's `window.claude.use("db")` on
    these routes; the handlers are in `backend/src/api/` and the route table
    they share with the CDK app is `backend/src/api/routes.ts`. A test
    (`backend/test/openapi.test.ts`) keeps this file and that table in step.

    ## Mapping the app's db calls

    | App call (src/main.js) | Request |
    | --- | --- |
    | `db.collection("products").onSnapshot(cb)` | `GET /teams/{teamId}/products`, following `cursor` until absent; `snap.docs[i].id` = `id`, `.data()` = `data` |
    | `db.collection("projects").orderBy("date", "desc").onSnapshot(cb)` | `GET /teams/{teamId}/projects?orderBy=date&direction=desc`, following `cursor` |
    | `db.doc("<coll>/<id>").get()` | `GET /teams/{teamId}/<coll>/<id>`; 404 `not_found` means `exists: false` |
    | `db.doc("<coll>/<id>").set(data)` | `PUT /teams/{teamId}/<coll>/<id>` with `{"data": data}` |
    | `db.doc("<coll>/<id>").update(patch)` | `PATCH /teams/{teamId}/<coll>/<id>` with `{"data": patch}` (deep merge) |
    | `db.doc("<coll>/<id>").delete()` | `DELETE /teams/{teamId}/<coll>/<id>` |
    | `db.collection("projects").doc()` | no request: the adapter makes the ID (e.g. `crypto.randomUUID()`), then `set` PUTs it |

    - **Projects were called sheets.** Through the rename's window
      (supply-checkout-005.6) every `/teams/{teamId}/projects...` route also
      answers under its old name, `/teams/{teamId}/sheets...` (the
      deprecated `sheets` tag), and a project's live updates go out under
      both collection names ([realtime.md](realtime.md)). New clients use
      `projects`; the old names go once `LegacySheetsRouteCalls` stays at
      zero.

    - **Checkout and return** don't use `PATCH` plus a stock update: they're
      the commands under the `commands` tag, each one transaction that's
      idempotent by operation ID. [commands.md](commands.md) is the client
      contract. The edit screens keep using the document routes.
    - Percent-encode the document ID as one path segment
      (`encodeURIComponent`). Product keys are what the app's `keyOf` or
      `newKey` makes; any key without `/` or control characters works.
    - Reject a call with the error body's `code` as the error's `code`, so the
      app's existing handling applies unchanged, except that a 403
      `permission_denied` with `reason: "view_only"` is rejected as
      `invalid_argument`, the artifact runtime's code that makes the app
      switch to view-only. `quota_exceeded` (413) shows "storage is
      full", `aborted` (409) says someone else changed it first (the adapter
      fetches the latest document before rejecting, so it shows), and anything
      else shows the generic "didn't save" message.
    - Send `expectedVersion` on every `set`, `update` and `delete`: the
      version of the copy held from the last list, fetch or write, or `0` for
      a document not held.
    - `teamId` is the team the user picked (`GET /me` lists them; see
      [onboarding.md](onboarding.md) for first sign-in and the team switcher).
      The server checks membership on every request; the body never names a
      team.
    - Live updates (`onSnapshot` after the first load) come from AppSync Events
      (supply-checkout-dpc), not from polling these routes. Every write here is
      a single PutItem or DeleteItem on the document's item, so each produces
      exactly one DynamoDB stream record (NEW_AND_OLD_IMAGES) with the new
      `version`.

    ## Document semantics

    - A document is any JSON object up to 350,000 bytes (UTF-8 JSON), nested
      at most 16 levels, with numbers DynamoDB can store. These top-level
      fields are the server's and are refused in a body: `PK`, `SK`, `GSI1PK`,
      `GSI1SK`, `GSI2PK`, `GSI2SK`, `GSI3PK`, `GSI3SK` (and any `GSI<n>PK` or `GSI<n>SK`), `type`, `id`, `key`, `version`, `teamId`. For projects, `date` must be a string
      and `items` an object. A barcode (`code`, on a product and on each line
      in a project's `items`) must be a string of at most 256 characters, the
      product key limit; it's empty for an item without a barcode. A
      product's `price` and `cost`, and a line's, if present, must be `Money`
      amounts (0 to 1,000,000, at most two decimals; ADR 0014) where the write
      changes them. A legacy value the document already had, carried over
      unchanged, is rounded to cents instead of refused. A product's
      optional `brand` must be a string of at most 100 characters (after
      trimming) with no control characters, or `null`; it's stored trimmed,
      and a blank or `null` brand removes the field.
    - A product's `stock` changes only through the stock commands (the
      `commands` tag) and the CSV import, which record a movement for every
      change. A product `set` or `update` keeps the stored `stock`: leave it
      out of the body (the stored value is kept, or stays absent), or repeat
      the stored value exactly. Any other `stock`, including one on a product
      that doesn't track stock or doesn't exist yet, is 400 `bad_request` and
      changes nothing. A new item starts counting with a `count` adjustment
      after it's created. See [commands.md](commands.md).
    - Every other field is kept exactly as written. The `Product`, `Project` and
      `ProjectLine` schemas list the fields the app writes; all of them,
      including each line's `code`, read back unchanged.
    - `update` merges like the artifact runtime: where the patch and the
      document both have an object at the same key, they merge key by key;
      any other value (including `null` and arrays) replaces.
    - Every write increments `version`, and every write must send
      `expectedVersion` (ADR 0006): the version it was made against, or `0`
      for a document that shouldn't exist yet. If the document is at another
      version, or changes between the server's read and its write, the write
      fails with 409 `aborted` and changes nothing; fetch the document and
      make the change again on the latest values. A write without it is 400
      `bad_request`.
    - Projects ordered by date come from an index, which can lag a write by a
      moment. Unordered lists and single reads are strongly consistent. A
      project without a valid `YYYY-MM-DD` date sorts after every dated project
      when newest-first.

    ## Isolation

    Every data route needs a Cognito access token. The Lambda checks the
    caller's membership of the path's team on every request, and their role
    against the route's (ADR 0007: viewers read; contributors also scan and
    edit projects and inventory; owners also import and manage members), and
    makes every DynamoDB call through a role session tagged with that team,
    whose IAM policy allows only that team's partition
    (`dynamodb:LeadingKeys`). A role below the route's is 403
    `permission_denied` with `reason` `view_only` or `owners_only`.

    The account routes (`/me`, `/me/email/*`, `POST /teams`, `POST /invites/{inviteId}/accept`)
    need the same token. They name no team the caller is already in, so they
    run on a separate role session tagged with the caller's `sub` and at most
    one team and one invitee the request is entitled to (the new team, or the
    team whose invite matched the caller's verified email). The members
    routes run there too, on the path's team after the same membership and
    role checks: changing or removing another member also updates or deletes
    that member's own team-switcher row, so only those sessions carry a tag
    for that member's partition, and only for updates and deletes. The
    invites routes run there too: creating or re-sending an invite also
    counts it against the invited address's daily limit, so only those
    sessions carry a tag for that address's counter, and only for updates.
servers:
  - url: https://api.{envDomain}
    variables:
      envDomain:
        default: supplycheckout.com
        description: The environment's domain; staging and dev use `<env>.supplycheckout.com`.
security:
  - cognito: []
tags:
  - name: products
    description: The team's inventory, the app's `products` collection.
  - name: projects
    description: |
      Checkout projects per client job (formerly sheets), the app's
      `projects` collection.
  - name: sheets
    description: |
      Deprecated. The old names of the `projects` routes, from before the
      sheets-to-projects rename. Each is served by the same code as its
      `/projects` twin, with the same roles, bodies and answers, until old
      clients are gone (the `LegacySheetsRouteCalls` metric is flat at zero),
      then removed. Bodies take a renamed field under either name
      (`toProjectId` or `toSheetId`), and answers carry both (`project` and
      `sheet`, `projectId` and `sheetId`; see [commands.md](commands.md)).
  - name: commands
    description: |
      Checkout, return and stock adjustments as single transactions, each
      idempotent by a client-generated operation ID, and an item's stock
      history. The client contract is in [commands.md](commands.md).
  - name: settings
    description: |
      The team's settings (ADR 0017, section 2a): the markup on company
      equipment bought on a receipt for a client. Owners read and change
      them; everyone else gets none of them back.
  - name: receipts
    description: |
      Reading a receipt photo with Claude on Amazon Bedrock (ADR 0008) for the
      app's review screen. Nothing is saved: the user checks every line and
      saves through the document and command routes.
  - name: account
    description: The signed-in user's teams and pending invites, creating a team, and accepting an invite (first sign-in).
  - name: members
    description: A team's members and roles (ADR 0007). Owners list members, change roles and remove members; anyone can leave; a team always keeps an owner.
  - name: invites
    description: |
      A team's invites (ADR 0007). Owners invite an address with a role, and
      the server emails it a link with a single-use token (only its hash is
      stored) that expires in 7 days. Owners see each invite as pending,
      failed (its email bounced, drew a complaint or couldn't be sent) or
      expired, and can revoke or re-send it. Joining is
      `POST /invites/{inviteId}/accept` ([onboarding.md](onboarding.md)).
  - name: billing
    description: |
      Subscriptions through Stripe (ADR 0009, ADR 0013). Owners start Stripe
      Checkout for their team; Stripe's webhook, through a queue, turns what
      they buy into the team's plan, seats and status, which `GET /me` shows.
      The prices are provisional until the pricing decision
      (supply-checkout-akz).
  - name: auth
    description: Sign-in sessions for the web app, with the refresh token in an HttpOnly cookie.
  - name: ops
    description: |
      Platform operators (ADR 0015), primary region only: list and search
      teams, read one team's account record, comp a team, and read the
      operator audit. Every route needs an access token from the **operator**
      user pool (`opsCognito`), whose user must be in the `operators` group;
      a customer's token is refused. Removing, disabling or signing out an
      operator takes effect on their next request. Operators never read a
      team's projects, inventory, invites or receipts. They can list imports
      stuck part-way and take one out of the stuck-import check. Every change, and every
      read of one team's record, is audited, and the team's owners see it
      (`GET /teams/{teamId}/support-actions`). `npm run ops` is the client.
paths:
  /teams/{teamId}/products:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [products]
      operationId: listProducts
      summary: List the team's products (inventory), in key order.
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/products/{key}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: key
        in: path
        required: true
        description: The product key, percent-encoded. Up to 256 characters, no `/` or control characters.
        schema: { type: string, minLength: 1, maxLength: 256 }
    get:
      tags: [products]
      operationId: getProduct
      summary: Read one product.
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [products]
      operationId: setProduct
      summary: Create or replace a product (the app's `set`), keeping its stored `stock`.
      description: |
        Replaces every field but `stock`, which only the stock commands change:
        the stored `stock` is kept when the body leaves it out, and a body
        `stock` that differs from it (any `stock` for a new product, or one
        that doesn't track stock) is 400 `bad_request`.
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Deep-merge into an existing product (the app's `update`), keeping its stored `stock`.
      description: A patch `stock` that differs from the stored one (or any, if the product doesn't track stock) is 400 `bad_request`; only the stock commands change it.
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Delete a product. Deleting one that doesn't exist succeeds with `expectedVersion=0`.
      parameters: [{ $ref: "#/components/parameters/expectedVersion" }]
      responses:
        "204": { description: "Deleted, or already gone." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /teams/{teamId}/products/{key}/stock:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/productKey"
    post:
      tags: [commands]
      operationId: adjustStock
      summary: Change an item's stock outside a project, in one transaction, with a movement in its history.
      description: |
        - `reason: "receipt"`: `quantity` eaches bought at `unitCost` each
          (after any pack conversion, ADR 0014) are added to stock. An item
          that didn't track stock starts at `quantity`. The item's `price`
          and `cost` don't change; update the document for that.
        - `reason: "count"`: someone counted `count` in storage. Stock is set
          to it, and the movement records the difference.
        - `reason: "uncount"`: the item is no longer counted. Its `stock` is
          removed and the movement takes it to 0 (`delta` is minus the stock
          it had). An item that isn't counted stays as it is, with a movement
          of `delta: 0` and `tracked: false`.

        A count or uncount can send `expectedStock`: the stock the person saw
        when they started (the edit form's count when it opened), or `null` if
        the item wasn't counted then. If the stock is something else now, and
        not already what the command would leave, it's refused with 409
        `aborted`, reason `stock_changed`, rather than undo someone else's
        change; the message says what the stock is now.

        Contributors and owners only. Idempotent by `operationId`.
      requestBody: { $ref: "#/components/requestBodies/StockAdjust" }
      responses:
        "200": { $ref: "#/components/responses/CommandDone" }
        "400": { $ref: "#/components/responses/CommandRefused" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CommandConflict" }
  /teams/{teamId}/products/{key}/movements:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - $ref: "#/components/parameters/productKey"
    get:
      tags: [commands]
      operationId: listMovements
      summary: An item's stock history, newest first. Any member can read it.
      parameters:
        - name: limit
          in: query
          description: At most this many movements. Default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: A page of movements.
          content:
            application/json:
              schema:
                type: object
                required: [movements]
                properties:
                  movements:
                    type: array
                    items: { $ref: "#/components/schemas/Movement" }
                  cursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/imports:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    post:
      tags: [products]
      operationId: importProducts
      summary: Import items from a CSV file, all or nothing, with a dry-run preview. Owners only.
      description: |
        The server reads the file (columns `name`, `brand`, `barcode`, `kind`, `price`,
        `cost`, `stock`, `pack_size`, matched without regard to case or
        spacing; other columns are left out) and validates every row against the whole
        inventory before it writes anything. A row matches an existing item by
        barcode, or by name when the row or the item has no barcode, and
        updates it; a re-import **sets** brand, price, cost, pack size and stock to
        the file's values and never duplicates an item. Blank optional cells
        keep what's there. `kind` is `supply` or `equipment` (ADR 0017); blank
        or missing is a supply, which needs a `price`. Company equipment has no
        price (a price for it is a row error), and its `cost` is its value; a
        supply row makes an equipment item a supply again. Money may have `$` and thousands separators and is
        rounded to cents; stock and pack size are whole numbers (ADR 0014).

        - `dryRun: true`: writes nothing. 200 with `status: "preview"` (or
          `"invalid"` with every problem) and what each row will do.
        - Otherwise: 200 `imported` when every row is in. A file with any bad
          row is 400 `bad_request` with every problem in `errors`, and nothing
          is written. The import is staged, then committed in transactions of
          up to 49 rows and 2.5 MB; if it stops part-way (a timeout, or 409 when
          items kept changing), send the same request again (same `importId`
          and file, from any owner) to finish it. The same `importId` with a
          finished import returns its summary with `replayed: true`; with a
          different file it is 400. A 409 whose message says to choose the
          file again (the import expired, or a key it planned was taken by an
          item with another barcode) needs a new `importId`.

        At most 1,000 rows and 300 KB. Owners only: a contributor or viewer
        gets 403 `permission_denied` with `reason: "owners_only"`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csv]
              properties:
                importId: { allOf: [{ $ref: "#/components/schemas/OperationId" }], description: "One UUID per import, sent again unchanged on every retry. Required unless `dryRun`." }
                csv: { type: string, maxLength: 300000, description: The file's text (UTF-8). The first non-blank row names the columns. }
                dryRun: { type: boolean, description: "True: validate and preview, and write nothing." }
            examples:
              preview:
                summary: Preview a file
                value: { dryRun: true, csv: "name,barcode,price,cost,stock,pack_size\nNitrile gloves,0123,12.50,9.99,40,100\n" }
      responses:
        "200":
          description: The preview (dry run), or the finished import.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [status, rows, errors, errorCount, ignoredColumns, summary]
                    properties:
                      status: { type: string, enum: [preview, invalid] }
                      rows: { type: array, items: { $ref: "#/components/schemas/ImportRow" }, description: The valid rows and what each will do. }
                      errors: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/ImportRowError" } }
                      errorCount: { type: integer }
                      ignoredColumns: { type: array, items: { type: string } }
                      summary: { $ref: "#/components/schemas/ImportSummary" }
                  - type: object
                    required: [status, importId, replayed, summary]
                    properties:
                      status: { const: imported }
                      importId: { type: string, format: uuid }
                      replayed: { type: boolean }
                      summary: { $ref: "#/components/schemas/ImportSummary" }
        "400":
          description: "`bad_request`, nothing written: a malformed body or file, or rows with problems (listed in `errors`, at most 200, and counted in `errorCount`)."
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Error" }
                  - type: object
                    properties:
                      errors: { type: array, items: { $ref: "#/components/schemas/ImportRowError" } }
                      errorCount: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`aborted`: items kept changing under the import (send the same request again to finish it), or it can't go on as staged: its plan expired, or a key it planned to create was taken by an item with another barcode (import the file again with a new `importId`). The message says which."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413": { $ref: "#/components/responses/TooLarge" }
  /teams/{teamId}/projects:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [projects]
      operationId: listProjects
      summary: List the team's projects, by ID (consistent) or by date (from an index).
      parameters:
        - name: orderBy
          in: query
          description: "`date` for date order, which the app's project list uses."
          schema: { type: string, enum: [date] }
        - name: direction
          in: query
          description: With `orderBy`. Default `asc`.
          schema: { type: string, enum: [asc, desc] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/sheets:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [sheets]
      operationId: listSheets
      deprecated: true
      summary: "Deprecated: the old name of `GET /teams/{teamId}/projects`, served by the same code, with the same roles, body and answers, through the rename's window. Calls are counted in `LegacySheetsRouteCalls`."
      parameters:
        - name: orderBy
          in: query
          description: "`date` for date order, which the app's project list uses."
          schema: { type: string, enum: [date] }
        - name: direction
          in: query
          description: With `orderBy`. Default `asc`.
          schema: { type: string, enum: [asc, desc] }
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200": { $ref: "#/components/responses/DocumentList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/teamId"
      - name: projectId
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    get:
      tags: [projects]
      operationId: getProject
      summary: Read one project.
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [projects]
      operationId: setProject
      summary: Create or replace a project (the app's `set`).
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Deep-merge into an existing project (the app's `update`), e.g. `{"data":{"items":{"<key>":{"returned":3}}}}`.
      requestBody: { $ref: "#/components/requestBodies/Write" }
      responses:
