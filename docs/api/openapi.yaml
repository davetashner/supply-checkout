      summary: Change the team's settings. Owners only.
      description: |
        Saves `equipmentMarkup`, a percentage from 0 to 1,000 with at most two
        decimals (0 until it's set), if nobody else has since
        `expectedVersion` (0 for settings never saved). A change to the
        markup goes into the team's audit log with who changed it and the old
        and new value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [equipmentMarkup, expectedVersion]
              properties:
                equipmentMarkup: { type: number, minimum: 0, maximum: 1000, description: Percent, at most two decimals. }
                expectedVersion: { type: integer, minimum: 0 }
            example: { equipmentMarkup: 25, expectedVersion: 0 }
      responses:
        "200": { $ref: "#/components/responses/Settings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: The caller's teams (for the switcher) and pending invites.
      description: |
        Call after sign-in, before loading any team. `teams` lists every team
        the caller is a member of, sorted by name. `invites` lists live
        invites addressed to the caller's email, only if Cognito has verified
        it, leaving out teams the caller is already in. The user is always the
        token's `sub`: there is no way to ask about anyone else. Needs the
        `aws.cognito.signin.user.admin` scope in the access token (the server
        reads the email with Cognito's GetUser). When the verified email
        differs from the one on the caller's membership in a team (it changed
        since they joined), the membership is updated to it, so owners' member
        lists and notices use the current address.
      responses:
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                type: object
                required: [user, teams, invites]
                properties:
                  user:
                    type: object
                    required: [id, email, emailVerified, mfa]
                    properties:
                      id: { type: string, description: "The user's `sub`." }
                      email: { type: [string, "null"] }
                      emailVerified: { type: boolean, description: Invites are listed and accepted only when this is true. }
                      mfa:
                        type: string
                        enum: [totp, provider, "off"]
                        description: "Two-step sign-in, which owners need for the billing routes: `totp` (an authenticator app is on), `provider` (a Google or Apple user, whose provider's sign-in counts for it), or `off`."
                  teams:
                    type: array
                    items: { $ref: "#/components/schemas/Team" }
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      tags: [account]
      operationId: deleteAccount
      summary: Delete the caller's account, typing DELETE to confirm.
      description: |
        Refused, with nothing changed, while the caller is the only owner of
        a team that other people are still in and that isn't closed (409
        `aborted`, `reason: "last_owner"`, and the message names the teams):
        they make someone else an owner, or close the team, first.

        Otherwise the caller leaves every team. A team they're the only
        member of is closed first, and deleted 30 days later like any closed
        team. Every invite to their verified email is deleted, then
        everything the server keeps about them, and last their sign-in
        (the Cognito user), so they can't sign in again. The team audit
        trails keep their user ID (never their email) next to what they did.
        While it runs they can't join or create teams (403). If it fails part-way,
        call it again: it carries on where it stopped. Once it succeeds the
        refresh token no longer works; sign out locally and forget the
        tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm: { type: string, description: "`DELETE`, as the user typed it (any case)." }
      responses:
        "204": { description: The account is deleted. }
        "400":
          description: "`bad_request`: `confirm` isn't `DELETE`, or the body is malformed."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted` with `reason: \"last_owner\"`: the caller is the only owner of a team others are still in. Nothing changed."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /teams:
    post:
      tags: [account]
      operationId: createTeam
      summary: Create a team, with the caller as its owner, on a 14-day trial.
      description: |
        The team's home region is the region that served the request (ADR
        0010), and its free trial starts now (ADR 0009: 14 days, no card).
        Idempotent: send a new `Idempotency-Key` for each "create team"
        attempt, and the same one on retries. A repeat with the same key
        returns the team the first request made (200) instead of making
        another; the same key with a different name is 409 `aborted`. A user
        can create 5 teams a day, and be in at most 20 teams (429
        `quota_exceeded` for either).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A new random value per attempt, e.g. `crypto.randomUUID()`, reused on retries and double-clicks.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200, description: Trimmed. }
      responses:
        "201": { $ref: "#/components/responses/TeamCreated" }
        "200": { $ref: "#/components/responses/TeamCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted`: this `Idempotency-Key` already made a team with another name."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyTeams" }
  /invites/{inviteId}/accept:
    parameters:
      - name: inviteId
        in: path
        required: true
        description: "The invite's ID, from the emailed link (it's also `id` in `GET /me`)."
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    post:
      tags: [account]
      operationId: acceptInvite
      summary: Join the team that invited the caller's verified email address.
      description: |
        Needs both the `token` from the emailed invite link (proof the caller
        read that mailbox) and a caller whose Cognito-verified email is the
        invite's address. The invite must not have expired, and it works once.
        The caller joins with the invite's role. A missing or wrong token is
        the same 404 as an unknown invite.

        A team has a member cap: 10 members while it's on a trial (or not
        paying), 100 once its subscription is `active` or `past_due`. Joining
        a full team is 429 `quota_exceeded` with `reason: "team_full"`, and
        the invite stays usable for when an owner makes room. Two people
        accepting for the last place at once can't both join.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, description: The `token` parameter of the emailed invite link, as is. }
      responses:
        "200":
          description: The team the caller joined.
          content:
            application/json:
              schema:
                type: object
                required: [team]
                properties:
                  team: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`permission_denied`: the caller's email isn't verified yet."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`not_found`: no such invite for the caller's email, a missing or wrong token, or it expired or was already used."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`aborted`: the caller is already a member of the team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`quota_exceeded`: the caller is already in 20 teams, or (with `reason: \"team_full\"`) the team is at its member cap."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /me/email/code:
    post:
      tags: [account]
      operationId: sendEmailCode
      summary: Email the caller a code to verify their email address.
      description: |
        Cognito emails a 6-digit code to the caller's address
        (GetUserAttributeVerificationCode with the caller's own access token,
        so it needs the `aws.cognito.signin.user.admin` scope). Only for an
        address that isn't verified yet: `emailVerified` is false in
        `GET /me`. A new code replaces the last one. A user can ask for 10
        codes a UTC day, and Cognito limits them too (429 for either). The
        API records the address the code went to; a code verifies only that
        address, within a day. No request body, or an empty object.
      responses:
        "204": { description: The code is on its way. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted`: with `reason: \"already_verified\"`, the address is already verified; with `reason: \"email_changed\"`, the address changed while the code was being sent, so the code won't verify anything: send another."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`quota_exceeded`: too many codes asked for. Try again later."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`internal`: Cognito couldn't send the email. Try again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /me/email/verify:
    post:
      tags: [account]
      operationId: verifyEmail
      summary: Verify the caller's email address with the code from the email.
      description: |
        Checks the code with Cognito (VerifyUserAttribute), which marks the
        address verified, and records the address as the one the caller
        proved. Then refresh the tokens (`POST /auth/refresh`): for a user
        with Google or Apple linked, the refresh is when the address is
        recorded and starts to count (docs/infrastructure.md, Sign-in).
        After that, `GET /me` shows `emailVerified: true` and the invites
        sent to the address. Cognito limits wrong tries (429). Once the
        address counts as verified, the caller's membership in each of their
        teams is updated to it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "204": { description: The address is verified. }
        "400":
          description: "`bad_request`: with `reason: \"code_mismatch\"`, the code isn't right (or isn't 6 digits); with `reason: \"code_expired\"`, ask for a new one."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted`: with `reason: \"already_verified\"`, the address is already verified; with `reason: \"email_in_use\"`, another account has this address; with `reason: \"email_changed\"`, the address isn't the one the code was sent to through the API (or it changed while the code was checked, the code is over a day old, or Cognito didn't mark it verified), so nothing was recorded: send a new code."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`quota_exceeded`: too many tries. Try again later."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /me/password:
    post:
      tags: [account]
      operationId: setPassword
      summary: Set the caller's password.
      description: |
        Sets the caller's password with Cognito (ChangePassword, with their
        own access token). Send `currentPassword` if they have one; a user who
        has only signed in with an email code or a passkey sends none. Once
        an authenticator app is on (`setupTotp`), Cognito lets the user sign
        in only with their password and its code, so the app has them set one
        first. The pool's policy: at least 12 characters, with upper and lower
        case letters, a number and a symbol. Not for Google or Apple users.
        Once it's set, the account's verified address (from Cognito, never
        the request) is emailed that a password was set, and when; the
        answer doesn't depend on that email and waits at most 3 seconds for
        it. The same change made with a direct Cognito call (ChangePassword)
        is emailed too, from CloudTrail, and a change made here isn't emailed
        twice; an email change is told to the previous address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 256 }
                currentPassword: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "204": { description: The password is set. }
        "400":
          description: "`bad_request`: with `reason: \"password_invalid\"`, the password doesn't meet the policy; with `reason: \"password_mismatch\"`, the current password is wrong, or missing for a user who has one."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted` with `reason: \"federated_sign_in\"`: a Google or Apple user, who signs in only through their provider."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`quota_exceeded`: too many tries. Try again later."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /me/mfa/totp:
    post:
      tags: [account]
      operationId: setupTotp
      summary: A new secret for the caller's authenticator app.
      description: |
        Two-step sign-in, which owners need before they change billing
        (ADR 0007). Answers a new TOTP secret (Cognito's
        AssociateSoftwareToken, with the caller's own access token) for the
        app to show as a QR code (`otpauth://totp/...`) and as text. Nothing
        changes until a code from it is checked (`verifyTotp`): an
        authenticator already on keeps working until then. Not for Google or
        Apple users, whose provider's sign-in counts for it.
      requestBody:
        required: false
        description: Nothing, or an empty object.
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: The secret, base32.
          content:
            application/json:
              schema:
                type: object
                required: [totp]
                properties:
                  totp:
                    type: object
                    required: [secret]
                    properties:
                      secret: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted` with `reason: \"federated_sign_in\"`: a Google or Apple user."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /me/mfa/totp/verify:
    post:
      tags: [account]
      operationId: verifyTotp
      summary: Turn two-step sign-in on with a code from the authenticator app.
      description: |
        Checks the code against the secret from `setupTotp`
        (VerifySoftwareToken), turns the authenticator app on as the caller's
        preferred second factor (SetUserMFAPreference), and then signs the
        caller out everywhere (GlobalSignOut), this session too: every earlier
        session began without the code. The app then sends them to sign in
        again, with their password and a code from the app. Set a password
        first (`setPassword`) if they don't have one. Once it's on, the
        account's verified address (from Cognito, never the request) is
        emailed that two-step sign-in was turned on, and when, whether or not
        the sign-out everywhere finished; the answer doesn't depend on that
        email and waits at most 3 seconds for it. The same change made with
        direct Cognito calls (VerifySoftwareToken, SetUserMFAPreference) is
        emailed too, from CloudTrail, and a change made here isn't emailed
        twice; an email change is told to the previous address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "204": { description: "Two-step sign-in is on, and every session has ended." }
        "503":
          description: "`internal` with `reason: \"signout_failed\"`: two-step sign-in is on, but Cognito couldn't end the caller's other sessions (tried three times). Finish it with `signOutEverywhere`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "400":
          description: "`bad_request` with `reason: \"code_mismatch\"`: the code isn't right (or isn't 6 digits)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: "`aborted`: with `reason: \"code_expired\"`, no secret is waiting to be checked (start again with `setupTotp`); with `reason: \"federated_sign_in\"`, a Google or Apple user."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`quota_exceeded`: too many tries. Try again later."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /me/sign-out-everywhere:
    post:
      tags: [account]
      operationId: signOutEverywhere
      summary: End every session the caller has, this one too.
      description: |
        Cognito's GlobalSignOut with the caller's own access token: their
        refresh tokens stop working, and Cognito refuses their access tokens
        (so the billing routes do). The app sends it when turning two-step
        sign-in on answered `signout_failed`.
      requestBody:
        required: false
        description: Nothing, or an empty object.
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "204": { description: Every session has ended. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503":
          description: "`internal` with `reason: \"signout_failed\"`: Cognito couldn't do it, or throttled it, after three tries. Try again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /teams/{teamId}/members:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [members]
      operationId: listMembers
      summary: The team's members and their roles. Owners only.
      description: |
        Owners first, then contributors, then viewers, each by email. `email`
        is the address the member joined with, or `null` if there wasn't one.
      responses:
        "200":
          description: The team's members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/members/{userId}:
    parameters:
      - { $ref: "#/components/parameters/teamId" }
      - name: userId
        in: path
        required: true
        description: "The member's user ID (`userId` in the member list; the caller's own is `user.id` in `GET /me`)."
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    patch:
      tags: [members]
      operationId: setMemberRole
      summary: Change a member's role. Owners only.
      description: |
        Takes effect on the member's next request. An owner can change their
        own role too, but a team always keeps at least one owner: demoting
        the last one is 409 with `reason: "last_owner"`. That is enforced in
        the same transaction as the change, so two owners demoting each other
        at once can't both succeed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [owner, contributor, viewer] }
      responses:
        "200":
          description: The member with their new role.
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NoSuchMember" }
        "409": { $ref: "#/components/responses/MemberConflict" }
    delete:
      tags: [members]
      operationId: removeMember
      summary: Remove a member (owners), or leave the team (anyone, with their own user ID).
      description: |
        The member loses access on their next request, and their live updates
        stop. The team's last owner can't be removed or leave (409 with
        `reason: "last_owner"`), enforced in the same transaction. Their
        pending invites to the team go too: to the address on their
        membership and, when they leave, to the address they have verified
        now. Leaving needs the `aws.cognito.signin.user.admin` scope, like
        `GET /me`.
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NoSuchMember" }
        "409": { $ref: "#/components/responses/MemberConflict" }
  /teams/{teamId}/invites:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [invites]
      operationId: listInvites
      summary: The team's invites that haven't been accepted or revoked. Owners only.
      description: |
        Newest first. An expired invite stays listed (as `expired`) until
        DynamoDB's TTL removes it, so the owner can re-send it.
      responses:
        "200":
          description: The team's invites.
          content:
            application/json:
              schema:
                type: object
                required: [invites]
                properties:
                  invites:
                    type: array
                    items: { $ref: "#/components/schemas/TeamInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [invites]
      operationId: createInvite
      summary: Invite an email address to the team with a role, and email it the link. Owners only.
      description: |
        Creates the invite, then emails the link
        (`https://app.<env domain>/?invite=<id>&token=<token>`) from
        `noreply@<env domain>`. The token is in the email only; the response
        never has it. If SES won't send the email, the invite is still made,
        and comes back with `inviteStatus: "failed"` and
        `failureReason: "not_sent"`: re-send or revoke it. A bounce or
        complaint reported later marks it failed too (`bounced`,
        `complained`).

        Each team can send 50 invites a day (UTC), 3 of them to any one
        address, and each address can be sent 15 from all teams together;
        re-sends count. An address counts without a `+tag`, and a Gmail
        address without its dots. Past any of these, 429 `quota_exceeded`.

        Members and live invites together can't exceed the team's member cap
        (10 on a trial, 100 when paying; see acceptInvite): past it, 429
        `quota_exceeded` with `reason: "team_full"`. Revoke an invite or
        remove a member to make room.

        `email` must be a bare address (`name@example.com`): no display name,
        angle brackets, quotes, commas or spaces, and an ASCII domain
        (international ones in their `xn--` form). Anything else is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, maxLength: 254, description: "The address to invite. Matched without regard to case (and after Unicode NFKC)." }
                role: { type: string, enum: [owner, contributor, viewer] }
      responses:
        "201":
          description: The invite, pending (the email was sent) or failed (`not_sent`).
          content:
            application/json:
              schema:
                type: object
                required: [invite]
                properties:
                  invite: { $ref: "#/components/schemas/TeamInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`aborted`: the address is already a member's, or already has a live invite to this team (re-send that one)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyInvites" }
  /teams/{teamId}/invites/{inviteId}:
    parameters:
      - { $ref: "#/components/parameters/teamId" }
      - { $ref: "#/components/parameters/inviteId" }
    delete:
      tags: [invites]
      operationId: revokeInvite
      summary: Revoke an invite, so its link stops working. Owners only.
      description: Revoking an invite that's already gone (accepted, revoked or expired and removed) is also 204.
      responses:
        "204": { description: Revoked. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/invites/{inviteId}/resend:
    parameters:
      - { $ref: "#/components/parameters/teamId" }
      - { $ref: "#/components/parameters/inviteId" }
    post:
      tags: [invites]
      operationId: resendInvite
      summary: Send an invite again, with a new link. Owners only.
      description: |
        Replaces the invite with a new one: a new `id` and token (the old
        link stops working), the same address and role, a new 7-day expiry,
        and no failure. Works for a pending, failed or expired invite, and
        counts against the same daily limits. No request body. To correct the
        address, revoke the invite and make a new one.
      responses:
        "201":
          description: The new invite, pending or failed (`not_sent`), as for `createInvite`.
          content:
            application/json:
              schema:
                type: object
                required: [invite]
                properties:
                  invite: { $ref: "#/components/schemas/TeamInvite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`not_found`: the invite was accepted or revoked."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`aborted`: the address has become a member's since the invite was made (revoke it instead), or another live invite to it was made meanwhile."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyInvites" }
  /teams/{teamId}/close:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    post:
      tags: [members]
      operationId: closeTeam
      summary: Close the team. Owners only, typing the team's name to confirm.
      description: |
        The team becomes read-only at once: every member can still read it
        (so owners can export it) and leave, but nothing else changes, and a
        write is 403 `permission_denied` with `reason: "team_closed"`. Its
        invites are deleted, nobody can join, and live updates stop. 30 days
        later (`deletesAt`) all of its data is deleted: projects, inventory,
        stock history, members and the audit trail. `name` must be the
        team's name (ignoring case and surrounding spaces), or it's 400 and
        nothing changes. Closing a closed team returns it as it is. Until an
        hour before `deletesAt`, an owner can reopen it (`reopenTeam`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, description: The team's name, as the owner typed it to confirm. }
      responses:
        "200":
          description: The closed team, with `closedAt` and `deletesAt`.
          content:
            application/json:
              schema:
                type: object
                required: [team]
                properties:
                  team: { $ref: "#/components/schemas/Team" }
        "400":
          description: "`bad_request`: `name` isn't the team's name, or the body is malformed."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`aborted`: the caller's role, or the team, changed meanwhile; reload and try again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /teams/{teamId}/reopen:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    post:
      tags: [members]
      operationId: reopenTeam
      summary: Reopen a closed team before it's deleted. Owners who are still in it, typing its name to confirm.
      description: |
        The team is writable again at once, it won't be deleted, and live
        updates start again. What the closure undid stays undone: its
        invites were deleted, and anyone who left or was removed while it
        was closed isn't back (owners invite them again). Every owner is
        emailed that it was reopened (best effort). `name` must be the
        team's name (ignoring case and surrounding spaces), or it's 400 and
        nothing changes. Reopening a team that isn't closed returns it as
        it is. Refused within an hour of `deletesAt`, or once the
        scheduled purge has started deleting it (409, reason
        `team_deleting`). An owner who left the closed team isn't a member any more
        (403 `not_member`). A team can be reopened 3 times a UTC day (429
        `quota_exceeded` after that), which bounds the owner emails that
        closing and reopening send.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, description: The team's name, as the owner typed it to confirm. }
      responses:
        "200":
          description: The reopened team, with `closedAt` and `deletesAt` null.
          content:
            application/json:
              schema:
                type: object
                required: [team]
                properties:
                  team: { $ref: "#/components/schemas/Team" }
        "400":
          description: "`bad_request`: `name` isn't the team's name, or the body is malformed."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`aborted`: the caller's role, or the team's closure, changed meanwhile (reload and try again); or, with `reason: \"team_deleting\"`, the team is less than an hour from being deleted, or being deleted, and can't be reopened."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`quota_exceeded`: the team was already reopened 3 times today (UTC); try again tomorrow."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /teams/{teamId}/support-actions:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [members]
      operationId: listSupportActions
      summary: What Supply Checkout support did to this team (ADR 0015). Owners only.
      description: |
        Newest first: comps (`ops.comp.set`, `ops.comp.end`, with the comp
        before and after) and each time support read the team's account
        record (`ops.team.read`). The actor is always "Supply Checkout
        support"; which operator it was is never shown.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: A page of support actions.
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      required: [eventId, ts, actor, action]
                      properties:
                        eventId: { type: string }
                        ts: { type: string, format: date-time }
                        actor: { type: string, const: Supply Checkout support }
                        action: { type: string, enum: [ops.team.read, ops.comp.set, ops.comp.end, ops.comp.discount, ops.import.clear, ops.team.reopen] }
                        reason: { type: string }
                        before: { $ref: "#/components/schemas/AuditRecord" }
                        after: { $ref: "#/components/schemas/AuditRecord" }
                  cursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teams/{teamId}/billing/checkout:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    post:
      tags: [billing]
      operationId: createCheckout
      summary: Start Stripe Checkout for the team's subscription. Owners only.
      description: |
        Answers the URL of a Stripe Checkout page for a subscription to `plan`,
        billed every `interval`, linked to the team's Stripe customer (made
        the first time). Send the owner there; Stripe sends
        them back to the app with `?billing=success&team=<teamId>` (or
        `billing=canceled`). The page expires after 24 hours (Stripe's default).

        Plans: `starter` (`month` or `year`): $9 a month including 3 seats,
        then $3 a seat; a year is 10 months' price. Provisional until
        supply-checkout-akz. The seat quantity isn't sent: it's the team's
        billed members when the page is made (owners and editors; viewers
        are free), at least 1, and the billing worker keeps it in step with
        the members afterwards.

        A team still in its free trial (with at least two days of it left)
        keeps it: Checkout asks for no card, the subscription's trial ends
        when the team's does (`trialEndsAt` in the answer), and if no card is
        added by then Stripe cancels it. Otherwise Checkout asks for a card.

        Nothing about the team changes here: the Stripe webhook sets its plan,
        seats and status once the owner finishes on Stripe. Idempotent: the
        same `Idempotency-Key` with the same choices answers the same page
        (a new one if the billed members changed in between).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A new random value per "continue to checkout", reused on retries and double-clicks.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan, interval]
              properties:
                plan: { type: string, enum: [starter] }
                interval: { type: string, enum: [month, year] }
      responses:
        "201":
          description: The Checkout page to send the owner to.
          content:
            application/json:
              schema:
                type: object
                required: [checkout]
                properties:
                  checkout:
                    type: object
                    required: [url, expiresAt, trialEndsAt]
                    properties:
                      url: { type: string, format: uri, description: "Stripe's hosted Checkout page." }
                      expiresAt: { type: string, format: date-time, description: When the page stops working. }
                      trialEndsAt: { type: [string, "null"], format: date-time, description: "When the subscription's free trial ends, or `null` when Checkout asks for a card now." }
        "400":
          description: "`bad_request`: no or a malformed `Idempotency-Key`, a plan or interval we don't sell, or any other field (such as `seats`)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`permission_denied`: `owners_only`, `not_member`, `mfa_required` (checked after membership and role: the owner hasn't turned on two-step sign-in with an authenticator app, `setupTotp`; Google and Apple users don't need it), `mfa_sign_in_again` (the token's session began before two-step sign-in was turned on: sign in again), or `team_closed` (reopen the team first)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`aborted`: with `reason: \"already_subscribed\"`, the team has a subscription that hasn't ended (change it in the Customer Portal); otherwise the team changed meanwhile, try again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: "`internal`: Stripe couldn't be reached or refused the request. Nothing about the team changed; try again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /teams/{teamId}/billing/portal:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    post:
      tags: [billing]
      operationId: createPortalSession
      summary: Open the Stripe Customer Portal for the team. Owners only.
      description: |
        Answers the URL of a Stripe Customer Portal session for the team's
        Stripe customer (made by its first checkout), where the owner updates
        the card and billing details, switches between monthly and annual,
        sees and downloads invoices, and cancels (at the end of the period).
        Send the owner there; Stripe sends them back to the app with
        `?billing=portal&team=<teamId>`. The session is short-lived: ask for a
        new one each time.

        The customer is always the path's team's own, and the portal's
        configuration and the return URL are the server's; nothing in the
        request reaches Stripe. Changes the owner makes there reach the team
        through the Stripe webhook within a minute: a cancellation shows as
        `cancelsAt` on the team, and when the period ends the team turns
        read-only (`subscriptionEnded`). A team whose subscription ended can
        still open it, for its invoices and details.
      requestBody:
        required: false
        description: Nothing, or an empty object.
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201":
          description: The portal session to send the owner to.
          content:
            application/json:
              schema:
                type: object
                required: [portal]
                properties:
                  portal:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string, format: uri, description: "Stripe's hosted Customer Portal session." }
        "400":
          description: "`bad_request`: a body that isn't empty or `{}`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`permission_denied`: `owners_only`, `not_member`, `mfa_required` (checked after membership and role: the owner hasn't turned on two-step sign-in with an authenticator app, `setupTotp`; Google and Apple users don't need it), `mfa_sign_in_again` (the token's session began before two-step sign-in was turned on: sign in again), or `team_closed` (reopen the team first)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`aborted` with `reason: \"no_billing_account\"`: the team has no Stripe customer yet. Subscribe first (`createCheckout`)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: "`internal`: Stripe couldn't be reached or refused the request, or the portal isn't set up in this Stripe mode. Try again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /teams/{teamId}/billing/invoices:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    get:
      tags: [billing]
      operationId: listInvoices
      summary: List the team's latest invoices, as Stripe has them. Owners only.
      description: |
        The latest invoices (up to 24, newest first) of the team's Stripe
        customer (made by its first checkout), read from Stripe on each
        request, so the list is Stripe's. Drafts aren't listed: Stripe hasn't
        sent them yet. `hasMore` means there are older ones, which the Customer
        Portal lists (`createPortalSession`). Each invoice links to Stripe's
        hosted invoice page and its PDF, which carry the billing name, address
        and tax ID on the customer (collected by Checkout, changed in the
        portal). A link is null unless it's an https page on stripe.com.
        Stripe emails invoices and receipts itself. A team whose subscription
        ended still lists its invoices.
      responses:
        "200":
          description: The team's latest invoices.
          content:
            application/json:
              schema:
                type: object
                required: [invoices, hasMore]
                properties:
                  invoices:
                    type: array
                    items:
                      type: object
                      required: [id, number, status, createdAt, currency, total, amountDue, amountPaid, hostedUrl, pdfUrl]
                      properties:
                        id: { type: string, description: "Stripe's invoice ID." }
                        number: { type: [string, "null"], description: "The number printed on the invoice." }
                        status: { type: string, enum: [open, paid, uncollectible, void], description: "Stripe's invoice status." }
                        createdAt: { type: string, format: date-time }
                        currency: { type: string, description: "Three-letter ISO code, lowercase." }
                        total: { type: integer, description: In the currency's smallest unit (cents). }
                        amountDue: { type: integer, description: In the currency's smallest unit. }
                        amountPaid: { type: integer, description: In the currency's smallest unit. }
                        hostedUrl: { type: [string, "null"], format: uri, description: "Stripe's hosted invoice page, to view and pay it." }
                        pdfUrl: { type: [string, "null"], format: uri, description: "The invoice's PDF, on Stripe." }
                  hasMore: { type: boolean, description: "There are older invoices; the Customer Portal lists them all." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`permission_denied`: `owners_only`, `not_member`, `mfa_required` or `mfa_sign_in_again` (checked after membership and role, as for `createPortalSession`), or `team_closed` (reopen the team first)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`aborted` with `reason: \"no_billing_account\"`: the team has no Stripe customer yet, so no invoices."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: "`internal`: Stripe couldn't be reached or refused the request. Try again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /billing/webhook:
    post:
      tags: [billing]
      operationId: stripeWebhook
      summary: Stripe's events. For Stripe only.
      description: |
        No Cognito token: the `Stripe-Signature` header, checked against the
        endpoint's signing secret, is the proof. A verified event we handle
        (`checkout.session.completed`, `customer.subscription.created`,
        `.updated`, `.deleted`, `.trial_will_end`, `invoice.paid`,
        `invoice.payment_failed`) is put on the billing queue, and only then
        answered 200; the billing worker applies it to the team's plan,
        seats and status, and emails owners about a trial ending without a
        card, a failed payment, or the team turning read-only. Other events,
        and events from the other Stripe mode, are answered 200 and dropped.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "A Stripe event (docs.stripe.com/api/events)." }
      responses:
        "200":
          description: Received (queued, or dropped as not ours to handle).
          content:
            application/json:
              schema: { type: object, required: [received], properties: { received: { type: boolean, const: true } } }
        "400":
          description: "`bad_request`: no `Stripe-Signature` header, or it doesn't match the body and the signing secret, or it's more than 5 minutes old."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413":
          description: "`quota_exceeded`: the body is over 1 MB."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: "`internal`: the event couldn't be queued. Stripe sends it again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /ops/teams:
    get:
      tags: [ops]
      operationId: opsListTeams
      summary: Teams in team ID order, 50 a page, with their owners. Audited as `ops.teams.list` (with `q` and the teams returned).
      description: |
        Each request reads at most 1,000 teams from the operators' index,
        whatever the number of teams. A search (`q`) that hasn't filled its
        page by then returns the teams it found, possibly none, with a
        `cursor`: keep following it until there's none. A team whose ID is
        `q` comes first, on the first page.
      security: [{ opsCognito: [] }]
      parameters:
        - { name: q, in: query, description: "A team ID, or part of a team's name (any case).", schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, description: The previous page's `cursor`, with the same `q`., schema: { type: string } }
      responses:
        "200":
          description: A page of teams.
          content:
            application/json:
              schema:
                type: object
                required: [teams]
                properties:
                  teams: { type: array, items: { $ref: "#/components/schemas/OpsTeam" } }
                  cursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
  /ops/teams/{teamId}:
    parameters: [{ $ref: "#/components/parameters/opsTeamId" }]
    get:
      tags: [ops]
      operationId: opsGetTeam
      summary: One team's account record and owners, with its Stripe subscription and recent invoices. Audited as `ops.team.read`.
      description: |
        The record comes from the operators' index, which lags writes by up to
        a second or so. `stripe` is read from Stripe with the ops function's
        own restricted key, for the customer on the team's record (never one
        from the request): `null` for a team with no Stripe customer, and
        `{ "error": "unavailable" }` when the key isn't stored yet, Stripe
        errors or takes more than 4 seconds; the team still comes back. It
        never includes the customer's email, name or address, card details,
        or links to Stripe's hosted invoice pages. `receipts` is the team's
        receipt reads in this UTC month and the five before, and in its trial,
        with an estimated cost (reads times `estimatedCostPerReceiptUsd` from
        `GET /ops/receipts`; an estimate, not billing).
      security: [{ opsCognito: [] }]
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema:
                type: object
                required: [team, stripe, receipts]
                properties:
                  team: { $ref: "#/components/schemas/OpsTeam" }
                  stripe: { $ref: "#/components/schemas/OpsStripeDetail" }
                  receipts:
                    type: [object, "null"]
                    description: "null when the team's receipt counters couldn't be read; the rest of the record still comes back."
                    required: [months, trialReceipts]
                    properties:
                      months:
                        type: array
                        description: This UTC month and the five before, newest first.
                        items:
                          type: object
                          required: [month, receipts, estimatedCostUsd]
                          properties:
                            month: { type: string, description: YYYY-MM }
                            receipts: { type: integer, minimum: 0 }
                            estimatedCostUsd: { type: number, minimum: 0 }
                      trialReceipts: { type: integer, minimum: 0, description: "Reads while the team wasn't paying, in all; they also count in their months." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
        "404":
          description: "`not_found`: no such team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /ops/teams/{teamId}/comp:
    parameters: [{ $ref: "#/components/parameters/opsTeamId" }]
    put:
      tags: [ops]
      operationId: opsSetComp
      summary: Comp the team, or change or extend its comp.
      description: |
        While a comp is live (`until` in the future) the team is active on
        `plan` whatever Stripe says; after it, the Stripe status applies
        again. It never changes the team's own `plan` or `status`. `until` is
        at most 12 months ahead; extend by sending a later one. Send the
        team's `version` from `GET /ops/teams/{teamId}` as `expectedVersion`.
        Audited as `ops.comp.set` in the same transaction.

        Instead of `until`, `months` (1 to 12) comps the team until that many
        calendar months from now (the same day, or the last day of a shorter
        month). A team with a live, monthly Stripe subscription then also
        gets a 100%-off coupon for those months, so its invoices in them are
        $0 and billing resumes by itself after: the billing worker applies it
        (`stripeDiscount` in the answer), and audits what it did as
        `ops.comp.discount`. A yearly subscription gets no discount. A comp
        with `until`, or ending the comp, removes the discount.
      security: [{ opsCognito: [] }]
      parameters: [{ $ref: "#/components/parameters/opsIdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan, reason, expectedVersion]
              oneOf:
                - required: [until]
                - required: [months]
              properties:
                plan: { type: string, pattern: "^[a-z][a-z0-9_-]{0,31}$", examples: [free] }
                months: { type: integer, minimum: 1, maximum: 12, description: "Instead of `until`: comp for this many months from now, with a Stripe discount for a paying team." }
                seats: { type: integer, minimum: 1, maximum: 100 }
                until: { type: string, description: "A date (YYYY-MM-DD, midnight UTC) or an ISO 8601 time with a zone, in the future and at most 12 months ahead." }
                reason: { type: string, minLength: 3, maxLength: 500, description: Why, on one line. The team's owners see it. }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/CompDone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
        "404":
          description: "`not_found`: no such team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/CompConflict" }
    delete:
      tags: [ops]
      operationId: opsEndComp
      summary: End the team's comp now. Audited as `ops.comp.end`.
      description: >-
        The team falls back to its Stripe status at once. The billing access
        rules count from when the comp stopped (now, or its own end if it had
        already run out), so a team whose trial or subscription ended while it
        was comped becomes read-only now, and its 30 days before deletion start
        now, not from that earlier date.
      security: [{ opsCognito: [] }]
      parameters: [{ $ref: "#/components/parameters/opsIdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expectedVersion]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/CompDone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
        "404":
          description: "`not_found`: no such team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/CompConflict" }
  /ops/teams/{teamId}/reopen:
    parameters: [{ $ref: "#/components/parameters/opsTeamId" }]
    post:
      tags: [ops]
      operationId: opsReopenTeam
      summary: Reopen a closed team before the purge deletes it. Audited as `ops.team.reopen`.
      description: |
        Removes the team's closure, as an owner's reopen does, so it's
        writable again and won't be deleted. Allowed until 5 minutes before
        its deletion time, past the owners' one-hour cutoff, for a disputed
        closure. Send the team's `version` from `GET /ops/teams/{teamId}` as
        `expectedVersion`. Invites deleted at closing stay deleted. The
        owners see it in their support actions. The ops function can't write
        closure fields itself: it asks the operator reopen function, which
        can only remove them.
      security: [{ opsCognito: [] }]
      parameters: [{ $ref: "#/components/parameters/opsIdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, expectedVersion]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500, description: Why, on one line. The team's owners see it. }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Reopened, now or by an earlier request with the same Idempotency-Key (`replayed`).
          content:
            application/json:
              schema:
                type: object
                required: [eventId, replayed, version]
                properties:
                  eventId: { type: string, description: The audit event. }
                  replayed: { type: boolean }
                  version: { type: integer, description: The team's version after the reopen. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
        "404":
          description: "`not_found`: no such team."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`aborted`, nothing changed: the team isn't closed, changed since it was read, has no owner, or the Idempotency-Key was used for a different request; or, with reason `team_deleting`, it's within 5 minutes of its deletion."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /ops/audit:
    get:
      tags: [ops]
      operationId: opsListAudit
      summary: The operator audit, newest first, for one team (`teamId`; `PLATFORM` for team lists and searches) or one month (default this month, UTC).
      security: [{ opsCognito: [] }]
      parameters:
        - { name: teamId, in: query, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" } }
        - { name: month, in: query, description: YYYY-MM. Not with teamId., schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { $ref: "#/components/parameters/cursor" }
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [eventId, ts, teamId, operatorSub, action, target]
                      properties:
                        eventId: { type: string }
                        ts: { type: string, format: date-time }
                        teamId: { type: string }
                        operatorSub: { type: string, description: The operator's `sub` in the operator pool. }
                        action: { type: string, enum: [ops.teams.list, ops.team.read, ops.receipts.usage, ops.comp.set, ops.comp.end, ops.comp.discount, ops.import.clear, ops.team.reopen] }
                        target: { type: string }
                        reason: { type: string }
                        before: { $ref: "#/components/schemas/AuditRecord" }
                        after: { $ref: "#/components/schemas/AuditRecord" }
                        idempotencyKey: { type: string }
                  cursor: { type: string, description: Absent on the last page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
  /ops/receipts:
    get:
      tags: [ops]
      operationId: opsListReceiptUsage
      summary: The teams that read the most receipts in a month, most first, with their estimated cost. Audited as `ops.receipts.usage`.
      description: |
        Reads up to 1,000 teams from the operators' index and each one's
        receipt counters for the month and its trial, by key; `complete` is
        false when there were more teams than that. Teams with no reads that
        month aren't listed. The cost is an estimate: reads times
        `estimatedCostPerReceiptUsd` (the top of ADR 0008's per-receipt
        estimate), not what Bedrock billed.
      security: [{ opsCognito: [] }]
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }, description: "YYYY-MM, UTC. Defaults to this month." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: The month's ranking.
          content:
            application/json:
              schema:
                type: object
                required: [month, teams, teamsRead, complete, estimatedCostPerReceiptUsd]
                properties:
                  month: { type: string }
                  teams:
                    type: array
                    items:
                      type: object
                      required: [teamId, name, status, plan, compLive, receipts, trialReceipts, estimatedCostUsd]
                      properties:
                        teamId: { type: string }
                        name: { type: string }
                        status: { type: string }
                        plan: { type: string }
                        compLive: { type: boolean }
                        receipts: { type: integer, minimum: 0, description: Reads in the month. }
                        trialReceipts: { type: integer, minimum: 0, description: "Reads while it wasn't paying, in all." }
                        estimatedCostUsd: { type: number, minimum: 0, description: The month's reads times the estimated cost per read. }
                  teamsRead: { type: integer }
                  complete: { type: boolean, description: False when there were more teams than one request reads (1,000). }
                  estimatedCostPerReceiptUsd: { type: number }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
  /ops/imports:
    get:
      tags: [ops]
      operationId: opsListStuckImports
      summary: Imports still committing more than an hour after they started, oldest first (the "Imports stuck" alarm).
      description: Only each job's team, ID, start and progress. See "Imports stuck" in docs/journeys.md.
      security: [{ opsCognito: [] }]
      responses:
        "200":
          description: The stuck imports.
          content:
            application/json:
              schema:
                type: object
                required: [imports, stuckAfterMinutes]
                properties:
                  imports:
                    type: array
                    items:
                      type: object
                      required: [teamId, importId, startedAt, committed, total]
                      properties:
                        teamId: { type: string }
                        importId: { type: string }
                        startedAt: { type: string, format: date-time }
                        committed: { type: integer, description: Rows committed so far. }
                        total: { type: integer }
                  stuckAfterMinutes: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
  /ops/teams/{teamId}/imports/{importId}/clear:
    parameters:
      - { $ref: "#/components/parameters/opsTeamId" }
      - { name: importId, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" } }
    post:
      tags: [ops]
      operationId: opsClearStuckImport
      summary: Take a stuck import out of the stuck-import check. Audited as `ops.import.clear`.
      description: |
        Only the job's index keys change: the job and its staged plan stay,
        so a retry of it still works until it expires. Refused for an import
        that isn't stuck (finished, still within the hour, cleared already or
        unknown).
      security: [{ opsCognito: [] }]
      parameters: [{ $ref: "#/components/parameters/opsIdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500, description: Why, on one line. The team's owners see it. }
      responses:
        "200":
          description: Cleared, now or by an earlier request with the same Idempotency-Key (`replayed`).
          content:
            application/json:
              schema:
                type: object
                required: [eventId, replayed]
                properties:
                  eventId: { type: string, description: The audit event. }
                  replayed: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/OperatorsOnly" }
        "409":
          description: "`aborted`, nothing changed: the import isn't stuck, or the Idempotency-Key was used for a different request."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /auth/session:
    post:
      tags: [auth]
      operationId: createSession
      summary: Exchange the Managed Login authorization code for tokens.
      description: |
        Call after Managed Login redirects back with `?code=`, with
        `credentials: "include"`. Redeems the code and PKCE verifier at
        Cognito's `/oauth2/token`, returns the access and ID tokens (keep them
        in memory only), and sets the refresh token as an HttpOnly cookie.
      security: []
      parameters: [{ $ref: "#/components/parameters/origin" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, codeVerifier, redirectUri]
              properties:
                code: { type: string, pattern: "^[A-Za-z0-9_-]{1,2048}$" }
                codeVerifier: { type: string, pattern: "^[A-Za-z0-9._~-]{43,128}$" }
                redirectUri: { type: string, description: The redirect URI used to sign in; must be on the calling origin. }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/SignInAgain" }
        "403": { $ref: "#/components/responses/OriginRefused" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: New access and ID tokens from the refresh-token cookie.
      description: |
        Call with `credentials: "include"` before the access token expires
        (60 minutes) or after a 401. Refresh-token rotation is on: the cookie
        is replaced with the new refresh token on every call. A 401 clears the
        cookie; show sign-in.
      security: [{ refreshCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/origin" }]
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "401": { $ref: "#/components/responses/SignInAgain" }
        "403": { $ref: "#/components/responses/OriginRefused" }
        "502": { $ref: "#/components/responses/Unavailable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      summary: Revoke the refresh token and clear the cookie.
      description: Always clears the cookie, even if revoking fails. Then send the user to Managed Login's `/logout`.
      security: [{ refreshCookie: [] }, {}]
      parameters: [{ $ref: "#/components/parameters/origin" }]
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearCookie" }
        "403": { $ref: "#/components/responses/OriginRefused" }
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Cognito **access token** from the environment's user pool and the web
        app client (`Authorization: Bearer <token>`). API Gateway checks the
        signature, expiry, issuer and client; the Lambda also requires
        `token_use: access` and an unexpired `exp`. ID tokens are refused.
    opsCognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Cognito **access token** from the operator user pool
        (`supply-checkout-<env>-ops`, password plus TOTP required) and its
        `ops` client, for a user in the `operators` group. 15 minutes. The
        ops function also calls Cognito on every request, so a revoked token
        or a removed or disabled operator is refused at once.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-sc_refresh
      description: |
        The refresh token, set by `/auth/session` and `/auth/refresh`:
        `HttpOnly; Secure; SameSite=Strict; Path=/auth; Max-Age=2592000`.
        Requests must also carry an allowed `Origin` (CSRF protection).
  parameters:
    opsTeamId:
      name: teamId
      in: path
      required: true
      description: Any team's ID.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    opsIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: New for each change. A retry with the same key and body replays the first result for 24 hours; the same key with another body is 409.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
    teamId:
      name: teamId
      in: path
      required: true
      description: The team. The caller must be a member; the body can't name a team.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    inviteId:
      name: inviteId
      in: path
      required: true
      description: "The invite's `id` in the team's invite list."
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    productKey:
      name: key
      in: path
      required: true
      description: The product key, percent-encoded. Up to 256 characters, no `/` or control characters, and not `__proto__`.
      schema: { type: string, minLength: 1, maxLength: 256 }
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    sheetId:
      name: sheetId
      in: path
      required: true
      deprecated: true
      description: The old name of `projectId`.
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$" }
    limit:
      name: limit
      in: query
      description: At most this many documents. A page also stops at about 1 MB.
      schema: { type: integer, minimum: 1, maximum: 1000 }
    cursor:
      name: cursor
      in: query
      description: The `cursor` from the previous page, as is. Only valid for the same listing.
      schema: { type: string }
    expectedVersion:
      name: expectedVersion
      in: query
      required: true
      description: Delete only if the document is at this version (0 = only if it doesn't exist, so deleting a missing document succeeds).
      schema: { type: integer, minimum: 0 }
    origin:
      name: Origin
      in: header
      required: true
      description: Must be one of the environment's app origins (`https://app.<env domain>`, and `http://localhost:5173` outside prod).
      schema: { type: string }
  headers:
    SetCookie:
      description: The rotated refresh token.
      schema: { type: string, example: "__Secure-sc_refresh=<token>; Path=/auth; Max-Age=2592000; HttpOnly; Secure; SameSite=Strict" }
    ClearCookie:
      description: Clears the refresh-token cookie.
      schema: { type: string, example: "__Secure-sc_refresh=; Path=/auth; Max-Age=0; HttpOnly; Secure; SameSite=Strict" }
  requestBodies:
    Write:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, expectedVersion]
            properties:
              data:
                type: object
                description: The document (PUT) or the patch to merge (PATCH).
              expectedVersion:
                type: integer
                minimum: 0
                description: Write only if the document is at this version (0 = doesn't exist).
          examples:
            checkout:
              summary: Check out 3 of an item (PATCH a project)
              value: { data: { items: { "0123": { code: "0123", name: "Nitrile gloves", price: 12.5, out: 3, returned: 0 } } }, expectedVersion: 7 }
    Checkout:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, productKey, quantity]
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              productKey: { type: string, minLength: 1, maxLength: 256, description: "The line's key: the product key (or a new key for a one-off item)." }
              quantity: { $ref: "#/components/schemas/Quantity" }
              name: { type: string, minLength: 1, maxLength: 200, description: Only for an item that isn't in inventory. Trimmed. }
              price: { allOf: [{ $ref: "#/components/schemas/Money" }], description: Only for an item that isn't in inventory. The client price per each. }
              code: { type: string, maxLength: 256, description: Only for an item that isn't in inventory. Its barcode, or empty. }
              cost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: Only for an item that isn't in inventory. What the business paid per each. }
          examples:
            inventoryItem:
              summary: Check out 3 of an item in inventory
              value: { operationId: "3b241101-e2bb-4255-8caf-4136c566a962", productKey: "0123", quantity: 3 }
            oneOff:
              summary: Check out an item that isn't in inventory
              value: { operationId: "a8098c1a-f86e-41b1-8e42-6b87b5ab13a6", productKey: "k-7f3a", quantity: 1, name: "Leftover storage bins", price: 4 }
    QuickTake:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, productKey, quantity]
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              productKey: { type: string, minLength: 1, maxLength: 256, description: "The line's key: the product key (or a new key for a one-off item)." }
              quantity: { $ref: "#/components/schemas/Quantity" }
              name: { type: string, minLength: 1, maxLength: 200, description: Only for an item that isn't in inventory. Trimmed. }
              price: { allOf: [{ $ref: "#/components/schemas/Money" }], description: Only for an item that isn't in inventory. }
              code: { type: string, maxLength: 256, description: Only for an item that isn't in inventory. }
              cost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: Only for an item that isn't in inventory. }
              date: { type: string, description: "`YYYY-MM-DD`, the person's local date: a new General Use project's date. Default: today in UTC." }
          examples:
            take:
              summary: Take 2 of an item for no job
              value: { operationId: "0f8fad5b-d9cb-469f-a165-70867728950e", productKey: "0123", quantity: 2, date: "2026-10-01" }
    Move:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, productKey]
            description: "`toProjectId`, or its old name `toSheetId`, is required; both may be sent only with the same value."
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              productKey: { type: string, minLength: 1, maxLength: 256, description: The General Use project's line. }
              toProjectId: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$", description: The open client project it goes to. }
              toSheetId: { type: string, pattern: "^[A-Za-z0-9_-]{1,128}$", deprecated: true, description: The old name of `toProjectId`. }
    AddLines:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, lines]
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              lines:
                type: array
                minItems: 1
                maxItems: 40
                items:
                  type: object
                  additionalProperties: false
                  required: [productKey, quantity, name]
                  properties:
                    productKey: { type: string, minLength: 1, maxLength: 256, description: "The product's key (never one ending in `:bought`). Each product at most once." }
                    quantity: { $ref: "#/components/schemas/Quantity" }
                    name: { type: string, minLength: 1, maxLength: 200, description: For a new line. Trimmed. }
                    price: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "For a new line. The client price per each: required for a supply; for company equipment only with `priceSet: \"manual\"`." }
                    code: { type: string, maxLength: 256, description: For a new line. Its barcode, or empty. }
                    cost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "For a new line. What the business paid per each (the receipt price): required for company equipment priced by the markup." }
                    priceSet: { const: manual, description: "Company equipment only: `price` is one the reviewer typed, not the markup price." }
          examples:
            receipt:
              summary: Two receipt lines for a client
              value: { operationId: "6ec0bd7f-11c0-43da-975e-2a8ad9ebae0b", lines: [{ productKey: "0123", quantity: 4, name: "Nitrile gloves", price: 12.5, code: "0123", cost: 9.99 }, { productKey: "k-7f3a", quantity: 2, name: "Painter's tape", price: 6.25, cost: 6.25 }] }
    Lost:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, productKey, quantity]
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              productKey: { type: string, minLength: 1, maxLength: 256, description: The equipment line's key. }
              quantity: { $ref: "#/components/schemas/Quantity" }
              charge: { allOf: [{ $ref: "#/components/schemas/Money" }], description: Dollars to charge the client for the lot (not each). Client projects only. }
    Return:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [operationId, productKey, quantity]
            properties:
              operationId: { $ref: "#/components/schemas/OperationId" }
              productKey: { type: string, minLength: 1, maxLength: 256, description: The line's key. }
              quantity: { $ref: "#/components/schemas/Quantity" }
    StockAdjust:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: false
                required: [operationId, reason, quantity, unitCost]
                properties:
                  operationId: { $ref: "#/components/schemas/OperationId" }
                  reason: { const: receipt }
                  quantity: { $ref: "#/components/schemas/Quantity" }
                  unitCost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: What was paid per each, before tax. }
              - type: object
                additionalProperties: false
                required: [operationId, reason, count]
                properties:
                  operationId: { $ref: "#/components/schemas/OperationId" }
                  reason: { const: count }
                  count: { type: integer, minimum: 0, maximum: 1000000, description: The number counted in storage. }
                  expectedStock: { $ref: "#/components/schemas/ExpectedStock" }
              - type: object
                additionalProperties: false
                required: [operationId, reason]
                properties:
                  operationId: { $ref: "#/components/schemas/OperationId" }
                  reason: { const: uncount }
                  expectedStock: { $ref: "#/components/schemas/ExpectedStock" }
  schemas:
    ExpectedStock:
      type: [integer, "null"]
      minimum: 0
      maximum: 1000000
      description: Optional. The stock the person saw when they started, or `null` for an item that wasn't counted. The command is refused (409 `stock_changed`) when the stock is something else now.
    AuditRecord:
      description: |
        What an operator action changed, before and after, by action:
        `ops.comp.set` and `ops.comp.end` record a `CompRecord`, or a
        `CompMonthsRecord` after a comp made with `months` (or null for no
        comp), `ops.import.clear` an `ImportClearRecord`, `ops.team.reopen`
        a `ReopenRecord` before (null after), and `ops.teams.list` (in the
        operators' audit only) a `TeamsListRecord` after (null before), and
        `ops.receipts.usage` (in the operators' audit only) a
        `ReceiptUsageRecord` after (null before), and `ops.comp.discount`
        (what the billing worker did about a comp's Stripe discount) a
        `CompDiscountBefore` before and a `CompDiscountRecord` after.
        `ops.team.read` records neither.
      oneOf:
        - { $ref: "#/components/schemas/CompRecord" }
        - { $ref: "#/components/schemas/CompMonthsRecord" }
        - { $ref: "#/components/schemas/CompDiscountBefore" }
        - { $ref: "#/components/schemas/CompDiscountRecord" }
        - { $ref: "#/components/schemas/ImportClearRecord" }
        - { $ref: "#/components/schemas/ReopenRecord" }
        - { $ref: "#/components/schemas/TeamsListRecord" }
        - { $ref: "#/components/schemas/ReceiptUsageRecord" }
        - type: "null"
    CompRecord:
      type: object
      description: A comp as the audit records it.
      required: [plan, seats, until, reason]
      additionalProperties: false
      properties:
        plan: { type: string }
        seats: { type: [integer, "null"] }
        until: { type: [string, "null"], format: date-time }
        reason: { type: [string, "null"] }
    CompMonthsRecord:
      type: object
      description: A comp made with `months`, as the audit records it.
      required: [plan, seats, until, reason, months]
      additionalProperties: false
      properties:
        plan: { type: string }
        seats: { type: [integer, "null"] }
        until: { type: string, format: date-time }
        reason: { type: string }
        months: { type: integer, minimum: 1, maximum: 12 }
    CompDiscountBefore:
      type: object
      description: Our comp coupon on the team's Stripe subscription before the billing worker acted, if any.
      required: [coupon]
      additionalProperties: false
      properties:
        coupon: { type: [string, "null"] }
    CompDiscountRecord:
      type: object
      description: What the billing worker did about a comp's Stripe discount, and the coupon and comp end it applied, if any.
      required: [outcome, coupon, until, subscriptionId]
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [applied, removed, in_sync, none, not_monthly, under_a_month, no_subscription, not_ours, team_closed] }
        coupon: { type: [string, "null"] }
        until: { type: [string, "null"], format: date-time }
        subscriptionId: { type: [string, "null"] }
    ImportClearRecord:
      type: object
      description: A stuck import, before (`committing` true) and after (false) an operator took it out of the "Imports stuck" check.
      required: [importId, committing]
      additionalProperties: false
      properties:
        importId: { type: string }
        committing: { type: boolean }
    ReopenRecord:
      type: object
      description: A closed team's closure, before an operator reopened it.
      required: [closedAt, purgeAfter]
      additionalProperties: false
      properties:
        closedAt: { type: string, format: date-time }
        purgeAfter: { type: string, format: date-time, description: When it would have been deleted. }
    TeamsListRecord:
      type: object
      description: A team list or search, and the teams it returned.
      required: [q, cursor, teams]
      additionalProperties: false
      properties:
        q: { type: [string, "null"] }
        cursor: { type: [string, "null"] }
        teams: { type: array, items: { type: string } }
    ReceiptUsageRecord:
      type: object
      description: A month's receipt ranking, and the teams it returned.
      required: [month, teams]
      additionalProperties: false
      properties:
        month: { type: string }
        teams: { type: array, items: { type: string } }
    OpsStripeDetail:
      oneOf:
        - type: "null"
          description: The team has no Stripe customer.
        - type: object
          additionalProperties: false
          required: [error]
          properties:
            error: { const: unavailable, description: "No ops key stored yet, or Stripe errored or was slow." }
        - type: object
          additionalProperties: false
          required: [customerId, subscription, subscriptionCount, invoices, hasMoreInvoices]
          properties:
            customerId: { type: string }
            subscription:
              description: The current subscription (the newest not canceled or expired), else the newest; null if the customer has none.
              oneOf:
                - type: "null"
                - type: object
                  additionalProperties: false
                  required: [id, status, lookupKey, plan, interval, seats, currentPeriodEnd, cancelAtPeriodEnd, cancelAt, trialEnd, createdAt, discountCount, compDiscountUntil]
                  properties:
                    id: { type: string }
                    status: { type: string, description: "Stripe's subscription status." }
                    lookupKey: { type: [string, "null"], description: The first item's price lookup key. }
                    plan: { type: [string, "null"], description: "The catalog's plan for that lookup key, or null for a price it doesn't know." }
                    interval: { type: [string, "null"] }
                    seats: { type: integer, description: The quantity across the items. }
                    currentPeriodEnd: { type: [string, "null"], format: date-time }
                    cancelAtPeriodEnd: { type: boolean }
                    cancelAt: { type: [string, "null"], format: date-time }
                    trialEnd: { type: [string, "null"], format: date-time }
                    createdAt: { type: [string, "null"], format: date-time }
                    discountCount: { type: integer, minimum: 0, description: How many discounts the subscription has. }
                    compDiscountUntil: { type: [string, "null"], format: date-time, description: "The end of the comp whose 100%-off discount is on it (its metadata stamp), while that's to come and it has a discount; otherwise null." }
            subscriptionCount: { type: integer, description: "Subscriptions among the customer's latest 10: more than one is worth a look." }
            invoices:
              type: array
              description: The latest 12, newest first, without drafts.
              items:
                type: object
                additionalProperties: false
                required: [id, number, status, createdAt, currency, total, amountDue, amountPaid]
                properties:
                  id: { type: string }
                  number: { type: [string, "null"] }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }
                  currency: { type: string }
                  total: { type: integer, description: In the currency's minor units. }
                  amountDue: { type: integer }
                  amountPaid: { type: integer }
            hasMoreInvoices: { type: boolean }
    OpsTeam:
      type: object
      required: [id, name, plan, seats, status, ownerCount, createdAt, version, comp, owners]
      properties:
        id: { type: string }
        name: { type: string }
        plan: { type: string, description: From billing (ADR 0009). }
        seats: { type: integer }
        status: { type: string, description: The Stripe subscription status. }
        trialEndsAt: { type: [string, "null"], format: date-time }
        ownerCount: { type: integer }
        closedAt: { type: [string, "null"], format: date-time, description: "Set once an owner closed the team: it's read-only until it's deleted, and comps are refused (409). A deleted team drops out of the list." }
        createdAt: { type: string, format: date-time }
        stripeCustomerId: { type: [string, "null"] }
        version: { type: integer, description: Send as `expectedVersion` to change the comp. }
        comp:
          oneOf:
            - type: object
              properties:
                plan: { type: string }
                seats: { type: [integer, "null"] }
                until: { type: string, format: date-time }
                reason: { type: string }
                by: { type: string, description: The operator's `sub`. }
                at: { type: string, format: date-time }
                live: { type: boolean, description: "`until` is still ahead." }
            - type: "null"
        owners:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              email: { type: [string, "null"] }
              joinedAt: { type: [string, "null"], format: date-time }
    OperationId:
      type: string
      format: uuid
      description: |
        A UUID the client makes for one intended action (`crypto.randomUUID()`)
        and sends again, unchanged, on every retry of it. The same ID returns
        the first result for 7 days; the same ID with a different request is
        `bad_request`.
    Quantity:
      type: integer
      minimum: 1
      maximum: 1000000
      description: Whole eaches (ADR 0014).
    Money:
      type: number
      minimum: 0
      maximum: 1000000
      multipleOf: 0.01
      description: US dollars before tax, at most two decimals (ADR 0014). More decimals are refused, not rounded.
    LineSnapshot:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        price: { type: number, description: Absent for company equipment, which has no client price. }
        kind: { const: equipment, description: Company equipment (ADR 0017). Absent for a supply. }
        cost: { type: number, description: Absent when unknown. }
    CommandResult:
      type: object
      description: What the command did. Kept with the operation ID, and returned unchanged on a retry.
      required: [operationId, command, reason, productKey, stockDelta, userId, at]
      properties:
        operationId: { type: string, format: uuid }
        command: { type: string, enum: [checkout, quickTake, return, lost, move, stockAdjust] }
        reason: { type: string, enum: [checkout, return, lost, move, receipt, count, uncount] }
        productKey: { type: string }
        projectId: { type: string, description: "Checkout, return and lost; for a quick take the General Use project it went on, and for a move the General Use project it came off." }
        toProjectId: { type: string, description: "Move only: the client project the line went to." }
        projectCreated: { type: boolean, description: "Quick take only: this take started the General Use project." }
        sheetId: { type: string, deprecated: true, description: "The old name of `projectId`, with the same value." }
        toSheetId: { type: string, deprecated: true, description: "The old name of `toProjectId`, with the same value." }
        sheetCreated: { type: boolean, deprecated: true, description: "The old name of `projectCreated`, with the same value." }
        returned: { type: integer, description: "Move only: the line's `returned` that moved." }
        lost: { type: integer, description: "Move only: the line's `lost` that moved." }
        quantity: { type: integer, description: "Eaches checked out, returned or received; for a move, the line's `out`. Absent for a count or uncount." }
        count: { type: integer, description: The level counted (count only). }
        stockDelta: { type: integer, description: "The change to the product's `stock`: 0 when it doesn't track stock or isn't in inventory. For an uncount, minus the stock it had." }
        lineCreated: { type: boolean, description: "Checkout and quick take; for a move, whether the client project had no line for the item." }
        snapshot: { $ref: "#/components/schemas/LineSnapshot" }
        unitCost: { type: number, description: Receipt only. }
        charge: { type: number, description: "Lost only: what the client is charged for it, if anything." }
        userId: { type: string }
        at: { type: string, format: date-time }
    Movement:
      type: object
      description: One change to an item's stock. The sum of an item's `delta`s is its change in stock.
      required: [type, productKey, reason, delta, tracked, operationId, userId, at]
      properties:
        type: { const: movement }
        productKey: { type: string }
        reason: { type: string, enum: [checkout, return, receipt, count, uncount, import, delete, lost, move], description: "`import`: a CSV import set the stock (`count`). `uncount`: someone stopped counting the item, removing its stock, recorded as taking it to 0. `delete`: the item was deleted, taking its stock to 0. `lost`: company equipment lost or broken on a job (`delta` 0: stock went down at checkout). `move`: a whole line moved from the General Use project (`fromProjectId`) to a client project (`projectId`), with its `quantity` (out), `returned` and `lost` (`delta` 0: stock went down at the quick take)." }
        delta: { type: integer, description: The change to `stock`. 0 when the item didn't track stock. }
        tracked: { type: boolean, description: Whether the item tracked stock. }
        quantity: { type: integer }
        count: { type: integer }
        projectId: { type: string, description: "The project; for a move, the client project the line went to." }
        fromProjectId: { type: string, description: "Move only: the General Use project the line came off." }
        sheetId: { type: string, deprecated: true, description: "The old name of `projectId`, with the same value." }
        fromSheetId: { type: string, deprecated: true, description: "The old name of `fromProjectId`, with the same value." }
        returned: { type: integer, description: "Move only: the line's `returned` that moved." }
        lost: { type: integer, description: "Move only: the line's `lost` that moved." }
        unitCost: { type: number }
        charge: { type: number, description: "Lost only: what the client is charged for it, if anything." }
        operationId: { type: string, format: uuid }
        userId: { type: string }
        at: { type: string, format: date-time }
    ImportRow:
      type: object
      required: [line, name, barcode, price, key, action, changes]
      properties:
        line: { type: integer, description: The row's line in the file. }
        name: { type: string, maxLength: 200 }
        brand: { type: string, maxLength: 100, description: Absent when the row's brand cell is blank or there's no brand column, which keeps the item's brand. }
        barcode: { type: string, maxLength: 256 }
        price: { $ref: "#/components/schemas/Money" }
        cost: { $ref: "#/components/schemas/Money" }
        stock: { type: integer, minimum: 0, maximum: 1000000 }
        packSize: { type: integer, minimum: 1, maximum: 10000 }
        key: { type: string, description: The product key the row writes. }
        action: { type: string, enum: [create, update, unchanged] }
        changes: { type: array, items: { type: string, enum: [code, name, brand, kind, price, cost, packSize, stock] } }
    ImportRowError:
      type: object
      required: [line, message]
      properties:
        line: { type: integer }
        column: { type: string, description: The column as the file names it, when the problem is in one cell. }
        message: { type: string }
    ImportSummary:
      type: object
      required: [rows, created, updated, unchanged]
      properties:
        rows: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
    Document:
      type: object
      required: [id, version, data]
      properties:
        id: { type: string, description: The product key or project ID. }
        version: { type: integer, minimum: 1 }
        data:
          type: object
          description: The document's fields as the app wrote them. `Product` and `Project` list the fields the app writes.
    Product:
      type: object
      description: "`data` of a document in `products` (src/main.js). Other fields are kept as written."
      properties:
        code: { type: string, maxLength: 256, description: The barcode; empty for an item without one. }
        name: { type: string }
        brand: { type: string, maxLength: 100, description: "Optional (supply-checkout-005.9): who makes the item. Stored trimmed, no control characters; absent for none. A write with a blank or `null` brand removes it." }
        price: { type: number, minimum: 0, description: The client price each. Absent for company equipment. }
        cost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "What the business paid per each; for company equipment, its value each." }
        kind: { type: string, enum: [supply, equipment], description: "A supply (used up and charged; the default when absent) or company equipment (reused, and not charged), ADR 0017." }
        stock: { type: number, description: "The count in storage; absent if not counted. Read-only here: only the stock commands and the CSV import change it, and a write may only repeat the stored value." }
        updatedAt: { type: string, format: date-time }
    Project:
      type: object
      description: "`data` of a document in `projects` (src/main.js). Other fields are kept as written."
      properties:
        client: { type: string }
        date: { type: string, description: "`YYYY-MM-DD`; projects without a valid date sort last when newest-first." }
        createdBy: { type: [string, "null"], description: "The creator's user ID, or `null` without a signed-in user." }
        createdByName: { type: string, description: "Who prepared the project, when `createdBy` is `null`." }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [open, closed], description: "Closing is refused (409 `equipment_out`) while company equipment is still out. Reopening a General Use project is refused (409 `adhoc_open`) while another General Use project is open." }
        closedAt: { type: string, format: date-time }
        kind: { const: adhoc, description: "The team's General Use project (ADR 0017), `adhoc-<n>`, made only by the quick take; a document write can't add, change or remove it, or create a project whose ID starts `adhoc-`. Absent for a client project." }
        items:
          type: object
          description: The project's lines, keyed by product key.
          additionalProperties: { $ref: "#/components/schemas/ProjectLine" }
        source:
          type: object
          description: The receipt the project was made from, when receipt scanning named a store.
          properties:
            store: { type: string }
            receiptDate: { type: string }
    ProjectLine:
      type: object
      description: One line of a project. A PATCH may send only some fields (a return sends `returned`); the rest, including `code`, are kept.
      properties:
        code: { type: string, maxLength: 256, description: 'The barcode, exported as "Barcode" in the project CSV; empty for an item without one.' }
        name: { type: string }
        price: { type: number, minimum: 0 }
        cost: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "What the business paid per each (ADR 0014): copied from the product at the line's first checkout, or the receipt's cost each for a line a receipt adds. Absent when unknown; any other value is refused with 400 `bad_request`." }
        out: { type: integer, minimum: 0, description: How many were taken. }
        returned: { type: integer, minimum: 0, description: "How many came back. With `lost`, never more than `out`." }
        kind: { const: equipment, description: "Company equipment (ADR 0017), from the product at the line's first checkout; it can't change. Not charged." }
        lost: { type: integer, minimum: 0, description: Equipment only. How many were lost or broken. }
        lostCharge: { allOf: [{ $ref: "#/components/schemas/Money" }], description: Equipment on a client project only. What the client is charged for what was lost or broken. }
        takenBy: { type: string, maxLength: 200, description: "Who took equipment last. Set by the checkout command; a write may only repeat it." }
        takenAt: { type: string, format: date-time, description: "When equipment was last taken. Set by the checkout command." }
        purchased: { const: true, description: "Company equipment bought for the client, on the line `<productKey>:bought` (ADR 0017, section 2a). Only the receipt's lines command adds one." }
        priceSet: { type: string, enum: [markup, manual], description: "Lines bought for the client: whether the server worked the price out from the markup, or someone typed it. Set by the server." }
        priceSetBy: { type: string, description: "A typed price (`priceSet: manual`): who typed it. Set by the server; a write may only repeat it." }
        priceSetAt: { type: string, format: date-time, description: "A typed price: when. Set by the server." }
    Team:
      type: object
      required: [id, name, role, plan, status, trialEndsAt, homeRegion, closedAt, deletesAt]
      properties:
        id: { type: string, description: "The `teamId` for the data routes." }
        name: { type: string }
        role: { type: string, enum: [owner, contributor, viewer], description: The caller's role in this team. }
        plan: { type: string, description: "`trial` until the team subscribes." }
        status: { type: string, description: "Subscription status (ADR 0009), from Stripe once the team subscribes: `trialing`, `active`, `past_due`, `canceled`, `unpaid`, `incomplete`, `incomplete_expired`." }
        trialEndsAt: { type: [string, "null"], format: date-time, description: When the free trial ends. }
        homeRegion: { type: string, description: The region the team was created in (ADR 0010). }
        closedAt: { type: [string, "null"], format: date-time, description: "When an owner closed the team (`closeTeam`), or `null`. A closed team is read-only." }
        deletesAt: { type: [string, "null"], format: date-time, description: "When a closed team's data is deleted: 30 days after `closedAt`. `null` for a team that isn't closed." }
        reopenBy: { type: [string, "null"], format: date-time, description: "Until when owners can reopen a closed team: an hour before `deletesAt` (after that, reopening is 409 `team_deleting`). `null` for a team that isn't closed." }
        comp:
          description: A live comp from Supply Checkout support (ADR 0015). While it's set, the team is active on `plan` until `until`, whatever `status` says.
          oneOf:
            - type: object
              required: [plan, until]
              properties:
                plan: { type: string }
                until: { type: string, format: date-time }
            - type: "null"
        members: { type: [integer, "null"], description: "How many members the team has, or `null` for a team from before the count (the members list has them)." }
        memberCap: { type: integer, description: "How many members the team may have. Pending invites count against it when inviting (429 `team_full`)." }
        subscriptionEnded: { type: boolean, description: "The team is read-only for billing, and no comp keeps it going (`readOnlyReason` says why): a write is 403 `permission_denied` with `reason: \"subscription_ended\"`. Members can still read and export it, and leave; owners can remove members, and subscribe (`createCheckout`) or pay (`createPortalSession`), but not invite or change roles." }
        readOnlyReason: { type: [string, "null"], enum: [trial_ended, subscription_ended, payment_overdue, null], description: "Why the team is read-only (`subscriptionEnded`): `trial_ended`, the free trial ended without a subscription; `subscription_ended`, the subscription ended (`canceled` or `incomplete_expired`); `payment_overdue`, the subscription is `past_due` and its 7-day grace period is over, or `unpaid` (an owner pays in the Customer Portal). `null` when it isn't." }
        readOnlyDeletesAt: { type: [string, "null"], format: date-time, description: "For `trial_ended` and `subscription_ended`: when the team is closed and its data deleted unless an owner subscribes first: 30 days after it became read-only, rounded up to 12:00 UTC the next day, when that date has ended in every time zone. The job may close it later (at least 7 days after its warning email), never earlier. Show `readOnlyLastDay`, not this time's local date. `null` otherwise (a team with a comp is never deleted for this)." }
        readOnlyLastDay: { type: [string, "null"], format: date, description: "The date to show for `readOnlyDeletesAt` (YYYY-MM-DD): the last day the team is kept, the date the emails state. `null` when `readOnlyDeletesAt` is, or once it has passed (the team is then closed as soon as the 7 days after its warning email are up)." }
        paymentGraceEndsAt: { type: [string, "null"], format: date-time, description: "A `past_due` team still in its 7-day grace period: when it becomes read-only unless the payment goes through. `null` otherwise." }
        billingAccount: { type: boolean, description: "The team has a Stripe customer (made by its first checkout), so its owners can open the Customer Portal (`createPortalSession`)." }
        cancelsAt: { type: [string, "null"], format: date-time, description: "When a subscription that was canceled (in the Customer Portal) ends: the end of its current period. It keeps working until then. `null` when it renews, or has already ended." }
    Invite:
      type: object
      description: A pending invite, to show. Accepting it needs the token from the invite email.
      required: [id, teamName, role, expiresAt]
      properties:
        id: { type: string, description: "The invite's ID, as in the emailed link." }
        teamName: { type: string }
        role: { type: string, enum: [owner, contributor, viewer], description: The role the caller joins with. }
        expiresAt: { type: string, format: date-time }
    TeamInvite:
      type: object
      description: An invite as the team's owners see it. Never the token.
      required: [id, email, role, createdAt, expiresAt, inviteStatus, failureReason, failedAt]
      properties:
        id: { type: string }
        email: { type: string, description: The invited address, normalized (lowercase). }
        role: { type: string, enum: [owner, contributor, viewer] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        inviteStatus:
          type: string
          enum: [pending, failed, expired]
          description: "`failed`: its email couldn't be delivered (`failureReason`). `expired`: past `expiresAt`. Otherwise `pending`."
        failureReason:
          type: [string, "null"]
          enum: [bounced, complained, not_sent, null]
          description: "`bounced` (the address doesn't take mail), `complained` (the recipient marked it as spam) or `not_sent` (SES wouldn't send it). SES suppresses a bounced or complaining address, so a re-send to it fails too."
        failedAt: { type: [string, "null"], format: date-time }
    Member:
      type: object
      required: [userId, email, role, joinedAt]
      properties:
        userId: { type: string }
        email: { type: [string, "null"], description: The address they joined with. }
        role: { type: string, enum: [owner, contributor, viewer] }
        joinedAt: { type: [string, "null"], format: date-time }
    ReceiptUsage:
      type: object
      description: The team's receipt reads against its allowance (provisional until pricing is decided).
      required: [period, month, used, limit, remaining]
      properties:
        period:
          type: string
          enum: [month, trial]
          description: "`month`: a paying or comped team's allowance for each UTC month. `trial`: a trial team's allowance for its whole trial."
        month: { type: string, description: The UTC month counted, YYYY-MM. }
        used: { type: integer, minimum: 0, description: "Receipts read in the period (this month, or the whole trial), a read's own included." }
        limit: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthenticated, permission_denied, invalid_argument, not_found, aborted, quota_exceeded, unavailable, internal]
            message: { type: string }
            reason:
              type: string
              enum: [view_only, owners_only, not_member, last_owner, team_full, team_closed, team_deleting, stock_changed, equipment_out, adhoc_open, code_mismatch, code_expired, already_verified, email_in_use, email_changed, already_subscribed, subscription_ended, no_billing_account, mfa_required, mfa_sign_in_again, password_invalid, password_mismatch, federated_sign_in, signout_failed, image_rejected, receipt_limit, rate_limited, model_busy, model_timeout, invalid_output]
              description: |
                Why, where the code alone doesn't say. `view_only`: a viewer
                tried to write. `owners_only`: the route is for owners.
                `not_member`: the caller isn't in the path's team (or it
                doesn't exist). `last_owner`: the change would leave the team
                without an owner. `team_full`: the team is at its member cap.
                `team_closed`: the team was closed and is read-only.
                `team_deleting`: the closed team is about to be deleted and
                can't be reopened.
                `stock_changed`: a stock count sent with `expectedStock` found
                the stock already changed from it (the message says what it is now).
                `equipment_out`: Finished Return (closing a project) while company
                equipment is still out on it; each piece must be back, lost or
                broken first (ADR 0017).
                `adhoc_open`: reopening a finished General Use project while another
                General Use project is open; a team has at most one open (ADR 0017).
                Verifying an email address: `code_mismatch` (the code isn't
                right), `code_expired`, `already_verified`, `email_in_use`
                (another account has the address), and `email_changed` (the
                address changed while the code was checked).
                `already_subscribed`: the team has a Stripe subscription that
                hasn't ended, so it can't start another checkout.
                `subscription_ended`: the team is read-only for billing (its
                trial or subscription ended, or a payment is overdue past the
                grace period; the team's `readOnlyReason` says which) until an
                owner subscribes, or pays.
                `no_billing_account`: the team has no Stripe customer yet, so
                there's no Customer Portal to open.
                `mfa_required`: a billing route for an owner without two-step
                sign-in on. `mfa_sign_in_again`: a billing route for an owner
                whose session (the token's `auth_time`) began before two-step
                sign-in was turned on: sign in again, with the password and the
                code. Setting it up: `password_invalid` (the password
                policy), `password_mismatch` (the current password is wrong
                or missing), `federated_sign_in` (a Google or Apple user,
                who has nothing to set up), and `signout_failed` (it's on, but
                the other sessions haven't ended: `signOutEverywhere`).
                Reading a receipt: `image_rejected` (the photo can't be used),
                `receipt_limit` (the team's receipts are used up: this month's,
                or its trial's), `rate_limited` (the caller read too many in a
                short time; see Retry-After), `model_busy` (the model service is throttling),
                `model_timeout` (no answer in time) and `invalid_output` (the
                model's reply couldn't be used).
  responses:
    OperatorsOnly:
      description: "`permission_denied`: the token's user isn't in the `operators` group (now, according to Cognito)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CompDone:
      description: Done, now or by an earlier request with the same Idempotency-Key (`replayed`).
      content:
        application/json:
          schema:
            type: object
            required: [eventId, replayed, comp, version]
            properties:
              eventId: { type: string, description: The audit event. }
              replayed: { type: boolean }
              comp:
                oneOf:
                  - type: object
                    required: [plan, until]
                    properties:
                      plan: { type: string }
                      seats: { type: integer }
                      until: { type: string, format: date-time }
                  - type: "null"
              version: { type: integer, description: The team's version after the change. }
              months: { type: integer, description: "For a comp made with `months`: how many." }
              stripeDiscount:
                type: string
                enum: [queued, no_stripe_customer, not_queued]
                description: >-
                  Whether the billing worker was asked to make the team's Stripe
                  subscription's comp discount match the comp: `queued`, or the
                  team has no Stripe customer, or it couldn't be queued now (the
                  nightly reconciliation will).
    CompConflict:
      description: "`aborted`, nothing changed: the team isn't at `expectedVersion` (read it again), it's closed, it has no comp to end, or the Idempotency-Key was used for a different request."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Document:
      description: The document after the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Document" }
    DocumentList:
      description: A page of documents.
      content:
        application/json:
          schema:
            type: object
            required: [documents]
            properties:
              documents:
                type: array
                items: { $ref: "#/components/schemas/Document" }
              cursor: { type: string, description: Absent on the last page. }
    CommandDone:
      description: |
        Done, now or by an earlier request with the same `operationId`
        (`replayed: true`, and nothing changed this time). `result` is what
        the first run did; `project` (also as `sheet`, its old name, through
        the rename's window) and `product` are the documents as they are now,
        read after the command.
      content:
        application/json:
          schema:
            type: object
            required: [operationId, replayed, result, product]
            properties:
              operationId: { type: string, format: uuid }
              replayed: { type: boolean }
              result: { $ref: "#/components/schemas/CommandResult" }
              project:
                description: Every command on a project, and a quick take. `null` if the project has since been deleted.
                oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }]
              sheet:
                deprecated: true
                description: The old name of `project`, the same document.
                oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }]
              product:
                description: "`null` for an item that isn't in inventory."
                oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }]
    LineMoved:
      description: |
        Done, now or by an earlier request with the same `operationId`
        (`replayed: true`, and nothing changed this time). `result` is what
        the first run did; `project` (the General Use project) and
        `toProject` (the client project) are as they are now, read after the
        command (`null` if since deleted), and through the rename's window
        also under their old names, `sheet` and `toSheet`. No item changed, so
        `product` is `null`.
      content:
        application/json:
          schema:
            type: object
            required: [operationId, replayed, result, project, toProject, sheet, toSheet, product]
            properties:
              operationId: { type: string, format: uuid }
              replayed: { type: boolean }
              result: { $ref: "#/components/schemas/CommandResult" }
              project: { oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }] }
              toProject: { oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }] }
              sheet: { deprecated: true, description: "The old name of `project`.", oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }] }
              toSheet: { deprecated: true, description: "The old name of `toProject`.", oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }] }
              product: { type: "null" }
    LinesAdded:
      description: |
        Done, now or by an earlier request with the same `operationId`
        (`replayed: true`, and nothing changed this time). `result` is what
        the first run did; `project` (also as `sheet`, its old name, through
        the rename's window) is as it is now, read after the command.
      content:
        application/json:
          schema:
            type: object
            required: [operationId, replayed, result, project, sheet]
            properties:
              operationId: { type: string, format: uuid }
              replayed: { type: boolean }
              result:
                type: object
                required: [operationId, command, projectId, sheetId, lines, userId, at]
                properties:
                  operationId: { type: string, format: uuid }
                  command: { const: addLines }
                  projectId: { type: string }
                  sheetId: { type: string, deprecated: true, description: "The old name of `projectId`, with the same value." }
                  lines:
                    type: array
                    items:
                      type: object
                      required: [productKey, quantity, lineCreated]
                      properties:
                        productKey: { type: string }
                        quantity: { type: integer }
                        lineCreated: { type: boolean, description: "False: it added to a line already on the project." }
                        lineKey: { type: string, description: "Company equipment bought for the client: the line it went on, `<productKey>:bought`." }
                        purchased: { const: true }
                  userId: { type: string }
                  at: { type: string, format: date-time }
              project:
                description: "`null` if the project has since been deleted."
                oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }]
              sheet:
                deprecated: true
                description: The old name of `project`, the same document.
                oneOf: [{ $ref: "#/components/schemas/Document" }, { type: "null" }]
    CommandRefused:
      description: |
        `bad_request`, nothing changed: a malformed body, a quantity that isn't
        a whole number from 1, money with more than two decimals, a return of
        more than is left out, an item that isn't on the project, an item not in
        inventory checked out without `name` and `price`, or an `operationId`
        already used for a different request. Don't retry it unchanged.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CommandConflict:
      description: |
        `aborted`, nothing changed: the project is closed, the line or item
        kept changing under every retry, or (reason `stock_changed`) a stock
        count's `expectedStock` isn't the stock any more. The message says
        which. A retry with the same `operationId` is safe.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Tokens:
      description: Tokens for the app to keep in memory. The refresh token is only in the cookie.
      headers:
        Set-Cookie: { $ref: "#/components/headers/SetCookie" }
      content:
        application/json:
          schema:
            type: object
            required: [accessToken, idToken, expiresIn]
            properties:
              accessToken: { type: string }
              idToken: { type: string }
              expiresIn: { type: integer, description: Seconds. }
    TeamCreated:
      description: The team. 201 when this request made it, 200 when an earlier request with the same `Idempotency-Key` did.
      content:
        application/json:
          schema:
            type: object
            required: [team]
            properties:
              team: { $ref: "#/components/schemas/Team" }
    TooManyInvites:
      description: "`quota_exceeded`: the team has sent 50 invites today (UTC) or 3 to this address, the caller has sent 3 to this address from all their teams, or the address has been sent 15 from all teams. Try again tomorrow. With `reason: \"team_full\"` (new invites only): the team's members and live invites fill its member cap."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyTeams:
      description: "`quota_exceeded`: the caller has created 5 teams today (UTC), or is already in 20 teams (the message says which)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Settings:
      description: The team's settings as the caller may see them.
      content:
        application/json:
          schema:
            type: object
            required: [settings]
            properties:
              version: { type: integer, minimum: 0, description: "Owners only: 0 until an owner first saves the settings." }
              settings:
                type: object
                description: Every setting for an owner; empty for anyone else.
                properties:
                  equipmentMarkup: { type: number, minimum: 0, maximum: 1000, description: "Percent added to the receipt price of company equipment bought for a client. Owners only." }
    BadRequest:
      description: "`bad_request`: malformed JSON, ID, field, query or cursor."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: "`unauthenticated`: no token, an expired or ID token. (API Gateway's own 401 has the body `{\"message\":\"Unauthorized\"}`.)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: |
        `permission_denied`, with a `reason`: `not_member` (not a member of
        this team, the same answer if the team doesn't exist), `view_only` (a
        viewer tried to write; the web runtime hands this to the app as
        `invalid_argument`, view-only access), `owners_only` (a contributor
        or viewer on an owners-only route) or `team_closed` (a write to a
        team an owner closed, which is read-only). Nothing was read or written.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NoSuchMember:
      description: "`not_found`: the user isn't a member of this team."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    MemberConflict:
      description: |
        `aborted`. With `reason: "last_owner"`: the team would be left without
        an owner, and nothing changed. Without a reason: the member, or the
        caller's own role, changed meanwhile; reload and try again.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: "`not_found`: no such document (for a command: no such project, or for a stock adjustment no such item)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: "`aborted`: the document isn't at `expectedVersion` (for a command: it changed during every retry)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooLarge:
      description: "`quota_exceeded`: the document would be over 350,000 bytes (or the body over 1 MB)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SignInAgain:
      description: "`unauthenticated`: no cookie, or Cognito refused the code or refresh token. Clears the cookie."
      headers:
        Set-Cookie: { $ref: "#/components/headers/ClearCookie" }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    OriginRefused:
      description: "`permission_denied`: missing or unknown `Origin`."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: "`internal`: Cognito didn't answer, or answered without tokens. Try again."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
