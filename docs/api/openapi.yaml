  /teams/{teamId}/receipts/read:
    parameters: [{ $ref: "#/components/parameters/teamId" }]
    post:
      tags: [receipts]
      operationId: readReceipt
      summary: Read a receipt photo's line items for the review screen. Saves nothing.
      description: |
        The body is the photo, a JPEG or PNG as base64, at most 1,500,000
        bytes decoded (the app shrinks photos to about 600 KB first). Its bytes
        must be the type it says. The server builds the prompt itself: the
        fixed instructions, then up to 500 of the team's inventory items for
        matching, then the photo. Nothing else from the request reaches the
        model, and the photo is never stored or logged.

        Each read counts first against the caller's own rate limit, from all
        their teams together: 10 a minute, 60 an hour and 200 a UTC day
        (`RECEIPT_RATE_LIMITS`), and for a trial team's read at most 30 trial
        reads a UTC day from all their trial teams
        (`RECEIPT_TRIAL_READS_PER_USER_PER_DAY`); past any, 429 `rate_limited` with
        Retry-After, the seconds until the window ends. Then against the
        team's allowance (provisional until pricing is decided): 200 a UTC
        month while it pays or has a live comp
        (`RECEIPTS_PER_TEAM_PER_MONTH`), and 25 in all for a trial
        (`RECEIPTS_PER_TRIAL`), which doesn't reset each month; past it, 429
        `receipt_limit`. Both are counted before the model is called, so a
        read that then fails still counts, unless the model service refused
        it with a throttle (`model_busy`) or a 503, which gives the team's
        read back. A trial team's reads also count in its month, so a team
        that subscribes mid-month has them counted against that month's 200. Attempts always count against the rate limit.
        A closed team, or one whose subscription ended, can't read receipts.
        Contributors and owners only.

        The reply's lines are checked on the server whatever the model sent:
        a line without a name is dropped, a quantity that isn't a positive
        number becomes 1, prices and totals that aren't amounts of 0 or more
        become 0 (prices) or null, and `match` is the key of the team's
        product the line is, or null. No lines means the photo wasn't a
        readable receipt. The model has 25 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              additionalProperties: false
              properties:
                image:
                  type: object
                  required: [mediaType, data]
                  additionalProperties: false
                  properties:
                    mediaType: { type: string, enum: [image/jpeg, image/png] }
                    data: { type: string, contentEncoding: base64, description: The photo's bytes. }
      responses:
        "200":
          description: The lines read, and the team's receipts read against its allowance.
          content:
            application/json:
              schema:
                type: object
                required: [store, date, items, subtotal, tax, total, usage]
                properties:
                  store: { type: [string, "null"] }
                  date: { type: [string, "null"], format: date }
                  items:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      required: [raw, name, qty, price, match]
                      properties:
                        raw: { type: string, description: The line as printed, or empty. }
                        name: { type: string, description: A readable product name. }
                        qty: { type: number, exclusiveMinimum: 0 }
                        price: { type: number, minimum: 0, description: One unit's price after discounts. }
                        match: { type: [string, "null"], description: The key of the team's product this line is. }
                  subtotal: { type: [number, "null"] }
                  tax: { type: [number, "null"] }
                  total: { type: [number, "null"] }
                  usage: { $ref: "#/components/schemas/ReceiptUsage" }
        "400":
          description: "`bad_request`: with `reason: \"image_rejected\"`, the photo isn't a JPEG or PNG in base64 matching its type, or the model service couldn't use it; otherwise malformed JSON or an unexpected field."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: "`quota_exceeded`: the photo is over 1,500,000 bytes (`reason: \"image_rejected\"`), or the body is too large."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`quota_exceeded`: with `reason: \"receipt_limit\"`, the team has read all its receipts (this month's, or its trial's); with `reason: \"rate_limited\"`, the caller has read too many receipts in a short time (Retry-After says how many seconds until they can again); with `reason: \"model_busy\"`, the model service is throttling (try again in a minute)."
          headers:
            Retry-After:
              description: "With `rate_limited`: the seconds until the caller's full rate window ends."
              schema: { type: integer, minimum: 1 }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: "`internal`: something failed on our side before the model was called."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "502":
          description: "`internal` with `reason: \"invalid_output\"`: the model's reply was refused, cut short or not the expected shape. Try again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "`unavailable`: the model service failed. Try again in a few minutes."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504":
          description: "`unavailable` with `reason: \"model_timeout\"`: the model didn't answer within 25 seconds."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
