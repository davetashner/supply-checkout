name: Deploy

# Deploys a release to prod (ADR 0012; supply-checkout-pbp.26, pbp.27 and pbp.28). The release workflow
# starts it once the release's full check suite has passed; the owner can also start it by hand
# for a tag (Actions, Deploy, Run workflow, from main), for example to deploy an older release
# again. It runs only from main: a run dispatched on a tag would use that tag's own copy of this
# file, which could leave out the checks below, so every job refuses any other ref.
# docs/releases.md ("Deploying a release") has the whole flow.
#
# Only workflow_dispatch starts it. A release that release-please creates with GITHUB_TOKEN
# triggers no `release` or tag `push` workflow, so the release workflow dispatches this one.
# Never add pull_request_target or workflow_run here: they can run for a fork's pull request
# with this repository's context, and a production job would hand it the deploy role.
#
# Jobs, plan first and apply after, so the approver reads the diff before approving a change:
#   release         no credentials: both deploy environments are locked down
#                   (scripts/check-environments.mjs), and the tag is a published release whose
#                   commit is on main and passed CI in a real run on main
#   trust           no environment: the deploy role must REFUSE this job (docs/infrastructure.md)
#   build           no environment, no id-token, no AWS: builds the web app and the demo once
#                   from the release commit and keeps them as the run's artifact, with a hash
#   synth           no environment, no id-token, no AWS: synthesizes the stacks from the release
#                   commit, with and without the backup copy, and keeps both assemblies as the
#                   run's artifact, the account ID swapped for a placeholder
#                   (scripts/assembly-pack.sh) and the whole encrypted (scripts/assembly-seal.mjs),
#                   with their hashes inside
#   plan            `production` (approval 1): deploys nothing and runs no release code (only
#                   main's tooling and main's locked CDK CLI, on the synth job's files as data);
#                   signs in, drops to CDK's read-only lookup role, picks and unpacks the synth
#                   job's assembly, checks its hash, posts each group's diff to the job summary,
#                   and fails if the stateful stacks' diff replaces or deletes what holds data
#                   (scripts/check-replacements.mjs) unless allowed
#   apply-stateful  `production-stateful` (approval 2), only if the stateful stacks differ:
#                   synthesizes again, refuses a template hash that isn't the plan's, checks the
#                   diff again, deploys them
#   apply           `production` (approval 3), after apply-stateful succeeded or was skipped:
#                   same hash check, deploys the stateless stacks (web, api, realtime,
#                   observability) if they differ, then publishes the build job's web app and
#                   demo as app-<tag> and demo-<tag> with the web publisher role, checks the
#                   live router and the live site (scripts/check-web.mjs), and rolls both
#                   channels back to what was live before if any of that fails
#   journeys        after apply succeeded: calls ./.github/workflows/journeys.yml, which walks the
#                   customer journeys against prod as test accounts (supply-checkout-o60.6) in the
#                   journey tests' own environment, which only that file names
#                   (scripts/check-workflow-environments.mjs). A failure fails the deploy. Skipped
#                   until the owner switches the journey tests on (JOURNEYS_ENABLED, docs/releases.md)
#   verdict         no environment, no AWS, contents: write: notes the journey tests' result on the
#                   GitHub Release, and marks a failed release as a pre-release, which the release
#                   job refuses to deploy again unless the run says allow-bad-release
#
# Release code and the production OIDC token (supply-checkout-pbp.39): no job that runs the
# release commit's code (npm ci, the CDK synth, the web build) can request the production OIDC
# token before an apply approval. build and synth run it with no environment and no id-token
# permission, and hand over only files (artifacts, by ID) and outputs that must look like a hash or
# an ID. plan, which can request the token, checks out nothing from the release commit and runs
# only main's scripts and main's locked CDK CLI, which reads the assembly as data (cdk diff
# --method template runs no app and builds no assets). Blanking ACTIONS_ID_TOKEN_REQUEST_* for one
# step wouldn't do: a step can reach the later ones through $GITHUB_ENV, $GITHUB_PATH, BASH_ENV or
# a process left running. Only apply-stateful and apply (approvals 2 and 3) run release code with
# the deploy role, which deploying it needs anyway. scripts/check-deploy-workflow.mjs keeps it so.
#
# No AWS credentials exist before a job's sign-in step, and those jobs run only code from a
# release commit on main; the deploy tooling (scripts/) comes from main's own commit, so an older
# release deploys with today's checks. Every third-party action is pinned by commit SHA. The
# deploy role's ARN is a secret (AWS_DEPLOY_ROLE_ARN: an environment secret, or the repository's,
# which the trust and synth jobs use), so neither it nor the account ID reaches the public log,
# and every diff has its account IDs scrubbed (scripts/scrub-account-ids.sed). The uploaded
# assembly has the account ID swapped for a placeholder and is encrypted with the repository
# secret DEPLOY_ASSEMBLY_KEY (artifacts of a public repository are public, and its asset hashes
# were computed over templates that named the account); plan opens it and puts the account back,
# and each apply job synthesizes again from the same commit and must reach the plan's hash. No
# raw template hash goes into a job output, a step's env or with, or the log: GitHub prints a
# step's env in its header and masks only secrets, and the source is public and the synth
# deterministic, so anyone could brute-force the 12-digit account from one. synth seals its
# hashes into the artifact, and plan hands the apply jobs only HMAC-SHA256(DEPLOY_ASSEMBLY_KEY,
# hash) (assembly-seal.mjs hmac). scripts/check-deploy-workflow.mjs keeps it so.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (vX.Y.Z); its commit must be on main and have passed CI
        required: true
        type: string
      dry-run:
        description: Plan only (sign in, synthesize, show the diffs), deploy nothing
        type: boolean
        default: false
      allow-replacement:
        description: A planned migration - deploy the stateful stacks even if they replace or delete what holds data
        type: boolean
        default: false
      allow-bad-release:
        description: Deploy a release the journey tests marked as a pre-release (to redeploy after fixing the tests themselves)
        type: boolean
        default: false

permissions: {}

# One deploy at a time, and never cancel one that has started: a deploy cut off halfway leaves
# CloudFormation to roll back. A run that's waiting here replaces an older waiting one. Dry runs
# change nothing, so they have their own group: one can't replace a release deploy that's
# waiting for approval. So a dry run can also run while a deploy is waiting or running; its diff
# may then fail or show changes that are mid-deploy, which is harmless (run it again after).
concurrency:
  group: ${{ inputs.dry-run && 'deploy-production-dry-run' || 'deploy-production' }}
  cancel-in-progress: false

defaults:
  run:
    # -eo pipefail
    shell: bash

jobs:
  release:
    name: Check the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      region: ${{ steps.check.outputs.region }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch and tag, to find the tag and check it's on main
          fetch-depth: 0
          persist-credentials: false
      # GitHub creates an environment with no protection the first time a job names one that
      # doesn't exist, and the deploy role trusts both of these. So before any job here names
      # one (dry runs too): both must exist, main only, with required reviewers and no admin
      # bypass. --journeys checks the journey tests' environment too (main only, no admin
      # bypass), which the journeys role trusts, on every deploy, without this file naming it:
      # once the journey tests are switched on it must exist; until then, if it exists it must
      # be locked down. This job has no AWS credentials.
      - name: Check the deploy environments are locked down
        env:
          GH_TOKEN: ${{ github.token }}
          JOURNEYS_ENABLED: ${{ vars.JOURNEYS_ENABLED }}
        run: |
          journeys=if-present
          if [[ "$JOURNEYS_ENABLED" == true ]]; then journeys=required; fi
          node scripts/check-environments.mjs --repo "$GITHUB_REPOSITORY" --journeys "$journeys"
      - name: Check the tag
        id: check
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          ALLOW_BAD_RELEASE: ${{ inputs.allow-bad-release }}
        run: |
          # The jobs' `if` already skip any other ref; the production environment allows only main
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error::Run the deploy from main, not $REF"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must look like v1.2.3"
            exit 1
          fi
          if ! sha="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")"; then
            echo "::error::No tag $TAG"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
            echo "::error::$TAG ($sha) isn't on main: only releases from main deploy"
            exit 1
          fi
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != false ]]; then
            echo "::error::$TAG has no published GitHub Release"
            exit 1
          fi
          # A release whose journey tests failed in prod is marked as a pre-release (the verdict
          # job): not deployed again by accident. docs/releases.md, "When the journey tests fail"
          if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" != false ]]; then
            if [[ "$ALLOW_BAD_RELEASE" != true ]]; then
              echo "::error::$TAG is a pre-release: its journey tests failed in prod (see its release notes). Deploy it only to redeploy after fixing the tests themselves, with allow-bad-release checked."
              exit 1
            fi
            echo "::warning::allow-bad-release is on: deploying $TAG, a pre-release (its journey tests failed in prod)"
            echo "> **allow-bad-release is on**: $TAG is a pre-release, marked when its journey tests failed in prod." >> "$GITHUB_STEP_SUMMARY"
          fi
          # CI passed on this commit in a real run on main, not just a check run with the right
          # name (any workflow with checks: write could post one): a ci.yml run for the push to
          # main that succeeded, or a release.yml run for that push whose "checks / CI passed"
          # job succeeded (the release workflow starts this deploy while it's still running).
          runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=100" \
            --jq '.workflow_runs[] | [.id, .path, .event, .head_branch, .head_repository.full_name, (.conclusion // "none")] | @tsv')"
          passed=""
          while IFS=$'\t' read -r id workflow event branch repository conclusion; do
            [[ "$event" == push && "$branch" == main && "$repository" == "$GITHUB_REPOSITORY" ]] || continue
            if [[ "$workflow" == .github/workflows/ci.yml && "$conclusion" == success ]]; then
              passed="CI run $id"; break
            fi
            if [[ "$workflow" == .github/workflows/release.yml ]] && [[ -n "$(gh api --paginate \
                "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq '.jobs[] | select(.name == "checks / CI passed" and .conclusion == "success") | .id')" ]]; then
              passed="release run $id"; break
            fi
          done <<< "$runs"
          if [[ -z "$passed" ]]; then
            echo "::error::$TAG ($sha) has no successful CI run on main: deploy only what CI passed"
            exit 1
          fi
          echo "CI passed: $passed"
          region="$(node scripts/deploy-stacks.mjs region)"
          echo "Deploying $TAG ($sha) to $region"
          {
            echo "tag=$TAG"
            echo "sha=$sha"
            echo "region=$region"
          } >> "$GITHUB_OUTPUT"

  trust:
    # The negative half of the dry check in docs/infrastructure.md (step 3): a job outside the
    # production environment gets a different OIDC subject, and the role must refuse it. It
    # needs the role's ARN as a repository secret (AWS_DEPLOY_ROLE_ARN, the same value as the
    # production environment's), since environment secrets reach only that environment's jobs.
    name: The deploy role refuses jobs outside production
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Try to assume the deploy role without the production environment
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          DRY_RUN: ${{ inputs.dry-run }}
          AWS_REGION: ${{ needs.release.outputs.region }}
        run: |
          if [[ -z "$ROLE_ARN" ]]; then
            message="Set the repository secret AWS_DEPLOY_ROLE_ARN (the deploy role's ARN) to check the role refuses jobs outside production"
            # A dry run is the trust check, so it can't skip it
            if [[ "$DRY_RUN" == true ]]; then echo "::error::$message"; exit 1; fi
            echo "::warning::$message"
            echo "Trust check skipped: no repository secret AWS_DEPLOY_ROLE_ARN" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/supply-checkout-prod-github-deploy$ ]]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN isn't the prod deploy role's ARN"
            exit 1
          fi
          echo "::add-mask::${BASH_REMATCH[1]}"
          token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          echo "::add-mask::$token"
          # Never printed: if the call succeeded, its output would hold credentials
          if out="$(aws sts assume-role-with-web-identity --no-cli-pager --role-arn "$ROLE_ARN" \
              --role-session-name "trust-check-$GITHUB_RUN_ID" --web-identity-token "$token" \
              --duration-seconds 900 --query AssumedRoleUser.Arn --output text 2>&1)"; then
            echo "::error::The deploy role accepted a job outside the production environment. Its trust is too wide: stop deploying and fix it (docs/infrastructure.md, GitHub Actions deploy role)."
            exit 1
          fi
          if ! grep -q "Not authorized to perform sts:AssumeRoleWithWebIdentity" <<< "$out"; then
            echo "::error::Expected 'Not authorized to perform sts:AssumeRoleWithWebIdentity', got something else:"
            echo "$out"
            exit 1
          fi
          echo "Refused, as it must be: Not authorized to perform sts:AssumeRoleWithWebIdentity"
          echo "Trust check: the deploy role refuses a job outside the production environment" >> "$GITHUB_STEP_SUMMARY"

  build:
    # The web app and the demo (supply-checkout-pbp.28), built once from the release commit in
    # a job with no environment, no id-token permission and no AWS access, since the build runs
    # the release commit's vite config, plugins and dependencies. The apply job publishes exactly
    # these files, by this upload's ID and hash. They hold no configuration (publish-web writes
    # config.json when it publishes) and are public once live anyway.
    # CodeQL's untrusted-checkout and cache-poisoning queries flag a job like this. Here the
    # checkout is needs.release.outputs.sha, which the release job proved is a published release
    # on main that passed CI in a run on main (not pull request code), and the job restores and
    # saves no cache (setup-node without `cache`, no actions/cache).
    name: Build the web app and demo
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # The release's commit (not the tag name, so a tag moved since can't swap it)
      - &checkout-release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      # No dependency cache in a deploy job, not even the one setup-node turns on by itself when
      # package.json names a packageManager (scripts/check-deploy-workflow.mjs)
      - &setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:web
          npm run build:demo
      - name: Hash the build
        id: hash
        run: |
          hash="$(cd dist && find web demo -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "Web build hash: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      # Kept 30 days, longer than any approval wait (GitHub drops a waiting run after 30 days);
      # the apply job downloads it by this upload's ID, so a re-run never picks up another
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-build
          path: |
            dist/web
            dist/demo
          if-no-files-found: error
          retention-days: 30

  synth:
    # The CDK synth (supply-checkout-pbp.39): it runs the release commit's CDK app, its
    # dependencies and the Lambda bundling from backend/, so it runs here, with no environment, no
    # id-token permission and no AWS access, never in a job that can request the production OIDC
    # token. Twice, with and without the backup copy (-c backupCopy=false until the copy vault's
    # parameter exists, like scripts/deploy.sh), since only plan can read which applies. Both
    # assemblies go to the run's artifact, by this upload's ID, the account ID swapped for a
    # placeholder (scripts/assembly-pack.sh) and the whole encrypted with the repository secret
    # DEPLOY_ASSEMBLY_KEY (scripts/assembly-seal.mjs): artifacts of a public repository are
    # public, and the asset hashes inside were computed over templates that named the account, so
    # the account could be brute-forced from them. Each assembly's hash goes inside the sealed
    # file (expected-hash/), never into an output or the log, for the same reason, and plan
    # checks the one it uses against it. The CDK app needs the account
    # (the stacks name it, and an apply job's synth gets it from its credentials), so it gets it
    # from the repository secret AWS_DEPLOY_ROLE_ARN, which the trust job uses too: the account ID
    # isn't secret from the release commit, which deploys into it.
    # CodeQL's untrusted-checkout and cache-poisoning queries flag a job like this, as for build:
    # it checks out the commit the release job proved, and restores and saves no cache.
    name: Synthesize the stacks
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      ENV_NAME: prod
      AWS_REGION: ${{ needs.release.outputs.region }}
    steps:
      # Before any release code runs, so a missing key fails fast
      - &check-assembly-key
        name: Check the assembly key is set
        env:
          DEPLOY_ASSEMBLY_KEY: ${{ secrets.DEPLOY_ASSEMBLY_KEY }}
        run: |
          if (( ${#DEPLOY_ASSEMBLY_KEY} < 32 )); then
            echo "::error::Set the repository secret DEPLOY_ASSEMBLY_KEY (openssl rand -base64 32 | gh secret set DEPLOY_ASSEMBLY_KEY): the synth job encrypts the assembly with it, and plan opens it"
            exit 1
          fi
      - *checkout-release
      # The deploy tooling from main's commit, this workflow's own
      - &checkout-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .deploy-tools
          sparse-checkout: scripts
          persist-credentials: false
      - *setup-node
      # Without install scripts (esbuild finds its binary in its platform package without its
      # postinstall). The synth bundles the Lambda code from backend/. Every cdk and tsx below is
      # the locked local copy, never something npx could fetch.
      - &install
        name: Install dependencies
        run: |
          (cd backend && npm ci --ignore-scripts --no-audit --no-fund)
          (cd infra && npm ci --ignore-scripts --no-audit --no-fund)
      # Into infra/cdk.out each time, the folder an apply job synthesizes into: the Lambda source
      # maps hold paths relative to it, so the hashes only match from the same place
      - name: Synthesize, with and without the backup copy
        id: synth
        working-directory: infra
        env:
          # A secret, so the ARN (and the account ID in it) is masked in the log
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          # No credentials here: don't wait on an instance metadata service for them
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/supply-checkout-prod-github-deploy$ ]]; then
            echo "::error::Set the repository secret AWS_DEPLOY_ROLE_ARN to the prod deploy role's ARN: the synth takes the account ID from it"
            exit 1
          fi
          account="${BASH_REMATCH[1]}"
          echo "::add-mask::$account"
          unset ROLE_ARN
          for copy in true false; do
            rm -rf cdk.out
            context=(-c "envName=$ENV_NAME")
            if [[ "$copy" == false ]]; then context+=(-c backupCopy=false); fi
            CDK_DEFAULT_ACCOUNT="$account" ./node_modules/.bin/cdk synth --app "./node_modules/.bin/tsx bin/app.ts" --quiet --no-notices "${context[@]}"
            # Sealed with the assembly, never an output or printed: it could be brute-forced back
            # to the account
            mkdir -p "$RUNNER_TEMP/assembly/expected-hash"
            bash ../.deploy-tools/scripts/assembly-hash.sh cdk.out > "$RUNNER_TEMP/assembly/expected-hash/backup-copy-$copy"
            bash ../.deploy-tools/scripts/assembly-pack.sh pack cdk.out "$RUNNER_TEMP/assembly/backup-copy-$copy" "$account"
          done
      # Both packed assemblies in one file, encrypted (AES-256-GCM, main's script), so the
      # artifact shows neither the account nor a hash computed over it, nor even the file names
      - name: Seal the assemblies
        env:
          DEPLOY_ASSEMBLY_KEY: ${{ secrets.DEPLOY_ASSEMBLY_KEY }}
        run: |
          mkdir "$RUNNER_TEMP/sealed"
          node .deploy-tools/scripts/assembly-seal.mjs seal "$RUNNER_TEMP/assembly" "$RUNNER_TEMP/sealed/cloud-assembly.sealed"
      # Kept 30 days, longer than any approval wait; plan downloads it by this upload's ID
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-assembly
          path: ${{ runner.temp }}/sealed/cloud-assembly.sealed
          if-no-files-found: error
          retention-days: 30

  plan:
    name: Plan (deploys nothing)
    needs: [release, trust, build, synth]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Waits for the owner's approval. This job can request the production OIDC token (id-token:
    # write) and so the deploy role, so it runs no code from the release commit
    # (supply-checkout-pbp.39): it checks out only main's tooling, installs main's locked CDK CLI,
    # and treats the synth and build jobs' artifacts and outputs as data. Approving it shows the
    # diff and deploys nothing. The production environment's rules (main only, required reviewer,
    # no admin bypass) are what give a job the OIDC subject the deploy role trusts.
    # scripts/check-deploy-workflow.mjs fails CI if this job checks out anything but main's commit.
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      hash-hmac: ${{ steps.unpack.outputs.hash-hmac }}
      copy: ${{ steps.backup.outputs.copy }}
      stateless-changed: ${{ steps.stateless.outputs.changed }}
      stateful-changed: ${{ steps.stateful.outputs.changed }}
    env:
      ENV_NAME: prod
      TAG: ${{ needs.release.outputs.tag }}
      AWS_REGION: ${{ needs.release.outputs.region }}
    steps:
      # main's tooling and main's infra/ (for its CDK CLI and cdk.json), nothing of the release's
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .deploy-tools
          sparse-checkout: |
            scripts
            infra
          persist-credentials: false
      - *setup-node
      # main's locked CDK CLI, before any credentials exist and without install scripts. Only its
      # cdk runs, on the synth job's assembly with --app <folder>, which runs no app.
      - name: Install main's CDK CLI
        working-directory: .deploy-tools/infra
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The synth and build jobs ran release code: take only real hashes and IDs from them, so
      # they can't put their own text into a command or the summary the approver reads. The
      # build's hash is of the public web build, so it may show; synth's hashes are sealed.
      - name: Check the synth and build jobs' outputs
        env:
          ASSEMBLY_ARTIFACT_ID: ${{ needs.synth.outputs.artifact-id }}
          BUILD_HASH: ${{ needs.build.outputs.hash }}
          BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          if [[ ! "$BUILD_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The build job's hash isn't one (a 64-character hex hash)"
            exit 1
          fi
          for id in "$ASSEMBLY_ARTIFACT_ID" "$BUILD_ARTIFACT_ID"; do
            if [[ ! "$id" =~ ^[0-9]+$ ]]; then
              echo "::error::A synth or build job's artifact ID isn't one (a number)"
              exit 1
            fi
          done
      - name: Download the synth job's assemblies
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.synth.outputs.artifact-id }}
          path: ${{ runner.temp }}/assembly
          merge-multiple: true
      # Before any credentials exist, with main's script: GCM's tag must check out (the right key,
      # every byte as sealed) before anything is read, and it takes only folders of plain files.
      # The hash check after the unpack is still what proves the assembly is the synth job's.
      - *check-assembly-key
      - name: Open the sealed assemblies
        env:
          DEPLOY_ASSEMBLY_KEY: ${{ secrets.DEPLOY_ASSEMBLY_KEY }}
        run: node .deploy-tools/scripts/assembly-seal.mjs open "$RUNNER_TEMP/assembly/cloud-assembly.sealed" "$RUNNER_TEMP/packed"
      - name: Sign in to AWS with the deploy role
        # Our own step, not aws-actions/configure-aws-credentials, which always logs the role's
        # unique ID (AROA…), which can be mapped to the account, in this public log
        # (scripts/assume-aws-role.sh, supply-checkout-o60.13). It masks the account ID first.
        env:
          # A secret, so the ARN (and the account ID in it) is masked in the log
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          SESSION_NAME: plan-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          # Only long enough to drop to the lookup role, which has its own session
          DURATION: "900"
        run: bash .deploy-tools/scripts/assume-aws-role.sh web-identity
      # The positive half of the trust check (docs/infrastructure.md step 3)
      - &prove
        name: Prove who this job is
        run: |
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          if [[ ! "$arn" =~ ^arn:aws:sts::[0-9]{12}:assumed-role/supply-checkout-${ENV_NAME}-github-deploy/ ]]; then
            echo "::error::Signed in as something other than the deploy role"
            exit 1
          fi
          echo "Signed in as the deploy role supply-checkout-${ENV_NAME}-github-deploy, in the $GITHUB_JOB job's environment"
      # From here on the job can only read: CDK's lookup role has ReadOnlyAccess (and no
      # kms:Decrypt). cdk diff --method template reads the deployed templates with it. The
      # bootstrap qualifier is main's (the account's bootstrap doesn't change with a release).
      - name: Find the lookup role
        id: lookup
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          qualifier="$(jq -r '.context["@aws-cdk/core:bootstrapQualifier"] // "hnb659fds"' .deploy-tools/infra/cdk.json)"
          echo "arn=arn:aws:iam::$account:role/cdk-$qualifier-lookup-role-$account-$AWS_REGION" >> "$GITHUB_OUTPUT"
          echo "qualifier=$qualifier" >> "$GITHUB_OUTPUT"
      - name: Drop to the read-only lookup role
        # With the deploy role's credentials (role chaining), no session tags, and as quiet
        env:
          ROLE_ARN: ${{ steps.lookup.outputs.arn }}
          SESSION_NAME: plan-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .deploy-tools/scripts/assume-aws-role.sh chain
      - name: Prove it's the lookup role
        run: |
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          if [[ ! "$arn" =~ ^arn:aws:sts::[0-9]{12}:assumed-role/cdk-[A-Za-z0-9_-]+-lookup-role-[0-9]{12}-[a-z0-9-]+/ ]]; then
            echo "::error::Still signed in as something other than the lookup role"
            exit 1
          fi
          echo "Now the read-only lookup role"
      # Like scripts/deploy.sh: -c backupCopy=false until the backup copy vault's parameter
      # exists (docs/backups.md). Any error but "not found" stops the plan. The apply jobs use
      # this answer, so they synthesize what the plan showed.
      - name: Check for the backup copy vault
        id: backup
        run: |
          if err="$(aws ssm get-parameter --name "/supply-checkout/$ENV_NAME/backup/copy-vault-arn" \
              --query Parameter.Name --output text 2>&1 >/dev/null)"; then
            echo "The backup copy vault exists: copies on"
            copy=true
          elif grep -q ParameterNotFound <<< "$err"; then
            echo "No backup copy vault yet: -c backupCopy=false"
            copy=false
          else
            echo "::error::Couldn't read the backup copy vault's parameter"
            echo "$err"
            exit 1
          fi
          echo "copy=$copy" >> "$GITHUB_OUTPUT"
      # The assembly for that answer, with this account's ID put back: byte for byte what the
      # synth job wrote, so it must reach the hash sealed with it, and each apply job's own synth
      # must reach it too. The hash is never printed or passed on raw: only its HMAC under
      # DEPLOY_ASSEMBLY_KEY goes to the apply jobs, since a raw one could be brute-forced back to
      # the account.
      - name: Unpack the assembly
        id: unpack
        env:
          COPY: ${{ steps.backup.outputs.copy }}
          QUALIFIER: ${{ steps.lookup.outputs.qualifier }}
          DEPLOY_ASSEMBLY_KEY: ${{ secrets.DEPLOY_ASSEMBLY_KEY }}
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          expected="$(cat "$RUNNER_TEMP/packed/expected-hash/backup-copy-$COPY")"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The sealed assembly has no hash for backupCopy=$COPY. Run the deploy again."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/plan"
          bash .deploy-tools/scripts/assembly-pack.sh unpack "$RUNNER_TEMP/packed/backup-copy-$COPY" "$RUNNER_TEMP/plan/cdk.out" "$account"
          # cdk.out isn't inert to the CLI: its manifest names the files cdk reads, the context
          # lookups it makes and the roles it assumes. Only files in the folder, no lookups (the
          # diff has --no-lookups too), and only this account's and region's stacks, each with its
          # own name and the CDK bootstrap's roles
          node .deploy-tools/scripts/check-assembly.mjs "$RUNNER_TEMP/plan/cdk.out" --account "$account" --region "$AWS_REGION" --qualifier "$QUALIFIER"
          hash="$(bash .deploy-tools/scripts/assembly-hash.sh "$RUNNER_TEMP/plan/cdk.out")"
          if [[ "$hash" != "$expected" ]]; then
            echo "::error::The unpacked assembly's hash isn't the synth job's. Run the deploy again."
            exit 1
          fi
          echo "The unpacked assembly's hash is the synth job's"
          hmac="$(node .deploy-tools/scripts/assembly-seal.mjs hmac <<< "$hash")"
          echo "hash-hmac=$hmac" >> "$GITHUB_OUTPUT"
      # From a folder with nothing but the assembly (no cdk.json, so no app or plugin of the
      # release's), with main's cdk
      - name: Diff the stateful stacks
        id: stateful
        env:
          CDK: ${{ github.workspace }}/.deploy-tools/infra/node_modules/.bin/cdk
        run: |
          cd "$RUNNER_TEMP/plan"
          bash "$GITHUB_WORKSPACE/.deploy-tools/scripts/deploy-diff.sh" stateful "Stateful stacks: diff for $TAG (approval 2, production-stateful)"
      - name: Diff the stateless stacks
        id: stateless
        env:
          CDK: ${{ github.workspace }}/.deploy-tools/infra/node_modules/.bin/cdk
        run: |
          cd "$RUNNER_TEMP/plan"
          bash "$GITHUB_WORKSPACE/.deploy-tools/scripts/deploy-diff.sh" stateless "Stateless stacks: diff for $TAG (approval 3, production)"
      - name: Check the stateful stacks replace or delete nothing that holds data
        env:
          ALLOW: ${{ inputs.allow-replacement }}
        run: |
          allow=()
          if [[ "$ALLOW" == true ]]; then
            allow=(--allow)
            echo "::warning::allow-replacement is on: the stateful stacks may replace or delete what holds data"
            echo "> **allow-replacement is on**: this run may replace or delete what holds data in the stateful stacks (a planned migration)." >> "$GITHUB_STEP_SUMMARY"
          fi
          set +e
          node .deploy-tools/scripts/check-replacements.mjs "$RUNNER_TEMP/diff-stateful.txt" "${allow[@]}" > "$RUNNER_TEMP/replacements.md"
          code=$?
          set -e
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/replacements.md"
          if ((code != 0)); then echo "::error::The stateful stacks' diff replaces or deletes what holds data (see the summary)"; fi
          exit "$code"
      - name: What's next
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          STATEFUL: ${{ steps.stateful.outputs.changed }}
          STATELESS: ${{ steps.stateless.outputs.changed }}
          BUILD_HASH: ${{ needs.build.outputs.hash }}
          BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          # The build job ran release code: take only a real hash and ID from it, so it can't put
          # its own text into the summary the approver reads
          if [[ ! "$BUILD_HASH" =~ ^[0-9a-f]{64}$ || ! "$BUILD_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The build job's hash or artifact ID isn't one (a 64-character hex hash and a number)"
            exit 1
          fi
          {
            echo "## Next"
            echo
            if [[ "$DRY_RUN" == true ]]; then echo "Dry run: nothing deploys."
            else
              if [[ "$STATEFUL" == true ]]; then echo "- Stateful stacks: approve **production-stateful** to deploy them."; else echo "- Stateful stacks: no differences, skipped."; fi
              if [[ "$STATELESS" == true ]]; then echo "- Stateless stacks: approve **production** to deploy them, then publish the web app."; else echo "- Stateless stacks: no differences. Approve **production** to publish the web app."; fi
              echo "- Web app and demo: publish \`app-$TAG\` and \`demo-$TAG\` (build \`$BUILD_HASH\`) and make them live."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  apply-stateful:
    name: Deploy the stateful stacks
    needs: [release, plan]
    if: github.ref == 'refs/heads/main' && !inputs.dry-run && needs.plan.outputs.stateful-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The second approval (supply-checkout-pbp.27): an environment of its own, which the deploy
    # role also trusts, with the same rules as production
    environment: production-stateful
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: prod
      TAG: ${{ needs.release.outputs.tag }}
      SHA: ${{ needs.release.outputs.sha }}
      AWS_REGION: ${{ needs.release.outputs.region }}
      BACKUP_COPY: ${{ needs.plan.outputs.copy }}
    steps:
      - *checkout-release
      - *checkout-tools
      - *setup-node
      - *install
      - &sign-in
        name: Sign in to AWS with the deploy role
        # Our own step, not aws-actions/configure-aws-credentials, which always logs the role's
        # unique ID (AROA…), which can be mapped to the account, in this public log
        # (scripts/assume-aws-role.sh, supply-checkout-o60.13). It masks the account ID first.
        env:
          # A secret, so the ARN (and the account ID in it) is masked in the log
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          SESSION_NAME: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          # A deploy can take a while; CDK renews its bootstrap role sessions from this one
          DURATION: "3600"
        run: bash .deploy-tools/scripts/assume-aws-role.sh web-identity
      - *prove
      # One synth per apply job, with the deploy role's credentials (which give the CDK app the
      # account): it must reach the plan's hash of the templates, asset manifests (the Lambda
      # code's hashes are in them) and manifest.json (assembly-hash.sh)
      - &synth
        name: Synthesize
        id: synth
        working-directory: infra
        run: |
          context=(-c "envName=$ENV_NAME")
          if [[ "${BACKUP_COPY:?}" == false ]]; then context+=(-c backupCopy=false); fi
          ./node_modules/.bin/cdk synth --app "./node_modules/.bin/tsx bin/app.ts" --quiet --no-notices "${context[@]}"
      # The plan passes on only the HMAC of its hash under DEPLOY_ASSEMBLY_KEY: this step hashes
      # its own synth and compares HMACs, and the raw hash never leaves the step
      - &check-plan-hash
        name: Check it's what the plan showed
        env:
          PLAN_HASH_HMAC: ${{ needs.plan.outputs.hash-hmac }}
          DEPLOY_ASSEMBLY_KEY: ${{ secrets.DEPLOY_ASSEMBLY_KEY }}
        run: |
          if [[ ! "$PLAN_HASH_HMAC" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The plan's hash HMAC isn't one (64 hex characters). Run the deploy again."
            exit 1
          fi
          mine="$(bash .deploy-tools/scripts/assembly-hash.sh infra/cdk.out | node .deploy-tools/scripts/assembly-seal.mjs hmac)"
          if [[ "$mine" != "$PLAN_HASH_HMAC" ]]; then
            echo "::error::This synth's template hash isn't the plan's: what would deploy isn't what was approved. Run the deploy again."
            exit 1
          fi
          echo "Same templates as the plan"
      # Again just before deploying, in case prod changed since the plan
      - name: Diff the stateful stacks again
        id: stateful
        working-directory: infra
        run: >-
          bash ../.deploy-tools/scripts/deploy-diff.sh stateful "Stateful stacks: diff before deploying $TAG"
      - name: Check again that they replace or delete nothing that holds data
        env:
          ALLOW: ${{ inputs.allow-replacement }}
        run: |
          allow=()
          if [[ "$ALLOW" == true ]]; then
            allow=(--allow)
            echo "::warning::allow-replacement is on: the stateful stacks may replace or delete what holds data"
            echo "> **allow-replacement is on**: approving this job may replace or delete what holds data in the stateful stacks (a planned migration)." >> "$GITHUB_STEP_SUMMARY"
          fi
          node .deploy-tools/scripts/check-replacements.mjs "$RUNNER_TEMP/diff-stateful.txt" "${allow[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Termination protection stays on (the stacks set it); CDK doesn't ask about IAM changes:
      # approving this job is the approval
      - name: Deploy
        working-directory: infra
        run: |
          patterns="$(node ../.deploy-tools/scripts/deploy-stacks.mjs stateful --env "$ENV_NAME")"
          read -r -a stacks <<< "$patterns"
          ./node_modules/.bin/cdk deploy --app cdk.out --exclusively --require-approval never --no-notices --progress events "${stacks[@]}"
          echo "Deployed $TAG ($SHA): ${stacks[*]}" >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Deploy the stateless stacks and publish the web app
    needs: [release, build, plan, apply-stateful]
    # After the stateful stacks (the API reads the table and user pool they change), or when
    # they had nothing to deploy. Every release, since the web app may change without the stacks.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry-run
      && needs.build.result == 'success' && needs.plan.result == 'success'
      && (needs.apply-stateful.result == 'success' || needs.apply-stateful.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: prod
      TAG: ${{ needs.release.outputs.tag }}
      SHA: ${{ needs.release.outputs.sha }}
      AWS_REGION: ${{ needs.release.outputs.region }}
      BACKUP_COPY: ${{ needs.plan.outputs.copy }}
    steps:
      - *checkout-release
      - *checkout-tools
      - *setup-node
      - *install
      - *sign-in
      - *prove
      - *synth
      - *check-plan-hash
      # The build job's web build, by its upload's ID, checked against that job's hash before
      # anything deploys, so a missing or changed build stops the job with nothing changed. That
      # job ran release code, so its outputs must look like a hash and an ID first.
      - name: Check the build job's outputs
        env:
          BUILD_HASH: ${{ needs.build.outputs.hash }}
          BUILD_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          if [[ ! "$BUILD_HASH" =~ ^[0-9a-f]{64}$ || ! "$BUILD_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The build job's hash or artifact ID isn't one (a 64-character hex hash and a number)"
            exit 1
          fi
      - name: Download the web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/web-build
          merge-multiple: true
      - name: Check it's the build the plan showed (the build job's)
        env:
          BUILD_HASH: ${{ needs.build.outputs.hash }}
        run: |
          if [[ ! -d "$RUNNER_TEMP/web-build/web" || ! -d "$RUNNER_TEMP/web-build/demo" ]]; then
            echo "::error::The build job's web build isn't there (artifacts are kept 30 days): run the deploy again"
            exit 1
          fi
          hash="$(cd "$RUNNER_TEMP/web-build" && find web demo -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          if [[ -z "$BUILD_HASH" || "$hash" != "$BUILD_HASH" ]]; then
            echo "::error::The web build ($hash) isn't the one the build job made ($BUILD_HASH)"
            exit 1
          fi
          echo "Same web build ($hash)"
      # CDK doesn't ask about IAM changes: approving this job, after reading the plan's diff,
      # is the approval
      - name: Deploy
        id: deploy
        if: needs.plan.outputs.stateless-changed == 'true'
        working-directory: infra
        run: |
          patterns="$(node ../.deploy-tools/scripts/deploy-stacks.mjs stateless --env "$ENV_NAME")"
          read -r -a stacks <<< "$patterns"
          ./node_modules/.bin/cdk deploy --app cdk.out --exclusively --require-approval never --no-notices --progress events "${stacks[@]}"
          echo "Deployed $TAG ($SHA): ${stacks[*]}" >> "$GITHUB_STEP_SUMMARY"

      # The web app and demo (supply-checkout-pbp.28), published with the web stack's publisher
      # role (infra/lib/web/publisher.ts): CDK's bootstrap roles can't upload a release or switch
      # the live version. The build was downloaded and checked before the deploy above.
      - name: Switch to the web publisher role
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          config="$RUNNER_TEMP/aws-publisher-config"
          printf '[profile web-publisher]\nrole_arn = arn:aws:iam::%s:role/supply-checkout-%s-web-publisher\ncredential_source = Environment\nregion = %s\n' \
            "$account" "$ENV_NAME" "$AWS_REGION" > "$config"
          echo "AWS_CONFIG_FILE=$config" >> "$GITHUB_ENV"
          arn="$(AWS_CONFIG_FILE="$config" aws sts get-caller-identity --profile web-publisher --query Arn --output text)"
          if [[ ! "$arn" =~ ^arn:aws:sts::[0-9]{12}:assumed-role/supply-checkout-${ENV_NAME}-web-publisher/ ]]; then
            echo "::error::Couldn't sign in as the web publisher role"
            exit 1
          fi
          echo "Signed in as supply-checkout-${ENV_NAME}-web-publisher"
      - name: Note what's live now
        id: before
        run: |
          for channel in app demo; do
            live="$(node .deploy-tools/scripts/publish-web.mjs live --channel "$channel" --env "$ENV_NAME" --profile web-publisher)"
            echo "Live before: $channel $live"
            echo "$channel=$live" >> "$GITHUB_OUTPUT"
          done
      # --reuse: a release deployed again (or an older one) is made live again, never re-uploaded
      - name: Publish the web app and demo
        id: publish
        run: |
          echo "started=true" >> "$GITHUB_OUTPUT"
          web="$RUNNER_TEMP/web-build"
          node .deploy-tools/scripts/publish-web.mjs publish --channel app --dir "$web/web" --version "app-$TAG" --reuse --env "$ENV_NAME" --profile web-publisher
          node .deploy-tools/scripts/publish-web.mjs publish --channel demo --dir "$web/demo" --version "demo-$TAG" --reuse --env "$ENV_NAME" --profile web-publisher
      - name: Check the live router
        id: router
        run: node .deploy-tools/scripts/publish-web.mjs check-router --env "$ENV_NAME" --profile web-publisher
      - name: Check the live site
        id: site
        run: |
          web="$RUNNER_TEMP/web-build"
          node .deploy-tools/scripts/check-web.mjs --env "$ENV_NAME" --app-index "$web/web/index.html" --demo-index "$web/demo/index.html"
          echo "Published and live: app-$TAG, demo-$TAG" >> "$GITHUB_STEP_SUMMARY"
      # Read-only checks of what the web checks don't cover (supply-checkout-pbp.30): the API
      # refuses an anonymous caller, live updates and sign-in answer. It makes no AWS calls. A
      # failure here is the stacks', not the web app's, so it doesn't roll the web publish back
      # (the new app is what matches the new API); the stacks are rolled back by hand
      # (docs/releases.md, "When a post-deploy check fails").
      - name: Post-deploy checks
        id: smoke
        run: node .deploy-tools/scripts/smoke-checks.mjs --env "$ENV_NAME" --summary "$GITHUB_STEP_SUMMARY"
      # Hook for the core journey canary (supply-checkout-pkt, after the pilot): run it once
      # here, whatever the hour, after the checks above (ADR 0012), and fail the deploy if it
      # fails. Starting a Synthetics canary needs synthetics:StartCanaryDryRun or StartCanary,
      # which no role the deploy role may assume has today; pkt adds it (docs/releases.md).
      # The publish, the router or the site check failed, or the run was cancelled or timed out,
      # after publishing started: put back what was live before. Not for the post-deploy
      # checks alone (above).
      - name: Roll the web app and demo back
        id: rollback
        if: (failure() || cancelled()) && steps.publish.outputs.started == 'true' && steps.smoke.outcome != 'failure'
        env:
          APP: ${{ steps.before.outputs.app }}
          DEMO: ${{ steps.before.outputs.demo }}
        run: |
          {
            echo "## Web rollback"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for pair in "app=$APP" "demo=$DEMO"; do
            channel="${pair%%=*}" version="${pair#*=}"
            if [[ -z "$version" || "$version" == none ]]; then
              echo "::warning::Nothing was live on $channel before, so it isn't rolled back"
              echo "- $channel: nothing was live before; left as it is" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if node .deploy-tools/scripts/publish-web.mjs activate --channel "$channel" --version "$version" --env "$ENV_NAME" --profile web-publisher; then
              echo "- $channel: rolled back to \`$version\`" >> "$GITHUB_STEP_SUMMARY"
            else
              status=1
              echo "::error::Couldn't roll $channel back to $version: do it by hand (docs/web-app.md)"
              echo "- $channel: **rollback to \`$version\` failed**" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          node .deploy-tools/scripts/publish-web.mjs check-router --env "$ENV_NAME" --profile web-publisher || status=1
          if ((status == 0)); then
            echo "::error::The web publish failed and was rolled back; the deploy failed"
          else
            echo "::error::The web publish failed and the rollback didn't finish: check the live versions by hand (docs/web-app.md)"
          fi
          exit 1
      # One place that says what happened, whatever happened
      - name: Deploy summary
        if: always()
        env:
          CHANGED: ${{ needs.plan.outputs.stateless-changed }}
          DEPLOY: ${{ steps.deploy.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          ROUTER: ${{ steps.router.outcome }}
          SITE: ${{ steps.site.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          ROLLBACK: ${{ steps.rollback.outcome }}
        run: |
          if [[ "$CHANGED" == true ]]; then stacks="${DEPLOY:-not run}"; else stacks="no changes"; fi
          {
            echo "## Deploy of $TAG"
            echo
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| Stateless stacks | $stacks |"
            echo "| Publish app-$TAG and demo-$TAG | ${PUBLISH:-not run} |"
            echo "| Live router | ${ROUTER:-not run} |"
            echo "| Live site | ${SITE:-not run} |"
            echo "| Post-deploy checks | ${SMOKE:-not run} |"
            echo "| Web rollback | ${ROLLBACK:-not run} |"
            echo
            if [[ "$SMOKE" == failure ]]; then
              echo "**The post-deploy checks failed.** The web app stays on app-$TAG. See docs/releases.md, \"When a post-deploy check fails\": if users are affected, deploy the previous tag again; otherwise fix forward."
            elif [[ "$ROLLBACK" == success ]]; then
              echo "**The web publish failed or was cancelled, and was rolled back** to what was live before."
            elif [[ "$ROLLBACK" == failure ]]; then
              echo "**The web publish failed or was cancelled, and its rollback didn't finish.** Check the live versions by hand (docs/web-app.md)."
            elif [[ "$SMOKE" == success ]]; then
              echo "Deployed, published and checked."
            else
              echo "**The deploy failed before publishing:** nothing on the web changed; see the failed step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The customer journeys against prod (supply-checkout-o60.6), after the stacks, the web publish
  # and the post-deploy checks all succeeded: there's no point signing in if the API doesn't
  # answer. No approval of its own: the owner approved apply, and it deploys nothing. Its job
  # names the journey tests' environment, whose secrets it gets there, so nothing is passed
  # down (no `secrets: inherit`). A failure fails this run.
  journeys:
    name: Journeys
    needs: [release, apply]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry-run
      && needs.apply.result == 'success'
    permissions:
      contents: read
      # journeys.yml's check job lists runs, so two journey runs never test prod at once
      actions: read
      id-token: write
    uses: ./.github/workflows/journeys.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  # Notes the journey tests' result on the GitHub Release: on a pass, "Journey tests passed in
  # prod"; on a failure, the failed steps, and the release becomes a pre-release, which the release
  # job above refuses unless allow-bad-release. When the suite didn't run or didn't finish (switched
  # off, set-up failure, cancelled), the release is left as it is. No AWS, no environment.
  verdict:
    name: Note the journey tests on the release
    needs: [release, journeys]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && !inputs.dry-run
      && (needs.journeys.result == 'success' || needs.journeys.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts
          persist-credentials: false
      - name: Note the result on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          SUITE: ${{ needs.journeys.outputs.suite }}
          FAILED: ${{ needs.journeys.outputs.failed }}
          CRITICAL: ${{ needs.journeys.outputs.critical }}
        run: >-
          node scripts/release-verdict.mjs --repo "$GITHUB_REPOSITORY" --tag "$TAG" --suite "$SUITE"
          --failed "$FAILED" --critical "$CRITICAL"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
