name: CI

# "CI passed" is the one required status check on main. It succeeds only when
# every job below succeeded or was skipped because it doesn't apply to the event.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # The release workflow starts CI on release-please's pull request, because
  # pull requests opened by GITHUB_TOKEN don't trigger workflows on their own.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash merges use the PR title as the commit message, and release-please
          # reads commit messages to pick the next version.
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'fix: …', 'feat: …' or 'feat(scope)!: …'. Got: $TITLE"
            exit 1
          fi

  lint:
    name: Lint and validate HTML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tarball" gitleaks
      - name: Scan every commit for secrets
        run: ./gitleaks git --redact --no-banner --verbose .
      - name: Scan files for AWS identifiers and email addresses
        run: node scripts/check-public-safety.mjs

  regions:
    name: No region names outside the config module
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ADR 0010: region names appear only in infra/lib/config.ts. Lambdas read
      # AWS_REGION and stacks take their region as a parameter.
      - run: node scripts/check-region-strings.mjs

  scripts:
    name: Shell scripts (shellcheck, land-pr tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck and jq come with the runner image
      - run: npm run test:scripts

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  test:
    name: Tests (${{ matrix.project }}, ${{ matrix.build }} build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # artifact: the single index.html published to claude.ai
        # web: the hashed static bundle for CloudFront, plus the demo build for
        # supplycheckout.com (tests/demo.spec.js runs with the web build)
        build: [artifact, web]
        project: [desktop-chrome, iphone-safari]
        include:
          # Coverage is measured in Chromium, the only browser that reports it
          - project: desktop-chrome
            browser: chromium
            coverage: "1"
          - project: iphone-safari
            browser: webkit
            coverage: ""
          # The other supported desktop browsers, against the web build only: the
          # artifact build runs on claude.ai, which Chrome and iPhone Safari cover
          - project: desktop-firefox
            build: web
            browser: firefox
            coverage: ""
          - project: desktop-safari
            build: web
            browser: webkit
            coverage: ""
          # Branded Microsoft Edge (a system package), not Playwright's Chromium
          - project: desktop-edge
            build: web
            browser: msedge
            coverage: ""
          # Phones and tablets, against the web build only. Samsung Internet shares
          # Android Chrome's engine; see "Supported browsers" in README.md.
          - project: android-chrome
            build: web
            browser: chromium
            coverage: ""
          - project: android-chrome-landscape
            build: web
            browser: chromium
            coverage: ""
          - project: galaxy-chrome
            build: web
            browser: chromium
            coverage: ""
          - project: ipad-safari
            build: web
            browser: webkit
            coverage: ""
          - project: ipad-safari-landscape
            build: web
            browser: webkit
            coverage: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Builds the app first (tests/global-setup.js)
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true
          BUILD: ${{ matrix.build }}
          # Fails the run below 98% coverage; see tests/coverage.js
          COVERAGE: ${{ matrix.coverage }}
      - name: Coverage summary
        if: always() && matrix.coverage && hashFiles(format('coverage/{0}/summary.json', matrix.build)) != ''
        run: node scripts/coverage-summary.mjs "$BUILD" >> "$GITHUB_STEP_SUMMARY"
        env:
          BUILD: ${{ matrix.build }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.coverage
        with:
          name: coverage-report-${{ matrix.build }}
          path: coverage/${{ matrix.build }}/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.build }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out a merge commit; its first parent is the base
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Infra and backend checks run on every push, release and manual run,
          # and on pull requests that touch their directory or this workflow.
          # infra/ imports the table schema from backend/src/data, so a backend
          # change runs the infra checks too.
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if grep -Eq '^(infra/|backend/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(backend/|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  infra:
    name: Infra (lint, test, cdk-nag synth, audit)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      # Account-agnostic synth (no AWS credentials). cdk-nag AwsSolutions runs
      # as a validation plugin and fails the synth on any unacknowledged finding.
      # Only us-east-1 is deployed today; us-west-2 is synthesized too so the
      # second region stays one config change away (ADR 0010). npm test also
      # synths every stack, identity and web included, in each region with cdk-nag.
      - run: npm run synth
      - run: npm run synth:all-regions

  backend:
    name: Backend (lint, DynamoDB Local tests, audit)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The data-access tests run every ADR 0005 access pattern against it
      dynamodb:
        image: amazon/dynamodb-local:3.0.0
        ports:
          - 8000:8000
    defaults:
      run:
        working-directory: backend
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      # tsc, and ESLint with the rule that bans DynamoDB clients outside src/data
      - run: npm run lint
      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null "$DYNAMODB_ENDPOINT"; then exit 0; fi
            sleep 1
          done
          echo "::error::DynamoDB Local did not start"
          exit 1
      - run: npm test
        env:
          CI: true

  ci-passed:
    name: CI passed
    if: always()
    needs: [pr-title, lint, workflows, scripts, secrets, regions, dependencies, codeql, test, changes, infra, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
