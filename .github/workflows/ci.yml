name: CI

# "CI passed" is the one required status check on main. It succeeds only when
# every job below succeeded or was skipped because it doesn't apply to the event.
#
# Pull requests run the browser tests in desktop Chrome and iPhone Safari only.
# The merge queue, pushes to main, manual runs and the nightly run use every
# browser, so the full matrix still gates main.
#
# A pull request, merge queue group or push to main that changes only the beads
# export (.beads/issues.jsonl) runs just the PR title check, the secret scan and
# CodeQL: the export is public bead text, and nothing else reads it. CodeQL still
# runs because main's ruleset has a code_scanning rule that blocks a merge until
# the pull request has CodeQL results for every language main has. The changes job
# decides this (beads_only); nightly, manual and called runs always run everything.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  # The release workflow starts CI on release-please's pull request, because
  # pull requests opened by GITHUB_TOKEN don't trigger workflows on their own.
  workflow_dispatch:
  workflow_call:
    inputs:
      # Only set on a called run (the release workflow), so the changes job can
      # tell it apart from the push that started it and always run everything
      called:
        type: boolean
        default: true

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. Every other
# run (each push to main, merge queue group, nightly, manual and called run) gets a
# group of its own, so none of them is ever cancelled or replaced. GitHub keeps only
# one pending run per group: when main's group was the branch, a beads export
# pushed right after a feature commit replaced the feature commit's waiting run,
# and that commit never got its full browser matrix (or the "CI passed" check the
# deploy workflow looks for on a release commit).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Squash merges use the PR title as the commit message, and release-please
          # reads commit messages to pick the next version.
          pattern='^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'fix: …', 'feat: …' or 'feat(scope)!: …'. Got: $TITLE"
            exit 1
          fi

  lint:
    name: Lint and validate HTML
    needs: changes
    if: needs.changes.outputs.beads_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Only journeys.yml may name the journey tests' environment, and nothing a pull request starts
      # may reach it (supply-checkout-o60.4). It parses the workflows with the yaml package.
      - run: node scripts/check-workflow-environments.mjs
      # In the deploy workflow, no job that can request the production OIDC token runs the
      # release commit's code before an apply approval (supply-checkout-pbp.39)
      - run: node scripts/check-deploy-workflow.mjs
      # The operator page's logic (ops/lib/), with a 100% coverage gate; its UI runs in the
      # Playwright suites (tests/ops.spec.js, with BUILD=web)
      - run: npm run test:ops
      # Every built journey step has a test and every critical journey an alarm, and
      # docs/journeys.md matches journeys/registry.json. It lists the Playwright tests,
      # which load the build the lint step just made.
      - run: npm run journeys:trace
      # The prod journey specs (tests/prod/, supply-checkout-o60.5) load: a broken import or
      # fixture fails the PR before the suite first runs against prod. Listing runs no test,
      # no global setup and nothing against prod, and needs no secret.
      - run: npm run journeys:prod:list

  workflows:
    name: Lint GitHub workflows
    needs: changes
    if: needs.changes.outputs.beads_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tarball" gitleaks
      # A pull request scans only its own commits (base..head), so a flagged
      # string on some other branch can't fail every PR. The merge queue, pushes
      # to main, and the nightly and manual runs scan every commit on every
      # branch, which is gitleaks' default.
      - name: Scan the pull request's commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --redact --no-banner --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .
      - name: Scan every commit for secrets
        if: github.event_name != 'pull_request'
        run: ./gitleaks git --redact --no-banner --verbose .
      - name: Scan files for AWS identifiers and email addresses
        run: node scripts/check-public-safety.mjs
      - name: No merge or patch leftovers (*.orig, *.rej)
        run: node scripts/check-stray-files.mjs

  regions:
    name: No region names outside the config module
    needs: changes
    if: needs.changes.outputs.beads_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ADR 0010: region names appear only in infra/lib/config.ts. Lambdas read
      # AWS_REGION and stacks take their region as a parameter.
      - run: node scripts/check-region-strings.mjs
      # A name CDK generates for PhysicalName.GENERATE_IF_NEEDED hashes in the account, which the
      # deploy's placeholder swap (scripts/assembly-pack.sh) and the public diff's scrubbing of
      # 12-digit runs can't take out (supply-checkout-pbp.39), so the stacks don't use it.
      - name: No generated physical names
        run: |
          if grep -rnE 'GENERATE_IF_NEEDED|generatePhysicalName' infra/lib infra/bin; then
            echo "::error::PhysicalName.GENERATE_IF_NEEDED hashes the account into the template, whose diff the deploy prints in a public log: name the resource instead"
            exit 1
          fi

  scripts:
    name: Shell scripts (shellcheck, land-pr tests)
    needs: changes
    if: needs.changes.outputs.beads_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # check-workflow-environments' tests need the yaml package
      - run: npm ci
      # shellcheck and jq come with the runner image
      - run: npm run test:scripts

  dependencies:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.beads_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # High and critical advisories fail, except the expiring exceptions in scripts/npm-audit-exceptions.json (see their reasons).
      - run: node scripts/npm-audit.mjs
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: moderate

  # Runs on beads-only changes too: main's code_scanning rule needs CodeQL
  # results for each language (javascript-typescript and actions) on every PR.
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  test:
    name: Tests (${{ matrix.project }}, ${{ matrix.build }} build)
    needs: changes
    if: needs.changes.outputs.beads_only != 'true'
    runs-on: ubuntu-latest
    # 20 minutes for the tests plus the browser install's 10-minute bound
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Chosen by the changes job: see the "Choose the browser matrix" step
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Browsers and their OS packages come from caches when they can (see "Browsers
      # in CI" in docs/testing.md). On 2026-10-01 the Ubuntu mirror served WebKit's
      # OS packages so slowly that 'playwright install --with-deps webkit' ran into
      # the job's timeout. The browsers' key names the Playwright version, so a
      # version bump starts fresh. These jobs hold no credentials, and a pull request's run can
      # only save caches into its own branch's scope, never into main's.
      - name: Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
          # The runner sets ImageOS (ubuntu24) in the shell, not in the env context
          echo "image-os=$ImageOS" >> "$GITHUB_OUTPUT"
      # Edge is a system package installed under /opt, so it has nothing to cache here
      - name: Restore the Playwright browsers
        id: browsers
        if: matrix.browser != 'msedge'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}
      # The .deb files apt downloaded for the browser's OS packages, keyed by the
      # files' names (so by package versions). This restores the newest set for
      # the browser and Ubuntu release; apt downloads only what isn't in it.
      - name: Restore the browser's OS packages
        id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-debs
          # Never an exact hit: a key that names this run, so the prefix decides
          key: playwright-debs-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ steps.pw.outputs.image-os }}-run-${{ github.run_id }}
          restore-keys: playwright-debs-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ steps.pw.outputs.image-os }}-
      # Bounded, so a slow mirror or download can't eat the tests' time. The first
      # try gets 90 seconds (a normal install takes under one minute, and about 20
      # seconds from the cache); the second and third get 3 minutes each, without
      # the runner's first mirror (azure.archive.ubuntu.com), the one that was slow
      - name: Install the browser and its OS packages
        id: install
        timeout-minutes: 10
        env:
          BROWSER: ${{ matrix.browser }}
          KEY_PREFIX: playwright-debs-${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ steps.pw.outputs.image-os }}-
        run: |
          debs="$HOME/.cache/playwright-debs"
          mkdir -p "$debs"
          if compgen -G "$debs/*.deb" > /dev/null; then sudo cp "$debs"/*.deb /var/cache/apt/archives/; fi
          echo "$(find "$debs" -name '*.deb' | wc -l) cached .deb files"
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          mirrors=/etc/apt/apt-mirrors.txt
          cli="node_modules/playwright-core/cli.js"
          node="$(command -v node)"
          status=1
          for try in 1 2 3; do
            if [[ "$try" -gt 1 && -f "$mirrors" ]] && grep -v azure "$mirrors" | grep -q .; then
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
              echo "Mirrors now:"; cat "$mirrors"
            fi
            # As root, so the timeout also stops apt-get. A stopped try can leave dpkg
            # half-configured, which the next try finishes first.
            sudo dpkg --configure -a
            limit=3m
            if [[ "$try" -eq 1 ]]; then limit=90s; fi
            if sudo timeout -k 15s "$limit" "$node" "$cli" install-deps "$BROWSER" &&
              timeout -k 15s 3m "$node" "$cli" install "$BROWSER"; then
              echo "Installed $BROWSER on try $try"
              status=0
              break
            fi
            echo "::warning::Installing $BROWSER failed or took over $limit (try $try of 3)"
          done
          # Keep every file apt finished downloading, even after a failed install, so
          # the next run starts from there
          cp /var/cache/apt/archives/*.deb "$debs"/ 2> /dev/null || true
          if [[ "$status" -eq 0 ]]; then
            # Then drop the files for versions that aren't installed (superseded ones)
            for f in "$debs"/*.deb; do
              [[ -e "$f" ]] || continue
              pkg="$(dpkg-deb -f "$f" Package)"
              if [[ "$(dpkg-query -W -f='${Version}' "$pkg" 2> /dev/null)" != "$(dpkg-deb -f "$f" Version)" ]]; then rm -f "$f"; fi
            done
          fi
          count="$(find "$debs" -name '*.deb' | wc -l)"
          echo "$count .deb files to cache"
          if [[ "$count" -gt 0 ]]; then
            echo "debs-key=${KEY_PREFIX}$(find "$debs" -name '*.deb' -printf '%f\n' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Save the Playwright browsers
        if: steps.browsers.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
      # Also after a failed install, when the set of files changed
      - name: Save the browser's OS packages
        if: ${{ !cancelled() && steps.install.outputs.debs-key != '' && steps.install.outputs.debs-key != steps.debs.outputs.cache-matched-key }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.install.outputs.debs-key }}
      # Builds the app first (tests/global-setup.js)
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          CI: true
          BUILD: ${{ matrix.build }}
          # Fails the run below 98% coverage; see tests/coverage.js
          COVERAGE: ${{ matrix.coverage }}
      - name: Coverage summary
        if: always() && matrix.coverage && hashFiles(format('coverage/{0}/summary.json', matrix.build)) != ''
        run: node scripts/coverage-summary.mjs "$BUILD" >> "$GITHUB_STEP_SUMMARY"
        env:
          BUILD: ${{ matrix.build }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.coverage
        with:
          name: coverage-report-${{ matrix.build }}
          path: coverage/${{ matrix.build }}/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.build }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
      backend: ${{ steps.diff.outputs.backend }}
      beads_only: ${{ steps.diff.outputs.beads_only }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out a merge commit; its first parent is the base
          fetch-depth: 2
      - name: Choose the browser matrix
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # web: the hashed static bundle for CloudFront, plus the demo build for
          # supplycheckout.com (tests/demo.spec.js and the CSP tests run with the
          # web build). Coverage is measured in Chromium, the only browser that
          # reports it. Pull requests run only these two jobs.
          core='[
            {"build": "web", "project": "desktop-chrome", "browser": "chromium", "coverage": "1"},
            {"build": "web", "project": "iphone-safari", "browser": "webkit", "coverage": ""}
          ]'
          # The other supported browsers. Edge is
          # branded Microsoft Edge (a system package), not Playwright's Chromium.
          # Samsung Internet shares Android Chrome's engine; see "Supported
          # browsers" in docs/testing.md.
          more='[
            {"build": "web", "project": "desktop-firefox", "browser": "firefox", "coverage": ""},
            {"build": "web", "project": "desktop-safari", "browser": "webkit", "coverage": ""},
            {"build": "web", "project": "desktop-edge", "browser": "msedge", "coverage": ""},
            {"build": "web", "project": "android-chrome", "browser": "chromium", "coverage": ""},
            {"build": "web", "project": "android-chrome-landscape", "browser": "chromium", "coverage": ""},
            {"build": "web", "project": "galaxy-chrome", "browser": "chromium", "coverage": ""},
            {"build": "web", "project": "ipad-safari", "browser": "webkit", "coverage": ""},
            {"build": "web", "project": "ipad-safari-landscape", "browser": "webkit", "coverage": ""}
          ]'
          if [[ "$EVENT" == "pull_request" ]]; then more='[]'; fi
          matrix="$(jq -cn --argjson core "$core" --argjson more "$more" '{include: ($core + $more)}')"
          echo "$matrix" | jq -r '.include[] | "\(.project), \(.build) build"'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          # "true" only on a run called by another workflow (see workflow_call)
          CALLED: ${{ inputs.called }}
          # The commit on main that the merge queue built this group on
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          # Infra and backend checks run on every push, release, manual and
          # nightly run, and on pull requests and merge queue groups that touch
          # their directory or this workflow. infra/ imports the table schema
          # from backend/src/data, so a backend change runs the infra checks too.
          #
          # beads_only is true when the pull request, merge queue group or push
          # to main changes .beads/issues.jsonl and nothing else. Most jobs skip
          # then (not the PR title check, the secret scan or CodeQL). Nightly, manual and called runs always run everything.
          full=false
          case "$EVENT" in
            pull_request) base="HEAD^1" ;;
            merge_group)
              # A group can hold several pull requests, so compare with the main
              # commit it was built on rather than the parent commit
              git fetch -q --depth=1 origin "$QUEUE_BASE"
              base="$QUEUE_BASE" ;;
            push)
              # main takes squash merges only, so each push is one commit
              base="HEAD^1"; full=true ;;
            *) base=""; full=true ;;
          esac
          if [[ "$CALLED" == "true" ]]; then base=""; fi
          changed=""
          if [[ -n "$base" ]]; then
            changed=$(git diff --name-only "$base" HEAD)
            echo "$changed"
          fi
          # An empty diff doesn't count
          if [[ -n "$changed" ]] && ! grep -Ev '^\.beads/issues\.jsonl$' <<< "$changed" > /dev/null; then
            echo "Only the beads export changed: skipping the jobs that don't read it"
            echo "beads_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "beads_only=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$full" == "true" ]]; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(infra/|backend/|scripts/npm-audit|scripts/vitest-coverage|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi
          # docs/api/openapi.yaml is checked against the routes by a backend test, and
          # scripts/vitest-coverage.mjs is both jobs' coverage gate
          if grep -Eq '^(backend/|docs/api/|scripts/vitest-coverage|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  infra:
    name: Infra (lint, test, cdk-nag synth, audit)
    needs: changes
    if: needs.changes.outputs.infra == 'true' && needs.changes.outputs.beads_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            infra/package-lock.json
            backend/package-lock.json
      - run: npm ci
      # The synth bundles the Lambda handlers with esbuild from backend/
      - name: Install backend dependencies for bundling
        run: npm ci
        working-directory: backend
      # Fails on high or critical advisories, except narrow, expiring
      # exceptions in scripts/npm-audit-exceptions.json (see their reasons).
      - run: node ../scripts/npm-audit.mjs
      - run: npm run lint
      # Fails below infra/coverage-thresholds.json for lib/ and bin/, and posts a
      # coverage table to the job summary (scripts/vitest-coverage.mjs)
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('infra/coverage/coverage-final.json') != ''
        with:
          name: coverage-report-infra
          path: infra/coverage/
          retention-days: 14
      # Account-agnostic synth (no AWS credentials). cdk-nag AwsSolutions runs
      # as a validation plugin and fails the synth on any unacknowledged finding.
      # Only us-east-1 is deployed today; us-west-2 is synthesized too so the
      # second region stays one config change away (ADR 0010). npm test also
      # synths every stack, identity and web included, in each region with cdk-nag.
      - run: npm run synth
      # The deploy workflow's apply jobs synthesize again and must reach the plan's hash
      # (scripts/assembly-hash.sh), so two synths of one commit into the same folder must match.
      # The same folder: the Lambda source maps hold paths relative to it.
      - name: Two synths give the same deploy hash
        run: |
          first="$(bash ../scripts/assembly-hash.sh cdk.out)"
          mv cdk.out "$RUNNER_TEMP/first-synth"
          npx cdk synth --quiet
          second="$(bash ../scripts/assembly-hash.sh cdk.out)"
          echo "$first $second"
          if [[ "$first" != "$second" ]]; then echo "::error::Two synths of this commit differ, so the deploy's plan/apply hash check would always fail"; exit 1; fi
      # The deploy's synth job uploads the assembly with the account ID swapped for a placeholder
      # and the whole sealed (scripts/assembly-pack.sh, scripts/assembly-seal.mjs), and its plan
      # job opens it, swaps the account back and checks it (scripts/check-assembly.mjs, with the
      # account, region and bootstrap qualifier): with an account, as there, the unpacked copy
      # must pass the check and reach the synth's own hash, or no deploy could pass its plan. And
      # the sealed file must show neither the account nor any packed file's SHA-256.
      - name: A packed, sealed, opened and unpacked assembly keeps its hash
        env:
          ACCOUNT: "111122223333"
        run: |
          rm -rf cdk.out
          CDK_DEFAULT_ACCOUNT="$ACCOUNT" npx cdk synth --quiet
          synth="$(bash ../scripts/assembly-hash.sh cdk.out)"
          bash ../scripts/assembly-pack.sh pack cdk.out "$RUNNER_TEMP/packed/backup-copy-true" "$ACCOUNT"
          mkdir "$RUNNER_TEMP/packed/expected-hash"
          echo "$synth" > "$RUNNER_TEMP/packed/expected-hash/backup-copy-true"
          DEPLOY_ASSEMBLY_KEY="$(openssl rand -base64 32)"
          export DEPLOY_ASSEMBLY_KEY
          node ../scripts/assembly-seal.mjs seal "$RUNNER_TEMP/packed" "$RUNNER_TEMP/assembly.sealed"
          node ../scripts/assembly-seal.mjs open "$RUNNER_TEMP/assembly.sealed" "$RUNNER_TEMP/opened"
          bash ../scripts/assembly-pack.sh unpack "$RUNNER_TEMP/opened/backup-copy-true" "$RUNNER_TEMP/unpacked" "$ACCOUNT"
          node ../scripts/check-assembly.mjs "$RUNNER_TEMP/unpacked" --account "$ACCOUNT" --region us-east-1 \
            --qualifier "$(jq -r '.context["@aws-cdk/core:bootstrapQualifier"] // "hnb659fds"' cdk.json)"
          unpacked="$(bash ../scripts/assembly-hash.sh "$RUNNER_TEMP/unpacked")"
          echo "$synth $unpacked"
          if [[ "$synth" != "$unpacked" ]]; then echo "::error::The packed and unpacked assembly's hash isn't the synth's, so the deploy's plan would always fail"; exit 1; fi
          if [[ "$(cat "$RUNNER_TEMP/opened/expected-hash/backup-copy-true")" != "$synth" ]]; then echo "::error::The hash sealed with the assembly isn't the synth's"; exit 1; fi
          # The plan hands the apply jobs only the HMAC: an apply job's own synth must reach it
          plan_hmac="$(node ../scripts/assembly-seal.mjs hmac <<< "$unpacked")"
          apply_hmac="$(bash ../scripts/assembly-hash.sh cdk.out | node ../scripts/assembly-seal.mjs hmac)"
          if [[ ! "$plan_hmac" =~ ^[0-9a-f]{64}$ || "$plan_hmac" != "$apply_hmac" || "$plan_hmac" == "$synth" ]]; then echo "::error::The plan's and an apply job's hash HMACs don't match"; exit 1; fi
          if grep -qaF "$ACCOUNT" "$RUNNER_TEMP/assembly.sealed"; then echo "::error::The sealed assembly shows the account ID"; exit 1; fi
          if grep -qaF "$synth" "$RUNNER_TEMP/assembly.sealed"; then echo "::error::The sealed assembly shows the assembly's hash"; exit 1; fi
          for file in cdk.out/*.json "$RUNNER_TEMP"/packed/backup-copy-true/*; do
            if grep -qaF "$(sha256sum "$file" | cut -d' ' -f1)" "$RUNNER_TEMP/assembly.sealed"; then echo "::error::The sealed assembly shows the SHA-256 of $file"; exit 1; fi
          done
      - run: npm run synth:all-regions
      # The backup account's vault stack is a separate CDK app (bin/backup-account.ts)
      - run: npm run synth:backup-account
      # GitHub Actions' OIDC deploy role is a separate CDK app too (bin/github-deploy.ts)
      - run: npm run synth:github-deploy
      # And the journey tests' mailbox, buckets and role (bin/journeys.ts)
      - run: npm run synth:journeys

  backend:
    name: Backend (lint, DynamoDB Local tests, audit)
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.beads_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # The data-access tests run every ADR 0005 access pattern against it
      dynamodb:
        image: amazon/dynamodb-local:3.0.0
        ports:
          - 8000:8000
    defaults:
      run:
        working-directory: backend
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      # tsc, and ESLint with the rule that bans DynamoDB clients outside src/data
      - run: npm run lint
      - name: Wait for DynamoDB Local
        run: |
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null "$DYNAMODB_ENDPOINT"; then exit 0; fi
            sleep 1
          done
          echo "::error::DynamoDB Local did not start"
          exit 1
      # Fails below backend/coverage-thresholds.json for src/, and posts a
      # coverage table to the job summary (scripts/vitest-coverage.mjs)
      - run: npm run test:coverage
        env:
          CI: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('backend/coverage/coverage-final.json') != ''
        with:
          name: coverage-report-backend
          path: backend/coverage/
          retention-days: 14

  ci-passed:
    name: CI passed
    if: always()
    needs: [pr-title, lint, workflows, scripts, secrets, regions, dependencies, codeql, test, changes, infra, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
