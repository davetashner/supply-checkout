name: Release

# release-please keeps a "chore(main): release x.y.z" pull request up to date
# from Conventional Commit messages. Merging it tags the version and creates a
# GitHub Release; an SPDX SBOM is attached once the full check suite passes, and
# then the journey evidence pack (a report, one video per journey and the traces).
# Once the checks pass it also starts the deploy workflow for the tag, which waits for the
# owner's approval in the production environment (docs/releases.md, "Deploying a release").
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node

  release-notes:
    # The What's New notes for the release (docs/releases.md, "What's New notes"): feat PRs write
    # them under "upcoming" in src/whats-new.json, and here, each time release-please opens or
    # rebuilds its pull request, they're stamped with the release's version and CHANGELOG.md date
    # and pushed to its branch. release-please's extra-files can't stamp a date into JSON, and
    # rebuilds the branch from main, so this runs after every rebuild. Runs only main's
    # scripts/check-whats-new.mjs (node built-ins, no npm install), and the checkout keeps no
    # credentials: the token reaches only the push step.
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Stamp the upcoming notes
        run: node scripts/check-whats-new.mjs --stamp
      - name: Push the stamp to the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/whats-new.json; then
            echo "Nothing to stamp"
            exit 0
          fi
          version="$(node -p 'require("./package.json").version')"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --signoff -m "chore: stamp the What's New notes for ${version}" -- src/whats-new.json
          # The token as an HTTP header for this one command, as actions/checkout would set it
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${BRANCH}"

  release-pr-checks:
    # Pull requests opened by GITHUB_TOKEN don't trigger CI, but main requires
    # "CI passed" before merging, so start CI on the release branch directly,
    # once its What's New notes are stamped.
    needs: [release-please, release-notes]
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run CI on the release pull request
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

  checks:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # CI's CodeQL job uploads its results to code scanning
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  deploy:
    # A release created with GITHUB_TOKEN triggers no workflows, but a workflow_dispatch does, so
    # start the deploy here, on main's deploy workflow, once the full check suite has passed.
    # This job has no AWS access: the deploy workflow checks the tag again and asks for approval.
    needs: [release-please, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the prod deploy
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  attach:
    needs: [release-please, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Generate an SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: supply-checkout-${{ needs.release-please.outputs.tag_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach the SBOM to the release
        run: gh release upload "$TAG" "supply-checkout-$TAG.spdx.json" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  evidence:
    # The journey evidence pack (docs/releases.md): records the tests tagged with journey steps
    # from the tag, with video, trace and a screenshot at each step's end, and builds the report.
    # It runs against the test suite's fakes and demo data (tests/fake-aws.js, tests/mock-claude.js):
    # release assets are public, so this job gets no secrets, no cloud credentials and a read-only
    # token, and the upload is a separate job.
    needs: [release-please, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # One test at a time in one Chromium. A failed test still gets its video and is shown failed
      # in the report, so the pack is attached either way (CI passed on this commit just before):
      # record.mjs exits 1 for that. It exits 2 when it couldn't record at all (a build, the test
      # listing or the run failed), and then this step fails, with the reason in its log
      - name: Record the journeys
        id: record
        run: |
          set +e
          npm run journeys:video -- --headless --evidence
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "tests-failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
      - name: Build the report
        run: npm run journeys:report -- --tag "$TAG" --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
      - name: Bundle the traces
        working-directory: dist/journey-videos
        run: zip -q -r journey-traces.zip evidence -i '*.zip'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-evidence
          path: |
            dist/journey-videos/journey-evidence.html
            dist/journey-videos/*.webm
            dist/journey-videos/journey-traces.zip
          if-no-files-found: error
          retention-days: 7
      - name: Report failed journey tests
        if: steps.record.outputs.tests-failed == 'true'
        run: echo "::warning::Some journey tests failed while recording; the evidence report shows which"

  evidence-upload:
    needs: [release-please, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: journey-evidence
          path: evidence
      - name: Attach the evidence report, videos and traces to the release
        run: gh release upload "$TAG" evidence/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
