name: Release

# release-please keeps a "chore(main): release x.y.z" pull request up to date
# from Conventional Commit messages. Merging it tags the version and creates a
# GitHub Release; the claude.ai artifact (dist/artifact/index.html, built from
# the tag) and an SPDX SBOM are attached once the full check suite passes.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node

  release-pr-checks:
    # Pull requests opened by GITHUB_TOKEN don't trigger CI, but main requires
    # "CI passed" before merging, so start CI on the release branch directly.
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run CI on the release pull request
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

  checks:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # CI's CodeQL job uploads its results to code scanning
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci.yml

  attach:
    needs: [release-please, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Generate an SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: supply-checkout-${{ needs.release-please.outputs.tag_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the claude.ai artifact
        run: npm run build:artifact
      - name: Attach index.html and the SBOM to the release
        run: gh release upload "$TAG" dist/artifact/index.html "supply-checkout-$TAG.spdx.json" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
